      }
    }
    await loadAll();
    alert(`「${name}」として複製しました(掲載商品${rows.length}点)。\n共有リンクは複製元とは別の新しいURLになります。`);
  };

  const handleDelete = async (id) => {
    if (!window.confirm("このカタログを削除しますか?共有リンクも無効になります。")) return;
    const { error } = await supabase.from("catalogs").delete().eq("id", id);
    if (error) { alert("削除に失敗しました"); return; }
    loadAll();
  };

  return (
    <div className="px-4 md:px-6 py-6 md:py-8 max-w-5xl mx-auto w-full space-y-5">
      <div className="flex items-center justify-end">
        <button
          onClick={openNew}
          className="rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap"
          style={{ background: "var(--mz-gold)", color: "#1a1710" }}
        >
          + 新規カタログ
        </button>
      </div>

      {error && <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>}
      {catalogs === null && !error && <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>}
      {catalogs !== null && catalogs.length === 0 && !error && (
        <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>カタログが登録されていません</p>
      )}

      {catalogs !== null && catalogs.length > 0 && (
        <div className="space-y-2">
          {catalogs.map((c) => (
            <CatalogCard
              key={c.id}
              catalog={c}
              itemCount={c.catalog_items?.[0]?.count || 0}
              onEdit={openEdit}
              onDuplicate={handleDuplicate}
              onDelete={handleDelete}
              onShare={setShareTarget}
            />
          ))}
        </div>
      )}

      {modalCatalog && (
        <CatalogFormModal catalog={modalCatalog} initialItems={modalInitialItems} onClose={() => setModalCatalog(null)} onSave={handleSave} />
      )}
      {shareTarget && (
        <ShareCatalogModal catalog={shareTarget} onClose={() => setShareTarget(null)} />
      )}
    </div>
  );
}

/* ============================================================
   経費(expenses)
   ・列構成はSupabase側の既存テーブルに合わせる(2026-07-09確認)
   ・選択肢定数(勘定科目/税区分/支払方法)は、必ずSupabase側のCHECK制約(pg_constraint)の
     実際の値と一致させること。2026-07-09時点で以下のSQLで確認した値を反映済み:
       select conname, pg_get_constraintdef(oid) from pg_constraint
       where conrelid = 'expenses'::regclass and contype = 'c';
   ・entry_method は "手動"(通常の入力) / "AI自動"(AIレシート読み込みからの下書きをそのまま登録した場合)を
     フォームの出所に応じて自動セットする(手動編集不可)。
   ============================================================ */
const EXPENSE_ACCOUNT_CATEGORY_OPTIONS = [
  "消耗品費", "旅費交通費", "通信費", "会議費", "接待交際費", "広告宣伝費",
  "支払手数料", "荷造運賃(送料)", "地代家賃", "水道光熱費", "租税公課", "外注費", "仕入高", "雑費", "その他",
];
const EXPENSE_TAX_CATEGORY_OPTIONS = ["課税10%", "課税8%(軽減)", "非課税", "対象外"];
const EXPENSE_PAYMENT_METHOD_OPTIONS = ["立替(悟)", "小口", "法人銀行口座", "法人クレジットカード", "立替(公洋)", "立替(裕之)"];
const EXPENSE_REIMBURSEMENT_STATUS_OPTIONS = ["未精算", "精算済み"];

/* ★2026-08-22追加: 支払方法のうち「立替」に当たるもの(2.39参照)。
   外注費請求書の立替精算で「どの担当者の立替か」を判定するキーとして使う。
   EXPENSE_PAYMENT_METHOD_OPTIONS から派生させているため、Supabase側のCHECK制約に
   立替の種類を追加したときは、上の定数を直すだけでこちらも自動的に追従する。 */
const EXPENSE_ADVANCE_PAYMENT_METHODS = EXPENSE_PAYMENT_METHOD_OPTIONS.filter((m) => m.startsWith("立替"));

/* ★2026-08-24追加: 税込金額から消費税額を割り戻す(2.51参照)。
   国税庁の示す方法どおり、税込価格から「税率/(100+税率)」を掛けて求める。
   ・課税10%      … 金額 × 10 ÷ 110
   ・課税8%(軽減) … 金額 ×  8 ÷ 108
   ・非課税 / 対象外 … 0
   **1円未満は切り捨てで統一する**(Math.floor)。四捨五入や切り上げと混ぜないこと。 */
const EXPENSE_TAX_RATE_BY_CATEGORY = { "課税10%": 10, "課税8%(軽減)": 8, "非課税": 0, "対象外": 0 };
function calcExpenseTaxJpy(amountInclTax, taxCategory) {
  const amount = Number(amountInclTax);
  if (!Number.isFinite(amount) || amount <= 0) return 0;
  const rate = EXPENSE_TAX_RATE_BY_CATEGORY[taxCategory];
  if (!rate) return 0;
  return Math.floor((amount * rate) / (100 + rate));
}
const isAdvancePaymentMethod = (pm) => EXPENSE_ADVANCE_PAYMENT_METHODS.includes(pm);

function ExpenseReimbursementBadge({ status }) {
  if (!status) return null;
  const styles = {
    "未精算": { bg: "#3a3220", color: "var(--mz-gold-soft)" },
    "精算済み": { bg: "#1f3a2a", color: "#8fd6ab" },
  };
  const s = styles[status] || { bg: "#33301F", color: "var(--mz-ink-muted)" };
  return (
    <span className="text-xs px-2 py-0.5 rounded-full shrink-0" style={{ background: s.bg, color: s.color }}>
      {status}
    </span>
  );
}

/* ---- AIレシート読み込みカード ----
   ・画像/PDFをドラッグ&ドロップまたはクリックで選択
   ・アップロード(uploadExpenseReceiptFile)→AI自動抽出(extractExpenseInfoFromImage)を連続実行し、
     結果を親(ExpensesPage)へ渡して下の入力フォームに反映する。DBへの経費登録は行わない(あくまで下書き反映のみ)。 */
function AiReceiptReaderCard({ onExtracted }) {
  const [dragOver, setDragOver] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);
  const busy = uploading || extracting;

  const handleFile = async (file) => {
    if (!file) return;
    setError(null);
    setUploading(true);
    const uploadRes = await uploadExpenseReceiptFile(file);
    setUploading(false);
    if (!uploadRes.ok) { setError(uploadRes.message); return; }

    setExtracting(true);
    try {
      const info = await extractExpenseInfoFromImage(uploadRes.url);
      onExtracted(mapExtractedExpenseInfo(info), uploadRes.url);
    } catch (err) {
      setError(err.message || "AI自動抽出に失敗しました");
    } finally {
      setExtracting(false);
    }
  };

  const handleFiles = (files) => {
    const file = files && files[0];
    if (file) handleFile(file);
  };

  return (
    <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
      <h2 className="font-display text-base">AIレシート読み込み(画像・PDF→自動入力)</h2>
      <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
        レシート・領収書の画像またはPDFをアップロードすると、支払日・支払先・品目・金額・税区分・勘定科目・インボイス番号を自動で読み取り、下の入力欄に反映します。
      </p>

      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => {
          e.preventDefault();
          setDragOver(false);
          handleFiles(e.dataTransfer.files);
        }}
        onClick={() => !busy && inputRef.current && inputRef.current.click()}
        className="rounded-lg p-8 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors text-center"
        style={{
          border: `1.5px dashed ${dragOver ? "var(--mz-gold)" : "var(--mz-border)"}`,
          background: dragOver ? "var(--mz-surface-hover)" : "transparent",
        }}
      >
        <Icon name="file" className="w-8 h-8" style={{ color: "var(--mz-ink-muted)" }} />
        <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>
          {uploading ? "アップロード中..." : extracting ? "AIが読み取り中..." : "クリックまたはドラッグ&ドロップ"}
        </p>
        {!busy && <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>JPG / PNG / PDF対応</p>}
        <input
          ref={inputRef} type="file" accept="image/*,application/pdf" className="hidden"
          onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }}
        />
      </div>

      {error && (
        <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>
      )}
    </div>
  );
}

/* ---- 経費 常設入力フォーム(モーダルではなくページ本体に常設。新規/編集を兼ねる) ----
   ・expense.idがあれば編集モード、なければ新規モード(AIレシート読み込みからの下書き反映時もid=nullの新規モード扱い)
   ・呼び出し側(ExpensesPage)が`key`propを変えることで、編集開始/AI反映/保存完了のたびに内部stateを再初期化する */
function ExpenseInlineForm({ expense, onSave, onCancel }) {
  const isNew = !expense.id;
  const [form, setForm] = useState({
    id: expense.id || null,
    payment_date: expense.payment_date || todayISO(),
    payee: expense.payee || "",
    payment_method: expense.payment_method || EXPENSE_PAYMENT_METHOD_OPTIONS[0],
    /* ★2026-08-22変更: 支払方法が「立替(◯)」なら、精算状況の初期値を「未精算」にする。
       従来は初期値が空("(立替なし)")だったため、立替を選んでもこちらを選び直さないと null のまま
       保存され、請求書の立替精算から静かに漏れる状態だった(実際に9件中6件がそうなっていた。2.39参照)。 */
    reimbursement_status: expense.reimbursement_status
      || (isAdvancePaymentMethod(expense.payment_method || EXPENSE_PAYMENT_METHOD_OPTIONS[0]) ? "未精算" : ""),
    invoice_number: expense.invoice_number || "",
    // ★2026-08-24: インボイス登録番号(T+13桁)と消費税額(2.51参照)
    invoice_registration_number: expense.invoice_registration_number || "",
    tax_amount_jpy: expense.tax_amount_jpy != null ? String(expense.tax_amount_jpy) : "",
    item_name: expense.item_name || "",
    account_category: expense.account_category || EXPENSE_ACCOUNT_CATEGORY_OPTIONS[0],
    tax_category: expense.tax_category || EXPENSE_TAX_CATEGORY_OPTIONS[0],
    amount_incl_tax: expense.amount_incl_tax != null ? String(expense.amount_incl_tax) : "",
    memo: expense.memo || "",
    receipt_file_url: expense.receipt_file_url || "",
    _aiOrigin: !!expense._aiOrigin, // AIレシート読み込みからの下書きをそのまま登録した場合はtrue(entry_method判定用)
  });
  const [saving, setSaving] = useState(false);
  const [uploadingReceipt, setUploadingReceipt] = useState(false);
  /* ★2026-08-24: 消費税額は金額・税区分から自動計算するが、レシートの記載額と1円ずれることがあるため
     手入力で上書きできる。手で触った後に自動計算で勝手に戻さないよう、touchedフラグで制御する(2.51参照)。 */
  const [taxTouched, setTaxTouched] = useState(expense.tax_amount_jpy != null);

  const autoTaxJpy = calcExpenseTaxJpy(form.amount_incl_tax, form.tax_category);
  // 金額・税区分を変えたら、手入力していない限り消費税額を自動で入れ直す
  useEffect(() => {
    if (taxTouched) return;
    setForm((f) => ({ ...f, tax_amount_jpy: f.amount_incl_tax ? String(autoTaxJpy) : "" }));
  }, [autoTaxJpy, taxTouched, form.amount_incl_tax]);

  const handleReceiptFile = async (file) => {
    setUploadingReceipt(true);
    const res = await uploadExpenseReceiptFile(file);
    setUploadingReceipt(false);
    if (!res.ok) { alert(res.message); return; }
    setForm((f) => ({ ...f, receipt_file_url: res.url }));
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.payment_date || !form.payee.trim() || !form.amount_incl_tax) return;
    setSaving(true);
    await onSave(form);
    setSaving(false);
  };

  return (
    <form
      onSubmit={handleSubmit}
      className="rounded-xl p-4 md:p-5 space-y-4"
      style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
    >
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h2 className="font-display text-lg">{isNew ? "経費入力" : "経費を編集"}</h2>
        {!isNew && (
          <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "rgba(199,168,105,0.15)", color: "var(--mz-gold-soft)" }}>
            編集中
          </span>
        )}
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>支払日</label>
          <input
            type="date"
            value={form.payment_date}
            onChange={(e) => setForm((f) => ({ ...f, payment_date: e.target.value }))}
            required
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>金額(税込)</label>
          <input
            type="number"
            inputMode="numeric"
            min="0"
            value={form.amount_incl_tax}
            onChange={(e) => setForm((f) => ({ ...f, amount_incl_tax: e.target.value }))}
            required
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
        </div>
      </div>

      <div>
        <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>支払先</label>
        <input
          type="text"
          value={form.payee}
          onChange={(e) => setForm((f) => ({ ...f, payee: e.target.value }))}
          required
          className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
        />
      </div>

      <div>
        <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>品目・内容(任意)</label>
        <input
          type="text"
          value={form.item_name}
          onChange={(e) => setForm((f) => ({ ...f, item_name: e.target.value }))}
          className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
        />
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>勘定科目</label>
          <select
            value={form.account_category}
            onChange={(e) => setForm((f) => ({ ...f, account_category: e.target.value }))}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          >
            {EXPENSE_ACCOUNT_CATEGORY_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>税区分</label>
          <select
            value={form.tax_category}
            onChange={(e) => setForm((f) => ({ ...f, tax_category: e.target.value }))}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          >
            {EXPENSE_TAX_CATEGORY_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>支払方法</label>
          <select
            value={form.payment_method}
            onChange={(e) => {
              const pm = e.target.value;
              setForm((f) => {
                /* 立替に切り替えたら精算状況を自動で「未精算」に、立替以外に戻したら空に戻す。
                   ただし既に「精算済み」にしてある場合は触らない(手で付けた確定情報を消さないため) */
                let rs = f.reimbursement_status;
                if (rs !== "精算済み") rs = isAdvancePaymentMethod(pm) ? "未精算" : "";
                return { ...f, payment_method: pm, reimbursement_status: rs };
              });
            }}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          >
            {EXPENSE_PAYMENT_METHOD_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>立替精算状況(任意)</label>
          <select
            value={form.reimbursement_status}
            onChange={(e) => setForm((f) => ({ ...f, reimbursement_status: e.target.value }))}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          >
            <option value="">(立替なし)</option>
            {EXPENSE_REIMBURSEMENT_STATUS_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>請求書番号(任意)</label>
          <input
            type="text"
            value={form.invoice_number}
            onChange={(e) => setForm((f) => ({ ...f, invoice_number: e.target.value }))}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
        </div>
        {/* ★2026-08-24: 適格請求書発行事業者の登録番号(T+13桁)。請求書番号とは別物(2.51参照) */}
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>インボイス登録番号(任意)</label>
          <input
            type="text" placeholder="T1234567890123"
            value={form.invoice_registration_number}
            onChange={(e) => setForm((f) => ({ ...f, invoice_registration_number: e.target.value }))}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
        </div>
      </div>

      {/* ★2026-08-24: 消費税額(2.51参照)。金額・税区分から自動計算し、必要なら手で直せる */}
      <div>
        <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>
          消費税額(内税) ― レシートに記載があればその金額、無ければ自動計算
        </label>
        <input
          type="number" min="0" step="1"
          value={form.tax_amount_jpy}

            {form.tax_category === "課税8%(軽減)" && "(税込 × 8 ÷ 108・1円未満切り捨て)"}
            {(form.tax_category === "非課税" || form.tax_category === "対象外") && "(税区分により0円)"}

              <button
                type="button"

                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}

          />

              className="text-xs mt-1 inline-block"
              style={{ color: "var(--mz-gold-soft)" }}

      </div>

      <div>
        <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>メモ(任意)</label>
        <textarea

          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}

          type="button"

        </button>
        <button
          type="submit"
          disabled={saving || uploadingReceipt}
          className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60"
          style={{ background: "var(--mz-gold)", color: "#1a1710" }}

      </div>
    </form>
  );
}

/* ---- 経費ページ本体 ----
   ・AIレシート読み込みカード → 常設入力フォーム(新規/編集兼用) → フィルタ・合計 → 一覧、の縦並び構成
   ・モーダルは使用しない(2026-07-09改修: 常設フォーム方式に変更) */
function ExpensesPage() {
  const [expenses, setExpenses] = useState(null); // null = 読み込み中
  const [error, setError] = useState(null);
  const [filterMonth, setFilterMonth] = useState("all"); // "all" | "YYYY-MM"
  const [filterCategory, setFilterCategory] = useState("all");
  const [formExpense, setFormExpense] = useState({}); // {}=新規(空), idを持つオブジェクト=編集, AI抽出結果(id無し)=新規への下書き反映
  const [formKey, setFormKey] = useState(0); // 変更するたびにExpenseInlineFormを再マウントし、内部stateを再初期化する
  /* ★2026-08-24: 経費入力はAIレシート読み込みが主導線のため、手動入力フォームは既定で折りたたむ。
     AI抽出で下書きが入ったときは自動的に開く(2.51参照)。 */
  const [manualOpen, setManualOpen] = useState(false);
  // 編集は一覧の行内で開く。上部フォームは新規登録専用にする
  const [editingId, setEditingId] = useState(null);

  const loadExpenses = useCallback(async () => {
    setError(null);
    const { data, error } = await supabase
      .from("expenses")
      .select("id,payment_date,payee,payment_method,reimbursement_status,invoice_number,invoice_registration_number,item_name,account_category,tax_category,amount_incl_tax,tax_amount_jpy,memo,receipt_file_url,entry_method,created_at")
      .order("payment_date", { ascending: false });
    /* 列不足(42703)は「マイグレーション未実行」と断定できるため、実行すべきSQLを名指しで出す(5章42番参照) */
    if (error) {
      setError(
        error.code === "42703"
          ? "経費データの取得に失敗しました。expensesに必要な列がありません。設計書2.51のマイグレーションSQL(invoice_registration_number / tax_amount_jpy の追加)を実行してください。"
          : `経費データの取得に失敗しました(${error.message || error.code || "原因不明"})`
      );
      setExpenses([]);
    } else {
      setExpenses(data || []);
    }
  }, []);

  useEffect(() => { loadExpenses(); }, [loadExpenses]);

  const monthOptions = useMemo(() => {
    if (!expenses) return [];
    const set = new Set(expenses.map((e) => (e.payment_date || "").slice(0, 7)).filter(Boolean));
    return Array.from(set).sort((a, b) => b.localeCompare(a));
  }, [expenses]);

  const filteredExpenses = useMemo(() => {
    if (!expenses) return [];
    return expenses.filter((e) => {
      if (filterMonth !== "all" && !(e.payment_date || "").startsWith(filterMonth)) return false;
      if (filterCategory !== "all" && e.account_category !== filterCategory) return false;
      return true;
    });
  }, [expenses, filterMonth, filterCategory]);

  const totalAmount = useMemo(
    () => filteredExpenses.reduce((sum, e) => sum + (Number(e.amount_incl_tax) || 0), 0),
    [filteredExpenses]
  );

  const resetForm = () => {
    setFormExpense({});
    setFormKey((k) => k + 1);
    setEditingId(null);
  };

  const handleEdit = (expense) => {
    setEditingId(expense.id);
  };

  /* ---- AIレシート読み込みカードからの反映。id無しの新規下書きとしてフォームへ流し込む ---- */
  const handleExtracted = (mappedFields, uploadedUrl) => {
    setFormExpense({ ...mappedFields, receipt_file_url: uploadedUrl, _aiOrigin: true });
    setFormKey((k) => k + 1);
    setManualOpen(true);   // 読み取り結果を確認・修正できるよう自動で開く
    setEditingId(null);
  };

  const handleSave = async (form) => {
    const patch = {
      payment_date: form.payment_date,
      payee: form.payee.trim(),
      payment_method: form.payment_method,
      reimbursement_status: form.reimbursement_status || null,
      invoice_number: form.invoice_number.trim() || null,
      // ★2026-08-24: インボイス登録番号と消費税額(2.51参照)。税額は未入力なら自動計算値を保存する
      invoice_registration_number: (form.invoice_registration_number || "").trim() || null,
      tax_amount_jpy: form.tax_amount_jpy !== "" && form.tax_amount_jpy != null
        ? Number(form.tax_amount_jpy)
        : calcExpenseTaxJpy(form.amount_incl_tax, form.tax_category),
      item_name: form.item_name.trim() || null,
      account_category: form.account_category,
      tax_category: form.tax_category,
      amount_incl_tax: Number(form.amount_incl_tax),
      memo: form.memo.trim() || null,
      receipt_file_url: form.receipt_file_url.trim() || null,
    };

    if (form.id) {
      const { error } = await supabase.from("expenses").update(patch).eq("id", form.id);
      if (error) { alert("更新に失敗しました"); return; }
    } else {
      const entryMethod = form._aiOrigin ? "AI自動" : "手動";
      const { error } = await supabase.from("expenses").insert({ ...patch, entry_method: entryMethod });
      if (error) { alert("登録に失敗しました"); return; }
    }
    resetForm();
    loadExpenses();
  };

  const handleDelete = async (id) => {
    if (!window.confirm("この経費を削除しますか?")) return;
    const { error } = await supabase.from("expenses").delete().eq("id", id);
    if (error) { alert("削除に失敗しました"); return; }
    loadExpenses();
  };

  return (
    <div className="px-4 md:px-6 py-6 md:py-8 max-w-5xl mx-auto w-full space-y-5">
      <h1 className="font-display text-xl">経費入力</h1>

      {error && (
        <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>
      )}

      <AiReceiptReaderCard onExtracted={handleExtracted} />

      {/* ★2026-08-24: 手動入力は既定で折りたたむ。AIレシート読み込みで下書きが入ると自動で開く(2.51参照) */}
      <div className="rounded-xl" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
        <button
          onClick={() => setManualOpen((v) => !v)}
          className="w-full flex items-center justify-between px-4 py-3 text-sm"
          style={{ color: "var(--mz-ink)" }}
        >
          <span>手動で経費を入力{formExpense._aiOrigin ? "(AI読み取り結果を反映中)" : ""}</span>
          <span style={{ color: "var(--mz-ink-muted)" }}>{manualOpen ? "閉じる ▲" : "開く ▼"}</span>
        </button>
        {manualOpen && (
          <div className="px-4 pb-4">
            <ExpenseInlineForm key={formKey} expense={formExpense} onSave={handleSave} onCancel={resetForm} />
          </div>
        )}
      </div>

      <div className="flex flex-wrap items-center gap-3 justify-between pt-2">
        <div className="flex flex-wrap gap-2">
          <select
            value={filterMonth}
            onChange={(e) => setFilterMonth(e.target.value)}
            className="rounded-lg px-3 py-2 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          >
            <option value="all">対象月: すべて</option>
            {monthOptions.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
          <select
            value={filterCategory}
            onChange={(e) => setFilterCategory(e.target.value)}
            className="rounded-lg px-3 py-2 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          >
            <option value="all">勘定科目: すべて</option>
            {EXPENSE_ACCOUNT_CATEGORY_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>

      {expenses !== null && (
        <div className="rounded-xl p-4 flex items-center justify-between" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
          <span className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>表示中の合計({filteredExpenses.length}件)</span>
          <span className="font-display text-lg" style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(totalAmount)}</span>
        </div>
      )}

      {expenses === null ? (
        <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
      ) : (
        <ExpenseList
          expenses={filteredExpenses}
          editingId={editingId}
          onEdit={handleEdit}
          onCancelEdit={() => setEditingId(null)}
          onSave={handleSave}
          onDelete={handleDelete}
        />
      )}
    </div>
  );
}

/* ============================================================
   外注費請求書(contractor_invoices)
   ・commission_rates(歩合率)/ monthly_profits(月次損益)と連携する
   ・タブ構成: 歩合率設定 → 月次損益 → 請求書一覧 の順に実装する
     (このステップでは「歩合率設定」タブのみ実装。他はプレースホルダー)
   ============================================================ */
const CONTRACTOR_TABS = [
  { key: "rates", label: "歩合率設定" },
  { key: "profits", label: "月次損益" },
  { key: "invoices", label: "請求書一覧" },
];

/* ---- 指定日時点でその歩合率が有効かどうか(dateStr省略時は今日) ---- */
function isCommissionRateActive(rate, dateStr) {
  const d = dateStr || todayISO();
  if (rate.effective_from && rate.effective_from > d) return false;
  if (rate.effective_to && rate.effective_to < d) return false;
  return true;
}

/* ---- 担当者・対象月(YYYY-MM)から適用すべき歩合率を1件返す(外注費請求書ページで使用予定) ----
   対象月の1日を基準日として判定し、複数該当する場合は適用開始日が最も新しいものを優先する。 */
/* ★2026-08-22実装: 外注費請求書に含める「未精算の立替経費」を取得する(2.39参照)。
   ・paymentMethod は staff.expense_payment_method(例: "立替(悟)")。未設定の担当者では呼ばない。
   ・対象範囲は「対象月に支払った未精算分のみ」。payment_date が対象月の範囲にあるものだけを見る。
   ・**精算済みの除外はクライアント側で行う**。`.neq("reimbursement_status","精算済み")` を使うと
     SQLの比較規則により reimbursement_status が NULL の行まで一緒に除外され、
     「立替なのに精算状況が未入力の経費」が静かに漏れる(実際に9件中6件が該当していた)。
     支払方法が立替である時点で立替なので、NULL は未精算として扱う。
   ・reimbursed_invoice_id が既に入っている行は、別の請求書で精算済み(または精算予定)なので除外する。 */
async function fetchReimbursableExpenses(paymentMethod, targetMonth) {
  const { data, error } = await supabase
    .from("expenses")
    .select("id,payment_date,payee,item_name,account_category,amount_incl_tax,reimbursement_status,reimbursed_invoice_id")
    .eq("payment_method", paymentMethod)
    .gte("payment_date", `${targetMonth}-01`)
    .lt("payment_date", nextMonthFirstDay(targetMonth))
    .is("reimbursed_invoice_id", null)
    .order("payment_date", { ascending: true });
  if (error) return { ok: false, message: "立替経費の取得に失敗しました" };
  const rows = (data || []).filter((r) => r.reimbursement_status !== "精算済み");
  const total = rows.reduce((sum, r) => sum + (Number(r.amount_incl_tax) || 0), 0);
  return { ok: true, rows, total };
}

function getApplicableCommissionRate(staffId, targetMonth, rates) {
  const refDate = `${targetMonth}-01`;
  const candidates = (rates || []).filter(
    (r) => r.staff_id === staffId && isCommissionRateActive(r, refDate)
  );
  if (candidates.length === 0) return null;
  return candidates.sort((a, b) => (b.effective_from || "").localeCompare(a.effective_from || ""))[0];
}

/* ---- 歩合率 一覧表示(担当者名でグルーピングし、適用開始日の新しい順に表示) ---- */
function CommissionRateList({ rates, staffList, onEdit, onDelete }) {
  const staffName = (id) => (staffList.find((s) => s.id === id) || {}).name || "(不明な担当者)";

  if (rates.length === 0) {
    return <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>歩合率が登録されていません</p>;
  }

  const sorted = [...rates].sort((a, b) => {
    const n = staffName(a.staff_id).localeCompare(staffName(b.staff_id), "ja");
    if (n !== 0) return n;
    return (b.effective_from || "").localeCompare(a.effective_from || "");
  });

  return (
    <div className="space-y-2">
      {sorted.map((r) => {
        const active = isCommissionRateActive(r);
        return (
          <div
            key={r.id}
            className="rounded-xl p-4 flex items-center justify-between flex-wrap gap-3"
            style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
          >
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="text-sm font-medium">{staffName(r.staff_id)}</p>
                {active && (
                  <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "#1f3a2a", color: "#8fd6ab" }}>
                    現在有効
                  </span>
                )}
              </div>
              <p className="text-xs mt-1" style={{ color: "var(--mz-ink-muted)" }}>
                {r.effective_from} 〜 {r.effective_to || "(継続中)"}
              </p>
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <span className="font-display text-lg" style={{ color: "var(--mz-gold-soft)" }}>{r.rate_percent}%</span>
              <button
                onClick={() => onEdit(r)}
                className="text-xs px-2.5 py-1.5 rounded-lg"
                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
              >
                編集
              </button>
              <button
                onClick={() => onDelete(r.id)}
                className="text-xs px-2.5 py-1.5 rounded-lg"
                style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}
              >
                削除
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---- 歩合率 登録・編集モーダル ---- */

        {isNew && (
          <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
            ※この担当者に「現在有効(終了日なし)」の歩合率が既にある場合、その終了日は新しい適用開始日の前日に自動更新されます。
          </p>
        )}

        <div className="flex gap-2 pt-1">
          <button
            type="button"
            onClick={onClose}
            className="flex-1 rounded-lg py-2.5 text-sm"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
          >
            キャンセル
          </button>
          <button
            type="submit"
            disabled={saving}
            className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60"
            style={{ background: "var(--mz-gold)", color: "#1a1710" }}
          >
            {saving ? "保存中..." : "保存"}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ---- 月次損益 一覧表示(対象月の新しい順) ---- */
/* ★2026-08-24実装: 月次損益の内訳表示(2.50参照)。
   保存されている集計値がどの明細から積み上がったのかを、画面で確認できるようにする。
   ・**取得条件は handleCalculateMonthlyProfit と完全に一致させること。** ここだけ条件がずれると、
     「内訳を足しても合計に合わない」という、原因の分かりにくい不整合になる。
     特に仕入原価の計上可否は必ず isPurchaseCostCountable を通す(2.45参照)。
   ・計上対象外の仕入れも「なぜ入っていないか」が分かるよう、別枠で必ず表示する
     (0円や欠落を黙って隠さない。5章35番・37番と同じ方針)。
   ・この画面はDBを一切書き換えない(読むだけ)。 */
function MonthlyProfitDetailModal({ month, saved, onClose }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      const monthStart = `${month}-01`;
      const monthEnd = nextMonthFirstDay(month);
      const [salesRes, productRes, expenseRes] = await Promise.all([
        /* ★2026-08-24: 売れた商品の原価が「どの月に計上されているか」を売上の行ごとに出すため、
           明細と商品の仕入れ日・原価まで取得する(2.50参照)。
           仕入原価は仕入れ月に計上する方式(2.45)のため、**前月以前に仕入れた在庫・サンプルが
           当月に売れても、その原価は当月の仕入原価に入らない**。これが見えないと
           「在庫が売れた分の原価はどこへ行ったのか」が分からないため、明示する。 */
        supabase.from("sales")
          .select("id,transaction_date,total_amount_jpy,host_clubs(name),sale_items(product_id,products(product_code,product_name,purchase_date,created_via_sale,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy))")
          .gte("transaction_date", monthStart).lt("transaction_date", monthEnd)
          .order("transaction_date"),
        supabase.from("products")
          .select("id,purchase_date,created_via_sale,product_code,product_name,cost_source,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy")
          .gte("purchase_date", monthStart).lt("purchase_date", monthEnd)
          .order("purchase_date"),
        supabase.from("expenses")
          .select("id,payment_date,payee,item_name,account_category,payment_method,amount_incl_tax")
          .gte("payment_date", monthStart).lt("payment_date", monthEnd)
          .order("payment_date"),
      ]);
      if (salesRes.error || productRes.error || expenseRes.error) {
        setError("内訳の取得に失敗しました");
        return;
      }
      const all = productRes.data || [];
      /* ★2026-08-24: 当月販売分の原価(2.45参照)。
         仕入れ時に費用化していない商品が当月に売れた分を、売れた月の原価として計上する。
         同じ商品が複数の明細に出ることは無い(1商品=1点)が、念のためidで重複排除する。 */
      const soldSeen = {};
      const soldUncounted = [];
      (salesRes.data || []).forEach((sale) => {
        (sale.sale_items || []).forEach((si) => {
          const pr = si.products;
          if (!pr || isPurchaseCostCountable(pr)) return;
          const key = si.product_id;
          if (soldSeen[key]) return;
          soldSeen[key] = true;
          soldUncounted.push({ ...pr, id: key, _saleDate: sale.transaction_date });
        });
      });
      setData({
        sales: salesRes.data || [],
        counted: all.filter(isPurchaseCostCountable),
        soldUncounted,
        // 当月仕入だが計上対象外、かつ当月に売れてもいない(=まだどの月にも計上されていない)分
        excluded: all.filter((x) => !isPurchaseCostCountable(x) && !soldSeen[x.id]),
        expenses: expenseRes.data || [],
      });
    })();
  }, [month]);

  const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
  const rowStyle = { borderBottom: "1px solid var(--mz-border)" };

  const liveSales = data ? sum(data.sales, (x) => x.total_amount_jpy) : 0;
  const liveCostPurchased = data ? data.counted.reduce((a, x) => a + productCostJpy(x), 0) : 0;
  const liveCostSold = data ? data.soldUncounted.reduce((a, x) => a + productCostJpy(x), 0) : 0;
  const liveCost = liveCostPurchased + liveCostSold;
  const liveExpenses = data ? sum(data.expenses, (x) => x.amount_incl_tax) : 0;
  const liveGross = liveSales - liveCost - liveExpenses;

  const savedSales = Number((saved || {}).total_sales_jpy) || 0;
  const savedCost = Number((saved || {}).total_purchase_cost_jpy) || 0;
  const savedExpenses = Number((saved || {}).total_general_expenses_jpy) || 0;
  const savedGross = Number((saved || {}).gross_profit_jpy) || 0;

  /* ★2026-08-24修正: 比較は必ず円単位(四捨五入後)で行う。
     原価の按分は小数点4桁まで保持しているため(1.9参照)、小数まで含めた厳密一致で比べると、
     実際は同じ金額なのに「保存値」が出続ける(実際に¥99,304同士で誤表示された)。
     画面表示も円単位なので、表示と同じ粒度で比べるのが正しい。 */
  const Diff = ({ live, savedValue }) => (
    Math.round(live) === Math.round(savedValue)
      ? <span style={{ color: "var(--mz-ink-muted)" }}>一致</span>
      : <span style={{ color: "#f2b8bd" }}>保存値 {fmtJPY(savedValue)}</span>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <div className="w-full max-w-2xl rounded-2xl p-5 my-8 space-y-4" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
        <div className="flex items-center justify-between">
          <p className="font-display text-lg">{formatMonthLabel(`${month}-01`)}の内訳</p>
          <button onClick={onClose} className="text-sm px-3 py-1.5 rounded-lg" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>閉じる</button>
        </div>

        {error && <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>}
        {!data && !error && <p className="text-sm text-center py-8" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>}

        {data && (
          <>
            <div className="rounded-lg p-3 text-xs space-y-1" style={{ border: "1px solid var(--mz-border)" }}>
              <div className="flex justify-between"><span>売上合計</span><span>{fmtJPY(liveSales)} <Diff live={liveSales} savedValue={savedSales} /></span></div>
              <div className="flex justify-between"><span>− 仕入原価合計</span><span>{fmtJPY(liveCost)} <Diff live={liveCost} savedValue={savedCost} /></span></div>
              <div className="flex justify-between"><span>− 一般経費合計</span><span>{fmtJPY(liveExpenses)} <Diff live={liveExpenses} savedValue={savedExpenses} /></span></div>
              <div className="flex justify-between font-medium pt-1" style={{ borderTop: "1px solid var(--mz-border)" }}>
                <span>= 粗利益</span>
                <span style={{ color: liveGross >= 0 ? "var(--mz-gold-soft)" : "#f2b8bd" }}>
                  {fmtJPY(liveGross)} <Diff live={liveGross} savedValue={savedGross} />
                </span>
              </div>
              <p style={{ color: "var(--mz-ink-muted)" }}>
                ※「保存値」が出ている行は、集計したあとに実データが変わっています。再集計すると左の数字になります。
              </p>
            </div>

            <div>
              <p className="text-sm mb-1.5">売上({data.sales.length}件) {fmtJPY(liveSales)}</p>
              <p className="text-xs mb-1" style={{ color: "var(--mz-ink-muted)" }}>
                各行の「原価」は売れた商品の原価。<span style={{ color: "#d6a98f" }}>仕入月に計上済</span>と付いている分は、
                仕入れた月に既に経費計上しているため、この月の原価には入っていません(二重計上を避けるため)。
                それ以外は上の「当月販売分」としてこの月の原価に入っています。
              </p>
              {data.sales.length === 0 ? <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>なし</p> : (
                <div className="text-xs">
                  {data.sales.map((x) => {
                    const its = (x.sale_items || []).map((si) => si.products).filter(Boolean);
                    const costAll = its.reduce((a2, pr) => a2 + productCostJpy(pr), 0);
                    // この月の仕入原価として計上されている分だけを抜き出す(集計と同じ判定)
                    // 仕入れ時に既に費用化している商品は、この月の原価には入らない(二重計上しない)
                    const outside = its
                      .filter(isPurchaseCostCountable)
                      .reduce((a2, pr) => a2 + productCostJpy(pr), 0);
                    return (
                      <div key={x.id} className="py-1" style={rowStyle}>
                        <div className="flex justify-between gap-3">
                          <span className="min-w-0 truncate">{x.transaction_date} {(x.host_clubs || {}).name || "-"}</span>
                          <span className="shrink-0">{fmtJPY(x.total_amount_jpy)}</span>
                        </div>
                        <div style={{ color: "var(--mz-ink-muted)" }}>
                          {its.length}点 ・ 原価 {fmtJPY(costAll)}
                          {outside > 0 && (
                            <span style={{ color: "#d6a98f" }}>(うち仕入月に計上済 {fmtJPY(outside)})</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div>
              <p className="text-sm mb-1.5">仕入原価・当月仕入分({data.counted.length}点) {fmtJPY(liveCostPurchased)}</p>
              {data.counted.length === 0 ? <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>なし</p> : (
                <div className="text-xs">
                  {data.counted.map((x) => (
                    <div key={x.id} className="flex justify-between py-1 gap-3" style={rowStyle}>
                      <span className="min-w-0 truncate">
                        {x.purchase_date} [{x.created_via_sale ? "受注" : "サンプル/在庫"}]
                        {x.product_code ? ` No.${x.product_code}` : ""} {x.product_name || ""}
                      </span>
                      <span className="shrink-0">{fmtJPY(productCostJpy(x))}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <p className="text-sm mb-1.5">仕入原価・当月販売分({data.soldUncounted.length}点) {fmtJPY(liveCostSold)}</p>
              <p className="text-xs mb-1" style={{ color: "var(--mz-ink-muted)" }}>
                計上開始日より前に仕入れたため<b>仕入れ時に経費計上していない商品</b>が、この月に売れた分です。
                売上が立つこの月の原価として引きます(仕入れ時に計上済みの商品はここには出ません＝二重計上しません)。
              </p>
              {data.soldUncounted.length === 0 ? <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>なし</p> : (
                <div className="text-xs">
                  {data.soldUncounted.map((x) => (
                    <div key={x.id} className="flex justify-between py-1 gap-3" style={rowStyle}>
                      <span className="min-w-0 truncate">
                        販売 {x._saleDate} ・ 仕入 {x.purchase_date || "(日付なし)"}
                        [{x.created_via_sale ? "受注" : "サンプル/在庫"}] {x.product_name || ""}
                      </span>
                      <span className="shrink-0">{fmtJPY(productCostJpy(x))}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <p className="text-sm mb-1.5" style={{ color: "#d6a98f" }}>
                仕入原価・未計上({data.excluded.length}点) {fmtJPY(data.excluded.reduce((a, x) => a + productCostJpy(x), 0))}
              </p>
              <p className="text-xs mb-1" style={{ color: "var(--mz-ink-muted)" }}>
                この月に仕入れたが計上開始日(受注: {PURCHASE_COST_BASIS_FROM_ORDER} / サンプル・在庫: {PURCHASE_COST_BASIS_FROM_SAMPLE})より前で、
                まだ売れてもいないため、どの月にも計上されていない分です。売れた時点でその月の原価になります。
              </p>
              {data.excluded.length === 0 ? <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>なし</p> : (
                <div className="text-xs">
                  {data.excluded.map((x) => (
                    <div key={x.id} className="flex justify-between py-1 gap-3" style={rowStyle}>
                      <span className="min-w-0 truncate">
                        {x.purchase_date} [{x.created_via_sale ? "受注" : "サンプル/在庫"}]
                        {x.product_code ? ` No.${x.product_code}` : ""} {x.product_name || ""}
                      </span>
                      <span className="shrink-0">{fmtJPY(productCostJpy(x))}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <p className="text-sm mb-1.5">一般経費({data.expenses.length}件) {fmtJPY(liveExpenses)}</p>
              {data.expenses.length === 0 ? <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>なし</p> : (
                <div className="text-xs">
                  {data.expenses.map((x) => (
                    <div key={x.id} className="flex justify-between py-1 gap-3" style={rowStyle}>
                      <span className="min-w-0 truncate">
                        {x.payment_date} {x.payee || "(支払先未入力)"}
                        {x.item_name ? ` / ${x.item_name}` : ""}
                        {x.payment_method ? ` [${x.payment_method}]` : ""}
                      </span>
                      <span className="shrink-0">{fmtJPY(x.amount_incl_tax)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function MonthlyProfitList({ profits, onDelete, staleProfits, onRecalculate, recalculating, onShowDetail }) {
  if (profits.length === 0) {
    return <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>月次損益がまだ集計されていません</p>;
  }
  return (
    <div className="space-y-2">
      {profits.map((p) => {
        const gross = Number(p.gross_profit_jpy) || 0;
        // ★2026-08-06実装: 繰越損失(前月までの赤字の繰越分)を加味した、報酬の実際の計算基準額
        const carriedLoss = Number(p.carried_loss_in_jpy) || 0;
        const commissionBase = gross + carriedLoss;
        // ★2026-08-17実装: 集計後に原価・経費・売上が変わっていないかの判定結果(2.36参照)
        const stale = (staleProfits || {})[p.id] || null;
        return (
          <div
            key={p.id}
            className="rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"
            style={{ background: "var(--mz-surface)", border: `1px solid ${stale ? "#7a5a3a" : "var(--mz-border)"}` }}
          >
            <div className="flex-1 min-w-0">
              <p className="font-display text-base">{formatMonthLabel(p.target_month)}</p>
              <div className="flex flex-wrap gap-x-4 gap-y-1 mt-1.5 text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                <span>売上合計: {fmtJPY(p.total_sales_jpy)}</span>
                <span>仕入原価合計: {fmtJPY(p.total_purchase_cost_jpy)}</span>
                <span>一般経費合計: {fmtJPY(p.total_general_expenses_jpy)}</span>
              </div>
              {carriedLoss < 0 && (
                <p className="text-xs mt-1" style={{ color: "#f2b8bd" }}>
                  前月までの繰越損失: {fmtJPY(carriedLoss)}(報酬基準額: {fmtJPY(commissionBase)})
                </p>
              )}
              <p className="text-xs mt-1" style={{ color: "var(--mz-ink-muted)" }}>
                算出日時: {(p.calculated_at || "").slice(0, 16).replace("T", " ")}
              </p>
              {/* ★2026-08-17実装: 集計したあとで原価・経費・売上が変わった月に警告を出す(2.36参照) */}
              {stale && (
                <div className="text-xs mt-2 rounded-lg px-2.5 py-2 space-y-1" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
                  {stale.diffs.length > 0 && (
                    <p>⚠️ この月を集計したあとに{stale.diffs.join("・")}が変更されています。表示中の数字は古い可能性があります。</p>
                  )}
                  {/* 前の月が古いことによる連鎖ズレ。この月だけ再集計しても直らない点を明示する */}
                  {stale.cascade && (
                    <p>⚠️ 前の月の集計が古いため、この月の繰越損失も古くなっています。<strong>この月だけ再集計しても直りません。</strong>前の月から順に集計し直してください。</p>
                  )}
                  {stale.savedGross !== stale.currentGross && (
                    <p>粗利益: {fmtJPY(stale.savedGross)} → <strong>{fmtJPY(stale.currentGross)}</strong></p>
                  )}
                  {stale.savedBase !== stale.currentBase && (
                    <p>報酬の計算基準額(繰越損失を差し引いた後): {fmtJPY(stale.savedBase)} → <strong>{fmtJPY(stale.currentBase)}</strong></p>
                  )}
                </div>
              )}
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <span className="font-display text-lg" style={{ color: gross >= 0 ? "var(--mz-gold-soft)" : "#f2b8bd" }}>
                粗利益 {fmtJPY(gross)}
              </span>
              {stale && stale.diffs.length > 0 && onRecalculate && (
                <button
                  onClick={() => onRecalculate(String(p.target_month).slice(0, 7))}
                  disabled={recalculating}
                  className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap disabled:opacity-60"
                  style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                >
                  {recalculating ? "集計中..." : "この月を再集計"}
                </button>
              )}
              <button
                onClick={() => onShowDetail(p)}
                className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
              >
                内訳を見る
              </button>
              <button
                onClick={() => onDelete(p.id)}
                className="text-xs px-2.5 py-1.5 rounded-lg"
                style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}
              >
                削除
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---- 請求書 一覧表示(対象月降順・同月内は発行順)。ステータス切替・削除ボタンを持つ ---- */
/* ============================================================
   外注費請求書のPDF出力(★2026-08-22実装。2.40参照)
   領収書(2.7)と同じ2段構え:
     ① html2canvas+jsPDFでPDFを直接生成し navigator.share() で共有シートへ渡す
     ② 非対応環境では請求書だけの独立した静的HTMLを別タブで開いて印刷する
   window.print() に依存する方向の実装は増やさないこと(iOS Safariの制限。5章31番参照)。
   ============================================================ */

const CONTRACTOR_INVOICE_BILL_TO = "IMPORT PRIME合同会社";

/* ★2026-08-22実装: 外注費請求書の消費税(内税)。2.42参照。
   ・**課税対象は歩合報酬のみ**。立替経費精算は「立替金」として消費税の対象外として扱う。
     立替経費は担当者が支払った時点で既に消費税を含んでおり(expenses.amount_incl_taxは税込)、
     それをそのまま返しているだけなので、ここで再度10%を抽出すると同じ消費税を二重に見積もることになる。
   ・担当者は免税事業者のため、**適格請求書と誤認されるおそれのある表示(T+13桁の登録番号等)は一切出さない**。
     免税事業者が消費税額を記載すること自体は罰則対象ではない(国税庁インボイスQ&A問26-2)。2.3と同じ考え方。
   ・税率は請求書ごとに contractor_invoices.tax_rate_percent へ保存して固定する
     (発行時点の内容で確定した文書として扱うため。rate_percentをコピーして固定するのと同じ理由)。 */
const CONSUMPTION_TAX_RATE_PERCENT = 10;

/* 税込金額から税抜・消費税額を割り戻す。
   税抜は切り捨て、消費税額は「税込 − 税抜」で求めることで、内訳の合計が必ず税込金額と一致するようにする
   (両方を独立に丸めると1円ずれることがあるため)。 */
function splitTaxIncluded(amountInclTax, ratePercent) {
  const total = Math.round(Number(amountInclTax) || 0);
  const rate = Number(ratePercent);
  const r = Number.isFinite(rate) ? rate : CONSUMPTION_TAX_RATE_PERCENT;
  if (r <= 0) return { excluded: total, tax: 0 };
  const excluded = Math.floor(total / (1 + r / 100));
  return { excluded, tax: total - excluded };
}

function contractorInvoiceTaxRate(invoice) {
  // 古い請求書(この機能より前に発行した分)は列が無い/nullのため、既定値で補う
  const r = Number((invoice || {}).tax_rate_percent);
  return Number.isFinite(r) ? r : CONSUMPTION_TAX_RATE_PERCENT;
}

/* 全ての請求書列を漏れなく含んだ、担当者情報の取得用SELECT。
   請求書PDFに刷る項目を増やしたら、必ずこの定数と保存時のpatchの両方に追加すること
   (片方だけだと値が保存されない/消える。商品編集のPRODUCT_EDIT_SELECTと同じ考え方。5章38番参照) */
const STAFF_PROFILE_SELECT = "id,name,is_active,expense_payment_method,postal_code,prefecture,city,address_line,building,phone,bank_name,bank_branch,bank_account_type,bank_account_number,bank_account_holder";

const STAFF_BANK_ACCOUNT_TYPE_OPTIONS = ["普通", "当座"];

function staffAddressLines(staff) {
  const s = staff || {};
  const lines = [];
  if (s.postal_code) lines.push(`〒${s.postal_code}`);
  const addr = [s.prefecture, s.city, s.address_line].filter(Boolean).join("");
  if (addr) lines.push(addr);
  if (s.building) lines.push(s.building);
  if (s.phone) lines.push(`TEL: ${s.phone}`);
  return lines;
}

function staffBankLine(staff) {
  const s = staff || {};
  if (!s.bank_name && !s.bank_account_number) return null;
  const head = [s.bank_name, s.bank_branch, s.bank_account_type, s.bank_account_number].filter(Boolean).join(" ");
  return s.bank_account_holder ? `${head}(${s.bank_account_holder})` : head;
}

function contractorInvoiceTotal(invoice) {
  return (Number(invoice.amount_jpy) || 0) + (Number(invoice.reimbursement_jpy) || 0);
}

/* 電子帳簿保存法の検索要件(取引年月日・取引金額・取引先)に合わせ、領収書(3.7)と同じ並びにする。
   例: "20260822_悟_3385円_請求書_INV-2026-0001" */
function buildContractorInvoiceFileName(invoice, staffName) {
  const date = (invoice.issue_date || "").replace(/-/g, "");
  const safeName = String(staffName || "担当者未設定").trim().replace(/[\\/:*?"<>|]/g, "");
  return `${date}_${safeName}_${contractorInvoiceTotal(invoice)}円_請求書_${invoice.invoice_number}`;
}

/* 請求書の明細行を組み立てる(画面プレビュー・印刷用HTMLの両方から使う共通ロジック)。
   歩合報酬は0円でも必ず1行出す(「立替だけの請求書である」ことが読み手に伝わるようにするため)。 */
function contractorInvoiceRows(invoice, expenses) {
  const rows = [];
  const commission = Number(invoice.amount_jpy) || 0;
  const base = invoice.commission_base_jpy != null ? Number(invoice.commission_base_jpy) : null;
  const rateLabel = Number(invoice.rate_percent) > 0
    ? `報酬基準額 ${base != null ? fmtJPY(base) : "-"} × ${invoice.rate_percent}%`
    : "対象月の報酬基準額が0以下、または歩合率が未設定のため0円";
  rows.push({ key: "commission", label: `歩合報酬(${formatMonthLabel(invoice.target_month)}分)〔税込〕`, note: rateLabel, amount: commission });
  (expenses || []).forEach((e) => {
    rows.push({
      key: `exp-${e.id}`,
      label: `立替経費精算〔対象外〕 ${e.payment_date}`,
      note: [e.payee, e.item_name].filter(Boolean).join(" / ") || "(内容未入力)",
      amount: Number(e.amount_incl_tax) || 0,
    });
  });
  return rows;
}

  const taxSplit = splitTaxIncluded(invoice.amount_jpy, taxRate);
  const addressLines = staffAddressLines(staff);
  const bankLine = staffBankLine(staff);
  return (
    <div className="rounded-xl p-6" style={{ background: "#ffffff", color: "#1a1710" }}>

        <div>
          <h3 className="font-display" style={{ fontSize: "22px" }}>請求書</h3>

            {CONTRACTOR_INVOICE_BILL_TO} 御中

          <div className="mt-4">
            <p className="font-display" style={{ fontSize: "24px" }}>{fmtJPY(contractorInvoiceTotal(invoice))} -</p>
            <p className="text-xs mt-1">下記の通りご請求申し上げます。</p>

        </div>
        <div className="text-right text-xs" style={{ maxWidth: "240px" }}>
          <p>No. {invoice.invoice_number}</p>
          <p>発行日: {invoice.issue_date}</p>
          <p>対象月: {formatMonthLabel(invoice.target_month)}</p>
          <div className="mt-3 pt-2 text-left" style={{ borderTop: "1px solid #ccc" }}>
            <p className="mb-1" style={{ color: "#888" }}>請求者</p>
            <p style={{ color: "#333" }}>{(staff || {}).name || "(担当者未設定)"}</p>
            {addressLines.map((l, i) => (
              <p key={i} style={{ color: "#555" }}>{l}</p>

      </div>

      <table className="w-full text-xs mb-4" style={{ borderCollapse: "collapse" }}>
        <thead>
          <tr style={{ borderBottom: "1px solid #ccc" }}>
            <th className="text-left py-1">内容</th>
            <th className="text-right py-1">金額</th>

        <tbody>
          {rows.map((r) => (

                {r.note && <span style={{ color: "#888" }}> … {r.note}</span>}
              </td>
              <td className="text-right py-1 align-top whitespace-nowrap">{fmtJPY(r.amount)}</td>

          ))}

      <div className="text-xs space-y-1 mb-4" style={{ borderTop: "1px solid #ccc", paddingTop: "8px" }}>
        <div className="flex justify-between"><span>歩合報酬(税込)</span><span>{fmtJPY(invoice.amount_jpy)}</span></div>
        <div className="flex justify-between" style={{ color: "#888" }}>
          <span className="pl-3">うち税抜金額</span><span>{fmtJPY(taxSplit.excluded)}</span>
        </div>
        <div className="flex justify-between" style={{ color: "#888" }}>
          <span className="pl-3">うち消費税({taxRate}%)</span><span>{fmtJPY(taxSplit.tax)}</span>
        </div>
        <div className="flex justify-between"><span>立替経費精算({(expenses || []).length}件・消費税対象外)</span><span>{fmtJPY(invoice.reimbursement_jpy)}</span></div>
        <div className="flex justify-between font-medium" style={{ borderTop: "1px solid #ccc", paddingTop: "4px" }}>
          <span>合計金額</span><span>{fmtJPY(contractorInvoiceTotal(invoice))}</span>
        </div>
      </div>

      <p className="text-[10px] mb-4" style={{ color: "#888" }}>
        ※ 立替経費は当方が立て替えて支払ったものを精算するもので、消費税の対象外(立替金)として記載しています。
      </p>

      {bankLine && (
        <div className="text-xs" style={{ borderTop: "1px solid #ccc", paddingTop: "8px" }}>
          <p style={{ color: "#888" }}>お振込先</p>
          <p style={{ color: "#333" }}>{bankLine}</p>
        </div>
      )}
    </div>
  );
}

function ContractorInvoicePreviewModal({ invoice, onClose }) {
  const [staff, setStaff] = useState(null);
  const [expenses, setExpenses] = useState(null);
  const [error, setError] = useState(null);
  const [shareError, setShareError] = useState(null);
  const [sharingPdf, setSharingPdf] = useState(false);
  const captureRef = useRef(null);

  useEffect(() => {
    (async () => {
      const [staffRes, expRes] = await Promise.all([
        supabase.from("staff").select(STAFF_PROFILE_SELECT).eq("id", invoice.staff_id).maybeSingle(),
        supabase.from("expenses")
          .select("id,payment_date,payee,item_name,amount_incl_tax")
          .eq("reimbursed_invoice_id", invoice.id)
          .order("payment_date", { ascending: true }),
      ]);
      if (staffRes.error || expRes.error) { setError("請求書の内容を取得できませんでした"); return; }
      setStaff(staffRes.data || {});
      setExpenses(expRes.data || []);
    })();
  }, [invoice.id, invoice.staff_id]);

  const canShareFiles = typeof navigator !== "undefined" && !!navigator.canShare && !!navigator.share;

  /* ★2026-08-22実装: 請求書PDFの生成(2.43参照)。
     mode = "download" … PDFファイルとしてそのまま保存させる(PCの既定の導線)
     mode = "share"    … navigator.share()でOS標準の共有シートへ渡す(スマホ向け)

     ・**1枚に収める**のを優先する。A4の余白(10mm)の内側に収まればそのまま1ページ。
       収まらない場合でも、70%までの縮小で収まるなら縮小して1ページに収める
       (立替明細が数件増えた程度で2枚に割れるのを防ぐ)。それでも入らないときだけ複数ページに分割する。
     ・画像化元は画面のプレビューではなく、A4相当の固定幅で描いた隠しDOM(captureRef)。
       画面幅に依存してPDFの体裁が変わるのを防ぐため。
     ・PDF生成自体に失敗したときだけ、最後の手段として静的HTMLの別タブ印刷に落とす
       (window.print()への依存は増やさない。5章31番参照)。 */
  const runPdf = async (mode) => {
    if (!captureRef.current || sharingPdf) return;
    setShareError(null);
    setSharingPdf(true);
    try {
      const canvas = await html2canvas(captureRef.current, { scale: 2, backgroundColor: "#ffffff" });
      /* ★2026-08-22: PNGではなくJPEGで埋め込む(2.43参照)。
         PNGだと1枚の請求書でもPDFが8MB前後になり、LINE・メール等での送信時に容量制限に
         引っかかりやすい。請求書は白背景に文字だけで透過も不要なため、品質0.92のJPEGで
         見た目を保ったまま1MB未満に収まる。 */
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "mm", format: "a4" });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      const margin = 10;                       // mm
      const availW = pageWidth - margin * 2;
      const availH = pageHeight - margin * 2;

      let imgW = availW;
      let imgH = (canvas.height * imgW) / canvas.width;

      if (imgH <= availH) {
        pdf.addImage(imgData, "JPEG", margin, margin, imgW, imgH);
      } else if (availH / imgH >= 0.7) {
        // 少しはみ出しただけなら、読める範囲で縮小して1枚に収める(左右中央寄せ)
        const shrink = availH / imgH;
        imgW = imgW * shrink;
        imgH = availH;
        pdf.addImage(imgData, "JPEG", margin + (availW - imgW) / 2, margin, imgW, imgH);
      } else {
        // 立替明細が非常に多い場合のみ複数ページへ分割する
        let heightLeft = imgH;
        pdf.addImage(imgData, "JPEG", margin, margin, imgW, imgH);
        heightLeft -= availH;
        while (heightLeft > 0) {
          pdf.addPage();
          pdf.addImage(imgData, "JPEG", margin, margin - (imgH - heightLeft), imgW, imgH);
          heightLeft -= availH;
        }
      }

      const fileName = `${buildContractorInvoiceFileName(invoice, staff.name)}.pdf`;

      if (mode === "share") {
        const blob = pdf.output("blob");
        const file = new File([blob], fileName, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: fileName });
        } else {
          // 共有に対応していない環境で「共有」を押された場合は、保存に切り替える
          pdf.save(fileName);
        }
      } else {
        pdf.save(fileName);
      }
    } catch (e) {
      // 共有シートをキャンセルした場合(AbortError)はエラー表示しない
      if (e && e.name !== "AbortError") {
        const printWindow = window.open("", "_blank");
        if (!printWindow) {
          setShareError("PDFの生成に失敗しました。ポップアップを許可のうえ、もう一度お試しください。");
          return;
        }
        printWindow.document.open();
        printWindow.document.write(buildContractorInvoicePrintHtml(invoice, staff, expenses));
        printWindow.document.close();
        printWindow.onload = () => { printWindow.focus(); printWindow.print(); };
        setShareError("PDFの生成に失敗したため、印刷用のページを別タブで開きました。");
      }
    } finally {
      setSharingPdf(false);
    }
  };

  const loading = staff === null || expenses === null;
  const missingIssuerInfo = !loading && staffAddressLines(staff).length === 0 && !staffBankLine(staff);

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <div className="w-full max-w-lg rounded-2xl p-5 my-8 space-y-4" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
        <div className="flex items-center justify-between">
          <p className="font-display text-lg">請求書</p>
          <button onClick={onClose} className="text-sm px-3 py-1.5 rounded-lg" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>閉じる</button>
        </div>

        {error && <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>}
        {loading && !error && <p className="text-sm text-center py-8" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>}

        {!loading && !error && (
          <>
            {missingIssuerInfo && (
              <p className="text-xs rounded-lg px-3 py-2" style={{ background: "#3a2f1f", color: "#e3c489" }}>
                この担当者の住所・振込先が未登録のため、請求書に印字されません。「歩合率設定」タブの「担当者情報」から登録できます。
              </p>
            )}

            <div>
              <ContractorInvoiceDocument invoice={invoice} staff={staff} expenses={expenses} />
            </div>

            {/* ★2026-08-22実装: PDF化専用の隠しレンダリング(2.43参照)。
                画面上のプレビューは表示幅に合わせて伸縮するため、そのまま画像化すると
                ブラウザの窓幅によってPDFの縦横比が変わり、同じ請求書でも1枚に収まったり
                2枚に割れたりする。**PDFは常にA4相当の固定幅(794px = 96dpiのA4の幅)で描いたものを使う。** */}
            <div
              ref={captureRef}
              aria-hidden="true"
              style={{ position: "fixed", left: "-10000px", top: 0, width: "794px", background: "#ffffff" }}
            >
              <ContractorInvoiceDocument invoice={invoice} staff={staff} expenses={expenses} />
            </div>

            {shareError && (
              <p className="text-xs rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{shareError}</p>
            )}

            <div className="flex gap-2">
              <button
                onClick={() => runPdf("download")}
                disabled={sharingPdf}
                className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60"
                style={{ background: "var(--mz-gold)", color: "#1a1710" }}
              >
                {sharingPdf ? "PDFを生成中..." : "PDFをダウンロード"}
              </button>
              {canShareFiles && (
                <button
                  onClick={() => runPdf("share")}
                  disabled={sharingPdf}
                  className="rounded-lg px-4 py-2.5 text-sm disabled:opacity-60"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                >
                  共有
                </button>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ContractorInvoiceList({ invoices, onUpdateStatus, onDelete, onViewInvoice }) {
  if (invoices.length === 0) {
    return <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>請求書がまだ発行されていません</p>;
  }
  return (
    <div className="space-y-2">
      {invoices.map((inv) => {
        const staffName = (inv.staff || {}).name || "(不明な担当者)";
        const paid = inv.status === "支払済み";
        // ★2026-08-22: 金額は「歩合報酬 + 立替精算」の合計で表示し、内訳も併記する(2.39参照)。
        //   支払いを外注費として経費計上する際、外注費に当たるのは歩合報酬の方だけなので、
        //   内訳が見えないと立替分まで二重に経費計上してしまう。
        const commission = Number(inv.amount_jpy) || 0;
        const reimbursement = Number(inv.reimbursement_jpy) || 0;
        const totalAmount = commission + reimbursement;
        // 消費税は歩合報酬のみが対象(2.42参照)。発行時に保存した税額があればそれを正とする
        const invoiceTax = inv.commission_tax_jpy != null
          ? Number(inv.commission_tax_jpy)
          : splitTaxIncluded(commission, contractorInvoiceTaxRate(inv)).tax;
        return (
          <div
            key={inv.id}
            className="rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"
            style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
          >
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-display text-base">{inv.invoice_number}</p>
                <span
                  className="text-xs px-2 py-0.5 rounded-full"
                  style={{
                    background: paid ? "rgba(199,168,105,0.15)" : "rgba(242,184,189,0.15)",
                    color: paid ? "var(--mz-gold-soft)" : "#f2b8bd",
                  }}
                >
                  {inv.status}
                </span>
              </div>
              <div className="flex flex-wrap gap-x-4 gap-y-1 mt-1.5 text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                <span>担当者: {staffName}</span>
                <span>対象月: {formatMonthLabel(inv.target_month)}</span>
                <span>適用歩合率: {inv.rate_percent}%</span>
                <span>発行日: {inv.issue_date}</span>
              </div>
              {reimbursement > 0 && (
                <p className="text-xs mt-1.5" style={{ color: "var(--mz-ink-muted)" }}>
                  内訳: 歩合報酬 {fmtJPY(commission)}(うち消費税 {fmtJPY(invoiceTax)}) ＋ 立替精算 {fmtJPY(reimbursement)}
                </p>
              )}
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <span className="font-display text-lg" style={{ color: "var(--mz-gold-soft)" }}>
                {fmtJPY(totalAmount)}
              </span>
              <button
                onClick={() => onViewInvoice(inv)}
                className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                style={{ border: "1px solid var(--mz-gold)", color: "var(--mz-gold-soft)" }}
              >
                請求書
              </button>
              <button
                onClick={() => onUpdateStatus(inv.id, paid ? "未払い" : "支払済み")}
                className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
              >
                {paid ? "未払いに戻す" : "支払済みにする"}
              </button>
              <button
                onClick={() => onDelete(inv.id)}
                className="text-xs px-2.5 py-1.5 rounded-lg"
                style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}
              >
                削除
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}
