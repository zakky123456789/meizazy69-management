function ContractorInvoicesPage() {
  const [tab, setTab] = useState("rates");
  const [staffList, setStaffList] = useState([]);
  const [rates, setRates] = useState(null); // null = 読み込み中
  const [error, setError] = useState(null);
  const [modalRate, setModalRate] = useState(null); // null=閉じる, {}=新規, obj=編集

  const [monthlyProfits, setMonthlyProfits] = useState(null); // null = 読み込み中
  const [profitError, setProfitError] = useState(null);
  const [calcTargetMonth, setCalcTargetMonth] = useState(todayISO().slice(0, 7));
  const [calculating, setCalculating] = useState(false);
  // ★2026-08-17実装: 保存済みの月次損益が、いまの実データと食い違っている月の一覧
  //   { [monthly_profits.id]: { diffs: ["仕入原価",...], currentGross, savedGross } }(2.36参照)
  const [staleProfits, setStaleProfits] = useState({});
  // 通信エラー・取得件数上限などで鮮度を判定できなかった場合(警告が無い=最新、と誤解させないため)
  const [staleCheckError, setStaleCheckError] = useState(false);
  // ★2026-08-24: 月次損益の内訳表示(2.50参照)
  const [detailProfit, setDetailProfit] = useState(null);

  const [invoices, setInvoices] = useState(null); // null = 読み込み中
  const [invoiceError, setInvoiceError] = useState(null);
  const [issueStaffId, setIssueStaffId] = useState("");
  const [issueTargetMonth, setIssueTargetMonth] = useState(todayISO().slice(0, 7));
  const [invoicePreview, setInvoicePreview] = useState(null); // null=未計算, {error}=計算不可, {monthlyProfit,rate,amount}=計算済み
  const [profileStaff, setProfileStaff] = useState(null);   // 担当者情報の編集モーダル(★2026-08-22。2.40参照)
  const [viewInvoice, setViewInvoice] = useState(null);     // 請求書PDFのプレビューモーダル(★2026-08-22。2.40参照)
  const [previewing, setPreviewing] = useState(false);
  const [issuing, setIssuing] = useState(false);

  const loadStaff = useCallback(async () => {
    // ★2026-08-22: 請求書PDFに印字する担当者情報(住所・連絡先・振込先)まで一式取得する(2.40参照)
    const { data, error } = await supabase.from("staff").select(STAFF_PROFILE_SELECT).order("name");
    /* ★2026-08-22変更: 取得に失敗したら黙って空にせず、必ず画面に理由を出す。
       従来は `if (!error)` で握りつぶしていたため、マイグレーション未適用で staff の新しい列が
       無い場合(42703 column does not exist)に、担当者一覧が理由も出ずに空になり、
       「担当者情報が全然出てこない」という原因の分からない不具合に見えていた(5章42番参照)。 */
    if (error) {
      setStaffList([]);
      setError(
        error.code === "42703"
          ? "担当者情報の取得に失敗しました。staffテーブルに必要な列がありません。設計書2.40のマイグレーションSQL(住所・振込先の列追加)を実行してください。"
          : `担当者データの取得に失敗しました(${error.message || error.code || "原因不明"})`
      );
      return;
    }
    setStaffList(data || []);
  }, []);

  const loadRates = useCallback(async () => {
    setError(null);
    const { data, error } = await supabase
      .from("commission_rates")
      .select("id,staff_id,rate_percent,effective_from,effective_to,created_at")
      .order("effective_from", { ascending: false });
    if (error) {
      setError("歩合率データの取得に失敗しました");
      setRates([]);
    } else {
      setRates(data || []);
    }
  }, []);

  const loadMonthlyProfits = useCallback(async () => {
    setProfitError(null);
    const { data, error } = await supabase
      .from("monthly_profits")
      .select("id,target_month,total_sales_jpy,total_purchase_cost_jpy,total_general_expenses_jpy,gross_profit_jpy,carried_loss_in_jpy,calculated_at")
      .order("target_month", { ascending: false });
    if (error) {
      setProfitError("月次損益データの取得に失敗しました");
      setMonthlyProfits([]);
    } else {
      setMonthlyProfits(data || []);
    }
  }, []);

  /* ★2026-08-17実装: 月次損益は「集計ボタンを押した時点の数字を保存するスナップショット」であり、
     あとから商品の原価(商品代・国際送料・その他手数料・中国国内送料)や経費・売上を修正しても
     自動では追随しない(2.14参照)。受注時は0円で登録し、返金確定後に金額を入れる運用(5章26番)では
     「集計 → あとから原価を入力」の順になりやすく、保存済みの粗利が古いまま放置されやすい。
     そこで保存値と「いまの実データから計算し直した値」を突き合わせ、ズレている月に警告を出す。
     ・全月まとめて2クエリ(sales / expenses)で取得し、クライアント側で月ごとに集計して比較する。
       計算式・期間の切り方はhandleCalculateMonthlyProfitと完全に一致させること(片方だけ直すと、
       実際はズレていないのに毎回「古い」と警告が出続ける)。
     ・繰越損失には2種類のズレがある。両方を区別して扱う(2.33・2.36参照):
       ① この月自体のズレ … 前月の「保存値」から求めた期待値と、この月の保存値が違う場合。
          この月を再集計すれば直る。
       ② 前月から連鎖したズレ(cascade) … この月の保存値は前月の「保存値」とは整合しているが、
          その前月自体が古い場合。**この月を再集計しても直らず、前の月から順に集計し直す必要がある**。
          ①だけを見ていると、前月が赤字に変わったのに今月は「最新」と表示され、繰越損失を
          差し引かないまま報酬を発行してしまう(commission_base_jpyが本来より高くなる)。 */
  const staleRunRef = useRef(0);
  const checkStaleMonthlyProfits = useCallback(async (profits) => {
    // 実行の追い越し対策: 「6月を再集計 → すぐ7月を再集計」のように連続実行すると、
    // 先に投げた古い判定が後から返って新しい結果を上書きしうる。最後に開始した実行だけを採用する。
    const runId = ++staleRunRef.current;
    const isCurrent = () => runId === staleRunRef.current;

    if (!profits || profits.length === 0) {
      if (isCurrent()) { setStaleProfits({}); setStaleCheckError(false); }
      return;
    }
    const monthsAsc = profits.map((x) => String(x.target_month).slice(0, 7)).sort();
    const rangeStart = `${monthsAsc[0]}-01`;
    const rangeEnd = nextMonthFirstDay(monthsAsc[monthsAsc.length - 1]);

    const ROW_CAP = 1000; // Supabase(PostgREST)のMax rows既定値
    /* ★2026-08-23変更: 仕入原価は products.purchase_date 基準に変更(2.45参照)。
       **計算式・期間の切り方は handleCalculateMonthlyProfit と完全に一致させること。**
       片方だけ直すと、実際はズレていないのに毎回「古い」と警告が出続ける。 */
    const [salesRes, expenseRes, productRes] = await Promise.all([
      supabase.from("sales")
        // ★2026-08-24: 当月販売分の原価も計上するため、明細と商品まで取得する(2.45参照)
        .select("transaction_date,total_amount_jpy,sale_items(product_id,products(purchase_date,created_via_sale,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy))")
        .gte("transaction_date", rangeStart).lt("transaction_date", rangeEnd),
      supabase.from("expenses")
        .select("amount_incl_tax,payment_date")
        .gte("payment_date", rangeStart).lt("payment_date", rangeEnd),
      supabase.from("products")
        .select("purchase_date,created_via_sale,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy")
        // 計上開始日より前は集計側でも対象外。handleCalculateMonthlyProfitと必ず同じ条件・同じ判定にすること
        .gte("purchase_date", rangeStart > PURCHASE_COST_BASIS_FROM_MIN ? rangeStart : PURCHASE_COST_BASIS_FROM_MIN)
        .lt("purchase_date", rangeEnd),
    ]);
    if (!isCurrent()) return;

    /* 判定不能のケースは「警告なし(=最新)」ではなく「判定できなかった」として明示する。
       この画面には「最新です」という肯定表示が無く、警告が出ていないこと自体が最新の合図になるため、
       黙って警告を消すと、古い粗利のまま報酬を発行してしまう。
       行数上限に達している場合も、取得漏れのぶんだけ必ずズレて見えるので同じ扱いにする
       (この状態で警告を出すと、再集計しても消えない警告が延々と出続けてしまう)。 */
    const truncated = (salesRes.data || []).length >= ROW_CAP || (expenseRes.data || []).length >= ROW_CAP
      || (productRes.data || []).length >= ROW_CAP;
    if (salesRes.error || expenseRes.error || productRes.error || truncated) {
      setStaleCheckError(true); // 直前の判定結果(staleProfits)はあえて消さずに残す
      return;
    }

    const byMonth = {};
    const bucket = (m) => (byMonth[m] = byMonth[m] || { sales: 0, cost: 0, expenses: 0 });
    (salesRes.data || []).forEach((sale) => {
      const b = bucket(String(sale.transaction_date).slice(0, 7));
      b.sales += Number(sale.total_amount_jpy) || 0;
      // 仕入れ時に費用化していない商品が売れた分は、売れた月の原価として計上する
      (sale.sale_items || []).forEach((si) => {
        const pr = si.products;
        if (pr && !isPurchaseCostCountable(pr)) b.cost += productCostJpy(pr);
      });
    });
    (productRes.data || []).filter(isPurchaseCostCountable).forEach((pr) => {
      bucket(String(pr.purchase_date).slice(0, 7)).cost += productCostJpy(pr);
    });
    (expenseRes.data || []).forEach((e) => {
      bucket(String(e.payment_date).slice(0, 7)).expenses += Number(e.amount_incl_tax) || 0;
    });

    /* 注意: 前月の参照はこの配列(profits)の中から引いている。loadMonthlyProfitsが
       monthly_profitsを全件取得している前提。将来この一覧に「直近12か月だけ」等の絞り込みを
       入れる場合は、一覧の最古月の前月だけは別途DBから取得しないと、その月に消せない
       繰越損失の警告が出続けるので注意すること。 */
    const profitByMonth = {};
    profits.forEach((x) => { profitByMonth[String(x.target_month).slice(0, 7)] = x; });

    // 月の若い順に「いまの実データで集計し直した場合の値」を連鎖計算する(繰越損失の連鎖を再現するため)
    const liveByMonth = {};
    monthsAsc.forEach((m) => {
      const cur = byMonth[m] || { sales: 0, cost: 0, expenses: 0 };
      const gross = cur.sales - cur.cost - cur.expenses;
      const prevM = String(prevMonthFirstDay(m)).slice(0, 7);
      const prevLive = liveByMonth[prevM];
      const prevLiveBase = prevLive ? prevLive.gross + prevLive.carried : 0;
      const carried = profitByMonth[prevM] && prevLiveBase < 0 ? prevLiveBase : 0;
      liveByMonth[m] = { gross, carried };
    });

    const result = {};
    profits.forEach((x) => {
      const m = String(x.target_month).slice(0, 7);
      const cur = byMonth[m] || { sales: 0, cost: 0, expenses: 0 };
      const live = liveByMonth[m] || { gross: 0, carried: 0 };
      const savedGross = Math.round(Number(x.gross_profit_jpy) || 0);
      const savedCarried = Math.round(Number(x.carried_loss_in_jpy) || 0);

      // ① この月を再集計すれば直るズレ(前月の「保存値」を基準にした期待値との比較)
      const prev = profitByMonth[String(prevMonthFirstDay(m)).slice(0, 7)];
      const prevSavedBase = prev ? (Number(prev.gross_profit_jpy) || 0) + (Number(prev.carried_loss_in_jpy) || 0) : 0;
      const expectedCarried = Math.round(prevSavedBase < 0 ? prevSavedBase : 0);

      const diffs = [];
      if (Math.round(cur.sales) !== Math.round(Number(x.total_sales_jpy) || 0)) diffs.push("売上");
      if (Math.round(cur.cost) !== Math.round(Number(x.total_purchase_cost_jpy) || 0)) diffs.push("仕入原価");
      if (Math.round(cur.expenses) !== Math.round(Number(x.total_general_expenses_jpy) || 0)) diffs.push("経費");
      if (expectedCarried !== savedCarried) diffs.push("繰越損失");

      // ② 前の月が古いせいで連鎖しているズレ(この月だけ再集計しても直らない)
      const cascade = Math.round(live.carried) !== savedCarried && expectedCarried === savedCarried;

      if (diffs.length > 0 || cascade) {
        result[x.id] = {
          diffs, cascade,
          savedGross,
          currentGross: Math.round(live.gross),
          savedBase: savedGross + savedCarried,
          currentBase: Math.round(live.gross + live.carried),
        };
      }
    });
    if (isCurrent()) { setStaleProfits(result); setStaleCheckError(false); }
  }, []);

  // monthlyProfitsが読み込まれ/更新されるたびに、保存値が最新かどうかを再判定する
  useEffect(() => { checkStaleMonthlyProfits(monthlyProfits); }, [monthlyProfits, checkStaleMonthlyProfits]);

  const loadInvoices = useCallback(async () => {
    setInvoiceError(null);
    const { data, error } = await supabase
      .from("contractor_invoices")
      .select("id,invoice_number,staff_id,target_month,monthly_profit_id,commission_base_jpy,rate_percent,amount_jpy,reimbursement_jpy,tax_rate_percent,commission_tax_jpy,issue_date,status,staff(name)")
      .order("target_month", { ascending: false })
      .order("created_at", { ascending: false });
    /* ★2026-08-22: 列不足(42703)は「マイグレーション未実行」が原因と断定できるため、
       汎用の失敗メッセージではなく、実行すべきSQLの内容まで名指しで出す(5章42番参照)。 */
    if (error) {
      setInvoiceError(
        error.code === "42703"
          ? "請求書データの取得に失敗しました。contractor_invoicesに必要な列がありません。設計書2.42のマイグレーションSQL(tax_rate_percent / commission_tax_jpy の追加)を実行してください。"
          : `請求書データの取得に失敗しました(${error.message || error.code || "原因不明"})`
      );
      setInvoices([]);
    } else {
      setInvoices(data || []);
    }
  }, []);

  useEffect(() => { loadStaff(); loadRates(); loadMonthlyProfits(); loadInvoices(); }, [loadStaff, loadRates, loadMonthlyProfits, loadInvoices]);

  const handleSaveRate = async (form) => {
    const patch = {
      staff_id: form.staff_id,
      rate_percent: Number(form.rate_percent),
      effective_from: form.effective_from,
      effective_to: form.effective_to || null,
    };

    if (form.id) {
      const { error } = await supabase.from("commission_rates").update(patch).eq("id", form.id);
      if (error) { alert("更新に失敗しました"); return; }
    } else {
      // 同一担当者で「現在も有効」(effective_to=null)な既存の歩合率があれば、
      // 新しい適用開始日の前日で自動的に終了させる(歩合率の履歴が途切れないようにするため)
      const openRate = (rates || []).find((r) => r.staff_id === form.staff_id && !r.effective_to);
      if (openRate) {
        const prevDay = addDaysISO(form.effective_from, -1);
        if (prevDay >= openRate.effective_from) {
          const { error: closeError } = await supabase
            .from("commission_rates")
            .update({ effective_to: prevDay })
            .eq("id", openRate.id);
          if (closeError) { alert("既存の歩合率の終了処理に失敗しました"); return; }
        }
      }
      const { error } = await supabase.from("commission_rates").insert(patch);
      if (error) { alert("登録に失敗しました"); return; }
    }
    setModalRate(null);
    loadRates();
  };

  const handleDeleteRate = async (id) => {
    if (!window.confirm("この歩合率を削除しますか?")) return;
    const { error } = await supabase.from("commission_rates").delete().eq("id", id);
    if (error) { alert("削除に失敗しました"); return; }
    loadRates();
  };

  /* ---- 月次損益の集計(売上合計・仕入原価合計・一般経費合計を算出し、既存行があれば再計算=update、なければinsert) ---- */
  // ★2026-08-17変更: 一覧の各行から「この月を再集計」できるよう、対象月を引数で受け取れるようにした
  //   (引数なしの場合は従来どおり画面上部で選択中の月を使う)
  const handleCalculateMonthlyProfit = async (monthArg) => {
    const targetMonth = typeof monthArg === "string" && monthArg ? monthArg : calcTargetMonth;
    if (!targetMonth) return;
    setCalculating(true);
    setProfitError(null);
    try {
      const monthStart = `${targetMonth}-01`;
      const monthEndExclusive = nextMonthFirstDay(targetMonth);

      /* 売上合計(税込)と、その月に売れた商品の原価。
         ★2026-08-24: 仕入原価は2本立てで計上する(2.45参照)。
           ①当月仕入分 … 計上開始日以降に仕入れた商品(仕入れた月に費用化)
           ②当月販売分 … **計上開始日より前に仕入れて、まだ費用化していない商品**が当月に売れた分
         ①で費用化済みの商品は②では数えないため、どの商品も必ず1回だけ経費になる(二重計上しない)。 */
      const { data: salesData, error: salesError } = await supabase
        .from("sales")
        .select("id,transaction_date,total_amount_jpy,sale_items(product_id,products(purchase_date,created_via_sale,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy))")
        .gte("transaction_date", monthStart)
        .lt("transaction_date", monthEndExclusive);
      if (salesError) { setProfitError("売上データの取得に失敗しました"); setCalculating(false); return; }

      const totalSales = (salesData || []).reduce((sum, x) => sum + (Number(x.total_amount_jpy) || 0), 0);

      // ②当月販売分: 仕入れ時に費用化していない(=isPurchaseCostCountableがfalseの)商品だけ
      const soldUncountedCost = (salesData || []).reduce((sum, sale) => (
        sum + (sale.sale_items || []).reduce((a, si) => {
          const pr = si.products;
          if (!pr || isPurchaseCostCountable(pr)) return a; // 仕入れ時に計上済みならここでは数えない
          return a + productCostJpy(pr);
        }, 0)
      ), 0);

      /* ★2026-08-23変更: 仕入原価は「その月に**仕入れた**商品の原価合計」(products.purchase_date基準)。
         従来は「その月に**売れた**商品の原価」だった(売上との対応を取る売上原価方式)が、
         サンプル・在庫を問わず仕入れた月の経費として計上する運用へ変更した(2.45参照)。
         ・purchase_dateが未入力の商品は、仕入れがまだ確定していないためどの月にも計上しない。
         ・売れたかどうかは一切見ない(未販売の在庫・サンプルも仕入月に計上される)。 */
      /* 計上開始日より前の仕入れは対象外。開始日は種類(受注/サンプル・在庫)で違うため、
         取得は「早い方の開始日」で絞り、実際の可否は isPurchaseCostCountable で1件ずつ判定する。 */
      const costStart = monthStart > PURCHASE_COST_BASIS_FROM_MIN ? monthStart : PURCHASE_COST_BASIS_FROM_MIN;
      let totalPurchaseCost = 0;
      if (costStart < monthEndExclusive) {
        const { data: purchasedData, error: purchasedError } = await supabase
          .from("products")
          .select("id,purchase_date,created_via_sale,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy")
          .gte("purchase_date", costStart)
          .lt("purchase_date", monthEndExclusive);
        if (purchasedError) { setProfitError("仕入れ商品の取得に失敗しました"); setCalculating(false); return; }
        totalPurchaseCost = (purchasedData || [])
          .filter(isPurchaseCostCountable)
          .reduce((sum, p) => sum + productCostJpy(p), 0);
      }
      totalPurchaseCost += soldUncountedCost;

      // 一般経費合計
      const { data: expenseData, error: expenseError } = await supabase
        .from("expenses")
        .select("amount_incl_tax,payment_date")
        .gte("payment_date", monthStart)
        .lt("payment_date", monthEndExclusive);
      if (expenseError) { setProfitError("経費データの取得に失敗しました"); setCalculating(false); return; }

      const totalExpenses = (expenseData || []).reduce((sum, e) => sum + (Number(e.amount_incl_tax) || 0), 0);
      const grossProfit = totalSales - totalPurchaseCost - totalExpenses;

      // ★2026-08-06実装: 前月の「粗利益+繰越損失」がマイナスなら、その分を今月への繰越損失として引き継ぐ。
      //   前月がさらに前月から繰り越している分も前月の値に既に反映されているため、直前の月だけ見れば連鎖的に正しく計算できる。
      //   前月がまだ集計されていない場合は0扱い(先に前月を集計してから今月を集計する運用を推奨)。
      const { data: prevMp, error: prevMpError } = await supabase
        .from("monthly_profits")
        .select("gross_profit_jpy,carried_loss_in_jpy")
        .eq("target_month", prevMonthFirstDay(targetMonth))
        .maybeSingle();
      if (prevMpError) { setProfitError("前月の月次損益データの確認に失敗しました"); setCalculating(false); return; }
      const prevBase = prevMp ? (Number(prevMp.gross_profit_jpy) || 0) + (Number(prevMp.carried_loss_in_jpy) || 0) : 0;
      const carriedLossIn = prevBase < 0 ? prevBase : 0;

      // target_monthはDB側がdate型のため、"YYYY-MM"のままではなく月初日("YYYY-MM-01")で保存・照会する(monthStartを流用)
      const patch = {
        target_month: monthStart,
        total_sales_jpy: totalSales,
        total_purchase_cost_jpy: totalPurchaseCost,
        total_general_expenses_jpy: totalExpenses,
        gross_profit_jpy: grossProfit,
        carried_loss_in_jpy: carriedLossIn,
        calculated_at: new Date().toISOString(),
      };

      const { data: existing, error: existingError } = await supabase
        .from("monthly_profits")
        .select("id")
        .eq("target_month", monthStart)
        .maybeSingle();
      if (existingError) { setProfitError("既存の月次損益データの確認に失敗しました"); setCalculating(false); return; }

      if (existing) {
        const { error: updateError } = await supabase.from("monthly_profits").update(patch).eq("id", existing.id);
        if (updateError) { setProfitError("月次損益の更新に失敗しました"); setCalculating(false); return; }
      } else {
        const { error: insertError } = await supabase.from("monthly_profits").insert(patch);
        if (insertError) { setProfitError("月次損益の登録に失敗しました"); setCalculating(false); return; }
      }

      await loadMonthlyProfits();
    } finally {
      setCalculating(false);
    }
  };

  /* ---- 請求内容の計算(実際のinsertは行わず、プレビューをstateに保持するだけ) ----
     1) 同一担当者・同一対象月の請求書が既に発行済みでないか確認(重複発行防止)
     2) monthly_profitsから対象月の粗利益・繰越損失を取得(未集計ならエラー)
     3) getApplicableCommissionRateで適用歩合率を取得
     4) 報酬基準額 = 粗利益 + 繰越損失(★2026-08-06実装。前月までの赤字を引き継いで相殺する)
     5) 歩合報酬 = 報酬基準額 × 歩合率 ÷ 100(円未満四捨五入)。報酬基準額が0以下、または歩合率が
        未設定の場合は歩合報酬0円として扱う(★2026-08-22変更。従来はどちらもエラーにして発行自体を止めていた)
     6) 立替精算額 = 対象月に支払った、その担当者の未精算の立替経費の合計(★2026-08-22追加。2.39参照)
     7) 歩合報酬・立替精算額がどちらも0円のときだけ発行不可とする。
        **赤字の月でも立替があれば発行できる**のがこの変更の主目的(赤字自体は従来どおり翌月へ繰り越す) */
  const handlePreviewInvoice = async () => {
    if (!issueStaffId || !issueTargetMonth) return;
    setPreviewing(true);
    setInvoicePreview(null);
    try {
      // target_month(contractor_invoices/monthly_profits共にdate型)は"YYYY-MM"のままでは照会できないため、月初日に変換する
      const issueTargetMonthDate = `${issueTargetMonth}-01`;
      const { data: existing, error: existingError } = await supabase
        .from("contractor_invoices")
        .select("id,invoice_number")
        .eq("staff_id", issueStaffId)
        .eq("target_month", issueTargetMonthDate)
        .maybeSingle();
      if (existingError) { setInvoicePreview({ error: "既存請求書の確認に失敗しました" }); return; }
      if (existing) {
        setInvoicePreview({ error: `この担当者・対象月の請求書は発行済みです(${existing.invoice_number})。再発行する場合は下の一覧から削除してから行ってください。` });
        return;
      }

      const { data: mp, error: mpError } = await supabase
        .from("monthly_profits")
        .select("id,target_month,gross_profit_jpy,carried_loss_in_jpy")
        .eq("target_month", issueTargetMonthDate)
        .maybeSingle();
      if (mpError) { setInvoicePreview({ error: "月次損益データの取得に失敗しました" }); return; }
      if (!mp) { setInvoicePreview({ error: "この対象月の月次損益がまだ集計されていません。先に「月次損益」タブで集計してください。" }); return; }

      const rate = getApplicableCommissionRate(issueStaffId, issueTargetMonth, rates || []);
      const carriedLoss = Number(mp.carried_loss_in_jpy) || 0;
      const commissionBase = (Number(mp.gross_profit_jpy) || 0) + carriedLoss;

      // 歩合報酬。歩合率が未設定、または報酬基準額が0以下(赤字)の月は0円として続行する
      const notes = [];
      let amount = 0;
      if (!rate) {
        notes.push("この担当者・対象月に適用できる歩合率が設定されていないため、歩合報酬は¥0として計算しています(「歩合率設定」タブで登録できます)。");
      } else if (commissionBase <= 0) {
        notes.push(`報酬基準額が${fmtJPY(commissionBase)}(粗利益${fmtJPY(mp.gross_profit_jpy)} + 繰越損失${fmtJPY(carriedLoss)})のため、この月の歩合報酬は発生しません。この赤字は翌月以降に自動で繰り越されます。`);
      } else {
        amount = Math.round(commissionBase * (Number(rate.rate_percent) || 0) / 100);
      }

      // 立替精算額。担当者に立替区分(staff.expense_payment_method)が設定されている場合のみ集計する
      const staffRow = (staffList || []).find((s) => s.id === issueStaffId) || {};
      const advanceMethod = staffRow.expense_payment_method || null;
      let reimbursementRows = [];
      let reimbursementTotal = 0;
      if (advanceMethod) {
        const rres = await fetchReimbursableExpenses(advanceMethod, issueTargetMonth);
        if (!rres.ok) { setInvoicePreview({ error: rres.message }); return; }
        reimbursementRows = rres.rows;
        reimbursementTotal = rres.total;

        // 支払日が未来の経費(支払予定日を先に入力してあるもの)は、まだ立て替えていない可能性がある。
        // 黙って除外も黙って加算もせず、明示して人に判断してもらう。
        const today = todayISO();
        const future = reimbursementRows.filter((r) => String(r.payment_date) > today);
        if (future.length > 0) {
          const futureTotal = future.reduce((s, r) => s + (Number(r.amount_incl_tax) || 0), 0);
          notes.push(`⚠️ 支払日が未来の立替経費が${future.length}件(${fmtJPY(futureTotal)})含まれています(${future.map((r) => r.payment_date).join("、")})。まだ実際に立て替えていない場合は、支払後に発行してください。`);
        }
      } else {
        notes.push("この担当者には立替区分(「立替(◯)」との対応)が設定されていないため、立替精算は含まれていません。「歩合率設定」タブの「立替区分の対応」で設定できます。");
      }

      const total = amount + reimbursementTotal;
      if (total <= 0) {
        setInvoicePreview({
          error: `歩合報酬・立替精算ともに¥0のため、この月に請求できる金額がありません。\n${notes.join("\n")}`,
        });
        return;
      }

      setInvoicePreview({
        monthlyProfit: mp, rate, amount, commissionBase, carriedLoss,
        advanceMethod, reimbursementRows, reimbursementTotal, total, notes,
      });
    } finally {
      setPreviewing(false);
    }
  };

  /* ---- プレビュー内容でcontractor_invoicesにinsertし、実際に発行する ----
     ★2026-08-22変更: 立替精算を含む場合は、発行した請求書のidを対象の経費へ書き戻して
     「この立替はこの請求書で精算する」という紐付けを作る(expenses.reimbursed_invoice_id)。
     ・この時点では reimbursement_status は「未精算」のまま。実際に支払った(請求書を「支払済み」に
       した)タイミングで「精算済み」に変える(2.39参照)。
     ・紐付けの更新には `.is("reimbursed_invoice_id", null)` を付ける。プレビューを開いたまま
       別の操作で同じ経費が他の請求書に紐付いた場合に、二重に奪ってしまわないため。
     ・Supabaseはクライアント側でトランザクションを張れないため、請求書のinsertは成功したが
       紐付けに失敗する場合がありうる。その場合は黙って進めず、何が起きたかを明示する。 */
  const handleIssueInvoice = async () => {
    if (!invoicePreview || invoicePreview.error) return;
    setIssuing(true);
    try {
      const issueDate = todayISO();
      const invoiceNumber = await generateInvoiceNumber(issueDate);
      const { data: inserted, error } = await supabase.from("contractor_invoices").insert({
        invoice_number: invoiceNumber,
        staff_id: issueStaffId,
        target_month: `${issueTargetMonth}-01`,
        monthly_profit_id: invoicePreview.monthlyProfit.id,
        commission_base_jpy: invoicePreview.commissionBase,
        // 歩合率が未設定の月は0%として記録する(rate_percentはNOT NULLのため)
        rate_percent: invoicePreview.rate ? invoicePreview.rate.rate_percent : 0,
        amount_jpy: invoicePreview.amount,
        reimbursement_jpy: invoicePreview.reimbursementTotal || 0,
        // 発行時点の税率と、そこから割り戻した消費税額を固定して保存する(2.42参照)
        tax_rate_percent: CONSUMPTION_TAX_RATE_PERCENT,
        commission_tax_jpy: splitTaxIncluded(invoicePreview.amount, CONSUMPTION_TAX_RATE_PERCENT).tax,
        issue_date: issueDate,
        status: "未払い",
      }).select("id").single();
      if (error || !inserted) { alert("請求書の発行に失敗しました"); return; }

      const targetIds = (invoicePreview.reimbursementRows || []).map((r) => r.id);
      if (targetIds.length > 0) {
        const { data: linked, error: linkErr } = await supabase
          .from("expenses")
          .update({ reimbursed_invoice_id: inserted.id })
          .in("id", targetIds)
          .is("reimbursed_invoice_id", null)
          .select("id");
        if (linkErr) {
          alert(`請求書(${invoiceNumber})は発行されましたが、立替経費との紐付けに失敗しました。\nこの請求書を削除してから、もう一度発行し直してください。`);
        } else if ((linked || []).length !== targetIds.length) {
          alert(`請求書(${invoiceNumber})は発行されましたが、立替経費${targetIds.length}件のうち${(linked || []).length}件しか紐付けられませんでした。\n他の請求書で先に精算された可能性があります。この請求書を削除してから計算し直してください。`);
        }
      }

      setInvoicePreview(null);
      setIssueStaffId("");
      await loadInvoices();
    } finally {
      setIssuing(false);
    }
  };

  /* ★2026-08-22変更: 支払済み/未払いの切り替えに合わせて、その請求書で精算する立替経費の
     reimbursement_status も追従させる(2.39参照)。実際にお金を払った時点で「精算済み」になる。 */
  const handleUpdateInvoiceStatus = async (id, status) => {
    const { error } = await supabase.from("contractor_invoices").update({ status }).eq("id", id);
    if (error) { alert("ステータスの更新に失敗しました"); return; }

    const nextExpenseStatus = status === "支払済み" ? "精算済み" : "未精算";
    const { error: expErr } = await supabase
      .from("expenses")
      .update({ reimbursement_status: nextExpenseStatus })
      .eq("reimbursed_invoice_id", id);
    if (expErr) {
      alert(`請求書のステータスは「${status}」に変更しましたが、紐づく立替経費の精算状況を「${nextExpenseStatus}」へ更新できませんでした。\n経費ページで手動で変更してください。`);
    }
    loadInvoices();
  };

  /* ★2026-08-22変更: 削除の前に、紐づく立替経費を必ず「未精算」に戻して紐付けを外す。
     先に請求書を消すとFKが ON DELETE SET NULL で紐付けだけ消え、「精算済み」の状態が
     取り残されて、その立替が二度と請求書に載らなくなる(静かに払い漏れる)。 */
  const handleDeleteInvoice = async (id) => {
    const inv = (invoices || []).find((x) => x.id === id) || {};
    const reimb = Number(inv.reimbursement_jpy) || 0;
    const confirmMsg = reimb > 0
      ? `この請求書を削除しますか?\n\n含まれている立替精算 ${fmtJPY(reimb)} は「未精算」に戻り、次回以降の請求書で改めて精算できるようになります。`
      : "この請求書を削除しますか?";
    if (!window.confirm(confirmMsg)) return;

    const { error: revertErr } = await supabase
      .from("expenses")
      .update({ reimbursement_status: "未精算", reimbursed_invoice_id: null })
      .eq("reimbursed_invoice_id", id);
    if (revertErr) {
      alert("紐づく立替経費を未精算へ戻せなかったため、請求書の削除を中止しました。\nもう一度お試しください。");
      return;
    }

    const { error } = await supabase.from("contractor_invoices").delete().eq("id", id);
    if (error) { alert("削除に失敗しました"); return; }
    loadInvoices();
  };

  /* ★2026-08-22実装: 担当者と「立替(◯)」の対応づけ(staff.expense_payment_method)を保存する。
     同じ立替区分を2人が持つと同じ経費が二重に請求されるため、DB側にも部分UNIQUEインデックスを
     張ってある。違反時(23505)は分かりやすい文言に置き換えて伝える。 */
  /* ★2026-08-22変更: 立替区分に加えて、請求書PDFに印字する住所・連絡先・振込先もまとめて保存する(2.40参照)。
     patchの列は STAFF_PROFILE_SELECT と対応させること(片方だけ増やすと保存されない/消える。5章38番参照)。 */
  const handleSaveStaffProfile = async (staffId, form) => {
    const patch = {
      name: (form.name || "").trim(),
      expense_payment_method: form.expense_payment_method || null,
      postal_code: form.postal_code || null,
      prefecture: form.prefecture || null,
      city: form.city || null,
      address_line: form.address_line || null,
      building: form.building || null,
      phone: form.phone || null,
      bank_name: form.bank_name || null,
      bank_branch: form.bank_branch || null,
      bank_account_type: form.bank_account_type || null,
      bank_account_number: form.bank_account_number || null,
      bank_account_holder: form.bank_account_holder || null,
    };
    if (!patch.name) { alert("担当者名は必須です"); return; }
    const { error } = await supabase.from("staff").update(patch).eq("id", staffId);
    if (error) {
      if (error.code === "23505") {
        alert(`「${form.expense_payment_method}」は既に別の担当者に設定されています。\n同じ立替区分を2人に設定すると、同じ経費が二重に請求されてしまうため、先にもう一方の設定を外してください。`);
      } else {
        alert("担当者情報の保存に失敗しました");
      }
      return;
    }
    setProfileStaff(null);
    await loadStaff();
  };

  const handleDeleteMonthlyProfit = async (id) => {
    if (!window.confirm("この月次損益を削除しますか?")) return;
    const { error } = await supabase.from("monthly_profits").delete().eq("id", id);
    if (error) { alert("削除に失敗しました"); return; }
    loadMonthlyProfits();
  };

  return (
    <div className="px-4 md:px-6 py-6 md:py-8 max-w-5xl mx-auto w-full space-y-5">
      <div className="flex gap-2 flex-wrap">
        {CONTRACTOR_TABS.map((t) => (
          <button
            key={t.key}
            onClick={() => setTab(t.key)}
            className="text-sm px-3.5 py-2 rounded-lg"
            style={{
              background: tab === t.key ? "var(--mz-gold)" : "transparent",
              color: tab === t.key ? "#1a1710" : "var(--mz-ink-muted)",
              border: "1px solid var(--mz-border)",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {error && (
        <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>
      )}

      {tab === "rates" && (
        <>
          {/* ★2026-08-22実装: 担当者情報(立替区分・住所・連絡先・振込先)。2.39・2.40参照。
              ・立替区分: 経費の支払方法「立替(◯)」と担当者を紐付ける。未設定だと立替精算が請求書に入らない。
              ・住所/連絡先/振込先: 請求書PDFの請求者欄に印字する。 */}
          <div
            className="rounded-xl p-4 space-y-3"
            style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
          >
            <div>
              <p className="font-display text-base">担当者情報</p>
              <p className="text-xs mt-1" style={{ color: "var(--mz-ink-muted)" }}>
                立替区分(経費の「立替(◯)」との対応)と、請求書に印字する住所・連絡先・振込先を登録します。
              </p>
            </div>
            <div className="space-y-2">
              {staffList.map((s) => {
                const hasAddress = staffAddressLines(s).length > 0;
                const hasBank = !!staffBankLine(s);
                return (
                  <div
                    key={s.id}
                    className="rounded-lg p-3 flex flex-wrap items-center justify-between gap-3"
                    style={{ border: "1px solid var(--mz-border)" }}
                  >
                    <div className="min-w-0">
                      <p className="text-sm">{s.name}</p>
                      <div className="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                        <span>立替区分: {s.expense_payment_method || "(未設定)"}</span>
                        <span>住所: {hasAddress ? "登録済み" : "未登録"}</span>
                        <span>振込先: {hasBank ? "登録済み" : "未登録"}</span>
                      </div>
                    </div>
                    <button
                      onClick={() => setProfileStaff(s)}
                      className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                      style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                    >
                      編集
                    </button>
                  </div>
                );
              })}
              {staffList.length === 0 && (
                <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>担当者が登録されていません</p>
              )}
            </div>
          </div>

          <div className="flex justify-end">
            <button
              onClick={() => setModalRate({})}
              className="rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap"
              style={{ background: "var(--mz-gold)", color: "#1a1710" }}
            >
              + 新規歩合率
            </button>
          </div>
          {rates === null ? (
            <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
          ) : (
            <CommissionRateList rates={rates} staffList={staffList} onEdit={setModalRate} onDelete={handleDeleteRate} />
          )}
        </>
      )}

      {tab === "profits" && (
        <>
          {profitError && (
            <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{profitError}</p>
          )}
          <div
            className="rounded-xl p-4 flex flex-wrap items-end gap-3"
            style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
          >
            <div>
              <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>対象月</label>
              <input
                type="month"
                value={calcTargetMonth}
                onChange={(e) => setCalcTargetMonth(e.target.value)}
                className="rounded-lg px-3 py-2 text-sm bg-transparent"
                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
              />
            </div>
            <button
              onClick={() => handleCalculateMonthlyProfit()}
              disabled={calculating || !calcTargetMonth}
              className="rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap disabled:opacity-60"
              style={{ background: "var(--mz-gold)", color: "#1a1710" }}
            >
              {calculating ? "集計中..." : "この月を集計する"}
            </button>
            <p className="text-xs w-full" style={{ color: "var(--mz-ink-muted)" }}>
              売上合計(税込)・その月に仕入れた商品の原価合計(仕入れ日基準・売れたかどうかは問いません)・一般経費合計から粗利益を自動算出します。既にこの対象月のデータがあれば上書き(再集計)されます。
              <br />
              <span style={{ color: "#e3c489" }}>
                仕入原価の計上開始日: 受注商品(オーダー)は{PURCHASE_COST_BASIS_FROM_ORDER}以降、
                サンプル・在庫は{PURCHASE_COST_BASIS_FROM_SAMPLE}以降に仕入れた分のみ計上します(それより前の仕入れは対象外)。
              </span>
            </p>
          </div>

          {/* ★2026-08-17実装: 鮮度チェック自体が失敗した場合。警告が出ていないこと=最新、と
              誤解されないよう明示する(2.36参照) */}
          {staleCheckError && (
            <p className="text-xs rounded-lg px-3 py-2" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
              ⚠️ 集計内容が最新かどうかの確認ができませんでした(通信エラー、または対象データが多すぎます)。
              下の警告表示は最新でない可能性があります。報酬を発行する前に、対象月を一度集計し直すことをおすすめします。
            </p>
          )}

          {monthlyProfits === null ? (
            <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
          ) : (
            <MonthlyProfitList
              profits={monthlyProfits}
              onDelete={handleDeleteMonthlyProfit}
              staleProfits={staleProfits}
              recalculating={calculating}
              onRecalculate={(month) => handleCalculateMonthlyProfit(month)}
              onShowDetail={setDetailProfit}
            />
          )}
        </>
      )}

      {tab === "invoices" && (
        <>
          {invoiceError && (
            <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{invoiceError}</p>
          )}

          <div
            className="rounded-xl p-4 space-y-3"
            style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
          >
            <div className="flex flex-wrap items-end gap-3">
              <div>
                <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>担当者</label>
                <select
                  value={issueStaffId}
                  onChange={(e) => { setIssueStaffId(e.target.value); setInvoicePreview(null); }}
                  className="rounded-lg px-3 py-2 text-sm bg-transparent"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                >
                  <option value="">選択してください</option>
                  {staffList.map((s) => (
                    <option key={s.id} value={s.id}>{s.name}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>対象月</label>
                <input
                  type="month"
                  value={issueTargetMonth}
                  onChange={(e) => { setIssueTargetMonth(e.target.value); setInvoicePreview(null); }}
                  className="rounded-lg px-3 py-2 text-sm bg-transparent"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                />
              </div>
              <button
                onClick={handlePreviewInvoice}
                disabled={previewing || !issueStaffId || !issueTargetMonth}
                className="rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap disabled:opacity-60"
                style={{ background: "var(--mz-gold)", color: "#1a1710" }}
              >
                {previewing ? "確認中..." : "請求内容を計算する"}
              </button>
            </div>

            {invoicePreview && invoicePreview.error && (
              <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{invoicePreview.error}</p>
            )}

            {invoicePreview && !invoicePreview.error && (
              <div
                className="rounded-lg p-3 flex flex-wrap items-center justify-between gap-3"
                style={{ border: "1px solid var(--mz-border)" }}
              >
                <div className="text-xs space-y-1" style={{ color: "var(--mz-ink-muted)" }}>
                  <p>対象月の粗利益: {fmtJPY(invoicePreview.monthlyProfit.gross_profit_jpy)}</p>
                  {invoicePreview.carriedLoss < 0 && (
                    <p>前月までの繰越損失: {fmtJPY(invoicePreview.carriedLoss)}</p>
                  )}
                  <p>報酬基準額: {fmtJPY(invoicePreview.commissionBase)}</p>
                  <p>適用歩合率: {invoicePreview.rate ? `${invoicePreview.rate.rate_percent}%` : "(未設定)"}</p>
                  <p>歩合報酬(税込): {fmtJPY(invoicePreview.amount)}
                    <span style={{ color: "#8b8578" }}>
                      {" "}(税抜 {fmtJPY(splitTaxIncluded(invoicePreview.amount, CONSUMPTION_TAX_RATE_PERCENT).excluded)}
                      {" / "}消費税{CONSUMPTION_TAX_RATE_PERCENT}% {fmtJPY(splitTaxIncluded(invoicePreview.amount, CONSUMPTION_TAX_RATE_PERCENT).tax)})
                    </span>
                  </p>

                  {/* ★2026-08-22: 立替精算の内訳。金額だけ出すと「何が入っているか」が分からず、
                      入れ忘れ・入れ過ぎに気づけないため、対象の経費を必ず明細で出す(2.39参照) */}
                  <p>立替精算: {fmtJPY(invoicePreview.reimbursementTotal || 0)}
                    {invoicePreview.advanceMethod ? `(${invoicePreview.advanceMethod})` : ""}</p>
                  {(invoicePreview.reimbursementRows || []).length > 0 && (
                    <ul className="pl-3 space-y-0.5" style={{ listStyleType: "disc" }}>
                      {invoicePreview.reimbursementRows.map((r) => (
                        <li key={r.id}>
                          {r.payment_date} {r.payee || "(支払先未入力)"}
                          {r.item_name ? ` / ${r.item_name}` : ""} … {fmtJPY(r.amount_incl_tax)}
                        </li>
                      ))}
                    </ul>
                  )}

                  <p className="text-sm font-display pt-1" style={{ color: "var(--mz-ink)" }}>
                    請求金額(合計): {fmtJPY(invoicePreview.total)}
                  </p>
                  {(invoicePreview.notes || []).map((n, i) => (
                    <p key={i} style={{ color: "#e3c489" }}>{n}</p>
                  ))}
                </div>
                <button
                  onClick={handleIssueInvoice}
                  disabled={issuing}
                  className="rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap disabled:opacity-60"
                  style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                >
                  {issuing ? "発行中..." : "この内容で発行する"}
                </button>
              </div>
            )}
          </div>

          {invoices === null ? (
            <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
          ) : (
            <ContractorInvoiceList invoices={invoices} onUpdateStatus={handleUpdateInvoiceStatus} onDelete={handleDeleteInvoice} onViewInvoice={setViewInvoice} />
          )}
        </>
      )}

      {detailProfit && (
        <MonthlyProfitDetailModal
          month={String(detailProfit.target_month).slice(0, 7)}
          saved={detailProfit}
          onClose={() => setDetailProfit(null)}
        />
      )}

      {profileStaff && (
        <StaffProfileFormModal
          staff={profileStaff}
          onClose={() => setProfileStaff(null)}
          onSave={handleSaveStaffProfile}
        />
      )}

      {viewInvoice && (
        <ContractorInvoicePreviewModal invoice={viewInvoice} onClose={() => setViewInvoice(null)} />
      )}

      {modalRate && (
        <CommissionRateFormModal
          rate={modalRate}
          staffList={staffList}
          onClose={() => setModalRate(null)}
          onSave={handleSaveRate}
        />
      )}
    </div>
  );
}

/* ============================================================
   ルート → ページ の対応
   ============================================================ */
const ROUTE_MAP = {
  "#/dashboard": "dashboard",
  "#/host-clubs": "host_clubs",
  "#/products": "products",
  "#/sales": "sales",
  "#/catalogs": "catalogs",
  "#/tasks": "tasks",
  "#/wallet": "wallet_charges",
  "#/expenses": "expenses",
  "#/contractor-invoices": "contractor_invoices",
};

/* ============================================================
   アプリ本体シェル(認証後の画面)
   ============================================================ */
function AppShell({ staffName, onSwitchStaff, onSignOut }) {
  const hash = useHashRoute();
  const [drawerOpen, setDrawerOpen] = useState(false);

  // "#/host-clubs/xxx" のような詳細ルートも "host_clubs" としてサイドバーをハイライト
  const activeKey = hash.startsWith("#/host-clubs")
    ? "host_clubs"
    : (ROUTE_MAP[hash] || "dashboard");
  const activeItem = FLAT_NAV.find((i) => i.key === activeKey) || FLAT_NAV[0];

  // ルート遷移時にモバイルドロワーを自動で閉じる
  useEffect(() => { setDrawerOpen(false); }, [hash]);

  return (
    <div className="min-h-screen flex" style={{ background: "var(--mz-bg)" }}>
      {/* デスクトップ用固定サイドバー */}
      <aside
        className="hidden md:flex md:flex-col w-64 shrink-0 fixed inset-y-0 left-0"
        style={{ background: "var(--mz-surface)", borderRight: "1px solid var(--mz-border)" }}
      >
        <SidebarContent activeKey={activeKey} onNavigate={() => {}} />
      </aside>

      {/* モバイル用ドロワー */}
      <MobileDrawer
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        activeKey={activeKey}
        onNavigate={() => {}}
      />

      {/* メインエリア */}
      <div className="flex-1 md:ml-64 flex flex-col min-w-0">
        <TopBar
          title={activeItem.label}
          onMenuClick={() => setDrawerOpen(true)}
          staffName={staffName}
          onSwitchStaff={onSwitchStaff}
          onSignOut={onSignOut}
        />
        <main className="flex-1">
          {activeKey === "tasks" ? (
            <TasksPage />
          ) : activeKey === "host_clubs" ? (
            <HostClubsRouter hash={hash} />
          ) : activeKey === "wallet_charges" ? (
            <WalletPage />
          ) : activeKey === "products" ? (
            <ProductsPage />
          ) : activeKey === "sales" ? (
            <SalesPage />
          ) : activeKey === "catalogs" ? (
            <CatalogsPage />
          ) : activeKey === "dashboard" ? (
            <DashboardPage />
          ) : activeKey === "expenses" ? (
            <ExpensesPage />
          ) : activeKey === "contractor_invoices" ? (
            <ContractorInvoicesPage />
          ) : (
            <PlaceholderPage item={activeItem} />
          )}
        </main>
      </div>
    </div>
  );
}

/* ============================================================
   カタログ 公開閲覧ページ(#/catalog/:token)
   ログイン不要。認証ゲートの外側(App関数の最初)で描画する。
   get_public_catalog RPC(SECURITY DEFINER)経由でのみデータ取得し、
   catalogs/products テーブルへの直接アクセスは行わない。
   ============================================================ */
function PublicCatalogItemCard({ item, onZoom }) {
  // ★2026-07-12実装: 処分用サンプルは「その1点しかない現品」であり、サイズ展開(選べる範囲)を
  //   見せると誤解を招くため、登録された実サイズのみを表示し、「現品限り」の注記を添える。
  const isDisposal = item.sample_purpose === "処分用";
  /* ★2026-08-23実装: まだ仕入れていない、カタログ掲載のためだけに登録した商品(2.47参照)。
     現物サンプルが手元にないことをホストに伝えるため「サンプル品なし(お取り寄せ)」と明示する。
     ・実サイズ(size)は未入力なので「サンプルサイズ」の行は自然に出ず、「サイズ展開」だけが出る。
     ・処分用とは同時に成立しないが、万一両方に該当した場合は「現品限り」を優先する
       (現品限りの方がホストにとって影響が大きい情報のため)。
     ・cost_sourceはget_public_catalog RPCの戻り値に追加が必要(2.48参照)。RPC未更新の間は
       undefinedになりバッジが出ないだけで、他の表示は壊れない。 */
  const isOrderOnly = !isDisposal && item.cost_source === COST_SOURCE_NONE;

  return (
    <div
      className="rounded-xl overflow-hidden flex flex-col"
      style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
    >
      {/* ★2026-08-23実装: 画像タップで拡大表示(2.49参照)。画像が無い商品は押しても何も起きない */}
      <div
        className="relative aspect-square w-full flex items-center justify-center"
        style={{ background: "var(--mz-surface-hover)", cursor: item.product_image_url ? "zoom-in" : "default" }}
        onClick={() => { if (item.product_image_url && onZoom) onZoom(item); }}
        role={item.product_image_url ? "button" : undefined}
        aria-label={item.product_image_url ? `${item.product_name || "商品"}の画像を拡大` : undefined}
      >
        {item.product_image_url ? (
          <img src={item.product_image_url} alt={item.product_name || ""} className="w-full h-full object-cover" />
        ) : (
          <Icon name="tag" className="w-8 h-8" style={{ color: "var(--mz-ink-muted)" }} />
        )}
        {isDisposal && (
          <span
            className="absolute top-2 left-2 text-[10px] px-2 py-0.5 rounded-full"
            style={{ background: "#3a2a1f", color: "#d6a98f", border: "1px solid rgba(0,0,0,0.3)" }}
          >
            現品限り
          </span>
        )}
        {isOrderOnly && (
          <span
            className="absolute top-2 left-2 text-[10px] px-2 py-0.5 rounded-full"
            style={{ background: "#22303a", color: "#9fc4d6", border: "1px solid rgba(0,0,0,0.3)" }}
          >
            サンプル品なし(お取り寄せ)
          </span>
        )}
      </div>
      <div className="p-3 space-y-1">
        <p className="font-display text-sm truncate">{item.product_name || "(名称未設定)"}</p>
        <div className="flex items-center justify-between text-xs gap-2" style={{ color: "var(--mz-ink-muted)" }}>
          <span className="truncate">{item.product_code ? `No.${item.product_code}` : ""}</span>
          {item.selling_price_jpy != null && (
            <span className="font-medium shrink-0" style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(item.selling_price_jpy)}</span>
          )}
        </div>
        {isDisposal ? (
          item.size && (
            <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>サンプルサイズ: {item.size}(現品限り)</p>
          )
        ) : (
          <>
            {item.size && (
              <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>サンプルサイズ: {item.size}</p>
            )}
            {item.size_options && (
              <p className="text-xs break-words" style={{ color: "var(--mz-ink-muted)" }}>サイズ展開: {item.size_options}</p>
            )}
          </>
        )}
        {item.category && (
          <p className="text-xs truncate" style={{ color: "var(--mz-ink-muted)" }}>{item.category}</p>
        )}
      </div>
    </div>
  );
}

/* ★2026-08-23実装: 公開カタログの画像拡大表示(2.49参照)。
   ・ホストはスマホで見るため、画面いっぱいに表示して指で閉じられることを優先する。
     背景タップ・×ボタン・Escキーのいずれでも閉じられる。
   ・画像は object-contain。カード側は object-cover でトリミングされているため、
     拡大時は**切れていない全体**が見えるようにする(柄・丈の確認が目的のため)。
   ・カタログは複数点を続けて見るものなので、左右の矢印と←→キーで隣の商品へ移動できる。
     画像が無い商品は送り先に含めない(押しても真っ白になるだけのため)。 */
function PublicCatalogLightbox({ items, index, onClose, onMove }) {
  const item = items[index];

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      else if (e.key === "ArrowRight") onMove(1);
      else if (e.key === "ArrowLeft") onMove(-1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, onMove]);

  if (!item) return null;

  return (
    <div
      className="fixed inset-0 z-50 flex flex-col"
      style={{ background: "rgba(0,0,0,0.92)" }}
      onClick={onClose}
    >
      <div className="flex items-center justify-between p-3 shrink-0">
        <span className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          {index + 1} / {items.length}
        </span>
        <button
          onClick={onClose}
          className="text-sm px-3 py-1.5 rounded-lg"
          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
        >
          閉じる
        </button>
      </div>

      <div className="flex-1 min-h-0 flex items-center justify-center px-2">
        <img
          src={item.product_image_url}
          alt={item.product_name || ""}
          className="max-w-full max-h-full object-contain"
          onClick={(e) => e.stopPropagation()}
        />
      </div>

      <div className="shrink-0 p-4 text-center space-y-1" onClick={(e) => e.stopPropagation()}>
        <p className="font-display text-base">{item.product_name || "(名称未設定)"}</p>
        <div className="flex items-center justify-center gap-3 text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          {item.product_code && <span>No.{item.product_code}</span>}
          {item.selling_price_jpy != null && (
            <span style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(item.selling_price_jpy)}</span>
          )}
        </div>
        {item.size_options && (
          <p className="text-xs break-words" style={{ color: "var(--mz-ink-muted)" }}>サイズ展開: {item.size_options}</p>
        )}
        {items.length > 1 && (
          <div className="flex items-center justify-center gap-3 pt-2">
            <button onClick={() => onMove(-1)} className="text-sm px-4 py-2 rounded-lg"
              style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>← 前</button>
            <button onClick={() => onMove(1)} className="text-sm px-4 py-2 rounded-lg"
              style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>次 →</button>
          </div>
        )}
      </div>
    </div>
  );
}

function PublicCatalogPage({ token }) {
  const [items, setItems] = useState(null); // null = 読み込み中
  const [catalogName, setCatalogName] = useState("");
  const [notFound, setNotFound] = useState(false);
  // ★2026-08-23: 画像拡大表示(2.49参照)。画像がある商品だけを送り対象にする
  const [zoomIndex, setZoomIndex] = useState(null);
  const zoomableItems = useMemo(() => (items || []).filter((x) => x.product_image_url), [items]);

  useEffect(() => {
    let cancelled = false;
    supabase.rpc("get_public_catalog", { p_token: token }).then(({ data, error }) => {
      if (cancelled) return;
      if (error || !data || data.length === 0) {
        setItems([]);
        setNotFound(true);
        return;
      }
      setCatalogName(data[0].catalog_name || "");
      setItems(data);
    });
    return () => { cancelled = true; };
  }, [token]);

  return (
    <div className="min-h-screen" style={{ background: "var(--mz-bg)", color: "var(--mz-ink)" }}>
      <header className="px-4 md:px-6 py-6 text-center" style={{ borderBottom: "1px solid var(--mz-border)" }}>
        <p className="text-xs tracking-widest" style={{ color: "var(--mz-ink-muted)" }}>IMPORT PRIME</p>
        <h1 className="font-display text-xl mt-1">{catalogName || "カタログ"}</h1>
      </header>

      <main className="px-4 md:px-6 py-6 max-w-5xl mx-auto w-full">
        {items === null && (
          <p className="text-sm text-center py-16" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
        )}
        {items !== null && notFound && (
          <p className="text-sm text-center py-16" style={{ color: "var(--mz-ink-muted)" }}>
            このカタログは見つかりませんでした。リンクをもう一度ご確認ください。
          </p>
        )}
        {items !== null && !notFound && items.length === 0 && (
          <p className="text-sm text-center py-16" style={{ color: "var(--mz-ink-muted)" }}>掲載商品がありません</p>
        )}
        {items !== null && items.length > 0 && (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {items.map((item) => (
              <PublicCatalogItemCard
                key={item.product_id}
                item={item}
                onZoom={(it) => {
                  const idx = zoomableItems.findIndex((x) => x.product_id === it.product_id);
                  if (idx >= 0) setZoomIndex(idx);
                }}
              />
            ))}
          </div>
        )}
      </main>

      {zoomIndex !== null && zoomableItems.length > 0 && (
        <PublicCatalogLightbox
          items={zoomableItems}
          index={zoomIndex}
          onClose={() => setZoomIndex(null)}
          onMove={(dir) => setZoomIndex((prev) => {
            // 端まで来たら反対側へ回り込む(カタログを一周見て回れるように)
            const n = zoomableItems.length;
            return ((prev + dir) % n + n) % n;
          })}
        />
      )}
    </div>
  );
}

/* ============================================================
   ルートコンポーネント(認証ゲート)
   ============================================================ */
function App() {
  const hash = useHashRoute();

  // カタログ公開閲覧ページ(#/catalog/:token)は認証ゲートの外側で描画する
  if (hash.startsWith("#/catalog/")) {
    const token = hash.slice("#/catalog/".length);
    return <PublicCatalogPage token={token} />;
  }

  const { session, submitPasscode, signOut } = useAuth();
  const [staff, setStaff] = useState(undefined); // undefined = 未確認, null = 未選択

  // セッションが確定したら、ブラウザ保存済みの担当者選択を読み込む
  // (これにより2回目以降のアクセスでは合言葉・名前選択が自動スキップされる)
  useEffect(() => {
    if (session) {
      let stored = null;
      try {
        const raw = localStorage.getItem(STAFF_STORAGE_KEY);
        stored = raw ? JSON.parse(raw) : null;
      } catch {
        stored = null;
      }
      setStaff(stored);

      /* ★2026-08-22追加: localStorageに入っているのは選択時点の担当者情報のスナップショットのため、
         あとから担当者名を変更すると、右上の表示だけが古い名前のまま残る(2.40参照)。
         セッション確定時にidでDBから読み直し、名前が変わっていれば保存内容ごと更新する。
         ・行が消えている場合は選択を解除して担当者選択画面へ戻す(退職・誤削除の考慮)。
         ・通信エラー時は何もしない(オフラインで使えなくならないよう、保存済みの内容をそのまま使う)。 */
      if (stored && stored.id) {
        (async () => {
          const { data, error } = await supabase.from("staff").select("id,name,is_active").eq("id", stored.id).maybeSingle();
          if (error) return;
          if (!data) {
            localStorage.removeItem(STAFF_STORAGE_KEY);
            setStaff(null);
            return;
          }
          if (data.name !== stored.name) {
            const refreshed = { ...stored, ...data };
            localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(refreshed));
            setStaff(refreshed);
          }
        })();
      }
    } else if (session === null) {
      setStaff(null);
    }
  }, [session]);

  const loading = session === undefined || (session && staff === undefined);
  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: "var(--mz-bg)", color: "var(--mz-ink-muted)" }}>
        読み込み中...
      </div>
    );
  }

  // 1. 合言葉が未入力(セッションなし)
  if (!session) {
    return <PasscodeScreen onSubmit={submitPasscode} />;
  }

  // 2. セッションはあるが担当者未選択(初回、または「担当者を変更」直後)
  if (!staff) {
    return <WhoAreYouScreen onSelect={setStaff} />;
  }

  // 3. 通常利用
  return (
    <AppShell
      staffName={staff.name}
      onSwitchStaff={() => {
        localStorage.removeItem(STAFF_STORAGE_KEY);
        setStaff(null);
      }}
      onSignOut={signOut}
    />
  );
}

const rootEl = document.getElementById("root");
if (!rootEl._meizazy69Rendered) {
  rootEl._meizazy69Rendered = true;
  const root = ReactDOM.createRoot(rootEl);
  root.render(<App />);
}
})();
</script>
