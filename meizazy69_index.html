    if (selectedSales.length === 0) return;
    const club = clubs.find((c) => c.id === selectedSales[0].host_club_id);
    if (club) setRecipientName(club.name);
    // eslint-disable-next-line
  }, [selectedSales.length]);

  const allItems = useMemo(() => selectedSales.flatMap((s) => s.sale_items || []), [selectedSales]);
  const totalInclJpy = allItems.reduce((sum, it) => sum + (Number(it.unit_price_jpy) || 0), 0);
  const totals = calcReceiptTotals(totalInclJpy);

  const handleIssue = async () => {
    setError(null);
    if (selectedSales.length < 2) { setError("2件以上の注文を選択してください"); return; }
    if (!recipientName.trim()) { setError("宛名を入力してください"); return; }
    if (!window.confirm(`${selectedSales.length}件の注文をまとめ、「${recipientName.trim()} 様」宛の領収書(合計${fmtJPY(totals.total)})を発行します。元の個別領収書は無効化されます。よろしいですか?`)) return;

    setIssuing(true);

    // 付け替え前に、選択した各注文が現在持っている領収書idを控えておく(後で不要になった分を削除するため)
    const oldReceiptIds = [...new Set(selectedSales.map((s) => s.receipt_id).filter(Boolean))];

    const issueDate = todayISO();
    const receiptNumber = await generateReceiptNumber(issueDate);

    const { data: newReceipt, error: receiptErr } = await supabase
      .from("receipts")
      .insert({
        receipt_number: receiptNumber,
        sale_id: null, // まとめ領収書は特定の1販売に紐付かないためnull(receipt_salesで管理)
        issue_date: issueDate,
        recipient_name: recipientName.trim(),
        honorific: honorific,
        memo: memo.trim() || "衣装代",
        received_date: receivedDate || issueDate,
        payment_type: paymentType,
        subtotal_jpy: totals.subtotal,
        tax_jpy: totals.tax,
        total_jpy: totals.total,
        issuer_info: ISSUER_INFO_DEFAULT,
      })
      .select("id")
      .single();

    if (receiptErr || !newReceipt) {
      setError("まとめ領収書の作成に失敗しました");
      setIssuing(false);
      return;
    }

    const saleIds = selectedSales.map((s) => s.id);
    const { error: updErr } = await supabase.from("sales").update({ receipt_id: newReceipt.id }).in("id", saleIds);
    if (updErr) {
      setError("販売記録への領収書の紐付けに失敗しました(領収書自体は作成済みです。手動でご確認ください)");
      setIssuing(false);
      return;
    }

    const linkRows = saleIds.map((id) => ({ receipt_id: newReceipt.id, sale_id: id }));
    const { error: linkErr } = await supabase.from("receipt_sales").insert(linkRows);
    if (linkErr) {
      setError("まとめ発行の紐付け記録に失敗しました(領収書・販売記録は更新済みです)");
    }

    // 元の個別領収書のうち、他のどの販売記録からも参照されなくなったものだけを削除する
    for (const oldId of oldReceiptIds) {
      if (oldId === newReceipt.id) continue;
      const { data: stillUsed } = await supabase.from("sales").select("id").eq("receipt_id", oldId).limit(1);
      if (!stillUsed || stillUsed.length === 0) {
        await supabase.from("receipts").delete().eq("id", oldId);
      }
    }

    setIssuing(false);
    const previewSale = { ...selectedSales[0], receipt_id: newReceipt.id };
    setSelectedIds(new Set());
    setRecipientName("");
    setHonorific("様");
    setMemo("衣装代");
    setReceivedDate(todayISO());
    setPaymentType("現金");
    onIssued(previewSale);
  };

  return (
    <div className="space-y-4">
      <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
        複数の注文(個別に登録された販売記録)を選択し、宛名を1つ決めて領収書1枚にまとめて発行します。発行すると、選択した注文の元の個別領収書は無効化(削除)されます。
      </p>

      <select
        value={clubFilter} onChange={(e) => setClubFilter(e.target.value)}
        className="rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
      >
        <option value="">すべてのホストクラブ</option>
        {clubs.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
      </select>

      {filteredSales.length === 0 ? (
        <p className="text-sm text-center py-6" style={{ color: "var(--mz-ink-muted)" }}>対象の注文がありません</p>
      ) : (
        <div className="rounded-lg divide-y max-h-96 overflow-y-auto" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
          {filteredSales.map((s) => {
            const clubName = s.host_clubs ? s.host_clubs.name : "-";
            const hostName = s.hosts ? s.hosts.name : null;
            const checked = selectedIds.has(s.id);
            return (
              <label key={s.id} className="flex items-center gap-3 px-3 py-2.5 cursor-pointer" style={checked ? { background: "var(--mz-surface-hover)" } : {}}>
                <input type="checkbox" checked={checked} onChange={() => toggleSelect(s.id)} className="shrink-0" />
                <div className="min-w-0 flex-1">
                  <p className="text-sm truncate">{clubName}{hostName ? ` / ${hostName}` : ""}</p>
                  <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>{s.transaction_date} ・ {(s.sale_items || []).length}点</p>
                </div>
                <span className="text-sm shrink-0" style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(s.total_amount_jpy)}</span>
              </label>
            );
          })}
        </div>
      )}

      {selectedSales.length > 0 && (
        <div className="rounded-lg p-3 space-y-3" style={{ background: "var(--mz-surface-hover)" }}>
          <div className="grid grid-cols-3 gap-3">
            <div className="col-span-2">
              <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>宛名</label>
              <input
                type="text" value={recipientName} onChange={(e) => setRecipientName(e.target.value)}
                placeholder="例: ○○クラブ"
                className="w-full rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
              />
            </div>
            <div>
              <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>敬称</label>
              <select value={honorific} onChange={(e) => setHonorific(e.target.value)}
                className="w-full rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
                <option value="様">様</option>
                <option value="御中">御中</option>
              </select>
            </div>
          </div>
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>但し書き</label>
            <input
              type="text" value={memo} onChange={(e) => setMemo(e.target.value)}
              placeholder="衣装代"
              className="w-full rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
            />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>受領日</label>
              <input type="date" value={receivedDate} onChange={(e) => setReceivedDate(e.target.value)}
                className="w-full rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
            </div>
            <div>
              <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>受領方法</label>
              <select value={paymentType} onChange={(e) => setPaymentType(e.target.value)}
                className="w-full rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
                <option value="現金">現金</option>
                <option value="振込">振込</option>
              </select>
            </div>
          </div>
          <div className="text-xs space-y-1">
            <div className="flex justify-between"><span style={{ color: "var(--mz-ink-muted)" }}>選択中</span><span>{selectedSales.length}件・{allItems.length}点</span></div>
            <div className="flex justify-between font-medium"><span>合計金額</span><span style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(totals.total)}</span></div>
          </div>
        </div>
      )}

      {error && <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>}

      <button
        type="button" onClick={handleIssue} disabled={issuing || selectedSales.length < 2}
        className="w-full rounded-lg py-2.5 text-sm font-medium disabled:opacity-50"
        style={{ background: "var(--mz-gold)", color: "#1a1710" }}
      >
        {issuing ? "発行中..." : `選択した${selectedSales.length}件をまとめて発行`}
      </button>
    </div>
  );
}

/* ============================================================
   仕入れロットへの一括紐付け(BulkBatchAssignModal) ★2026-08-17実装
   ・「ロット紐付け」タブ(BatchLinkTab)で複数選択した商品を、1つの仕入れロットへまとめて紐付ける(2.35参照)。
   ・仕入れロットは国際送料・手数料が確定してから登録する運用のため、商品(特に販売登録の
     「新規仕入で追加」で作られた受注商品)はロット未定のまま先に登録されている。後からロットだけを
     まとめて反映したい、という要望への対応。
   ・商品代(purchase_amount_cny)と中国国内送料(domestic_shipping_cny)は一切変更しない。
     国際送料・その他手数料(shipping_cny/fee_cny)のみを、
     選択したロットの配分ルール(computeBatchItemAmounts、1.9の「最終品吸収方式」)で自動計算し、
     既存の updateProductCore に通すことで、必要なウォレットFIFO再消化(2.18と同じロジック)も
     まとめて行う。
   ・computeBatchItemAmountsの「最終品吸収方式」はDB上の実際の登録済み件数を数えて最終品かどうかを
     判定するため、複数商品を並列処理すると最終品判定がずれる可能性がある。そのため必ず1件ずつ、
     前の商品の更新が完了してから次の商品を処理する(Promise.allは使わない)。
   ・同じ理由で「ロットの総点数(total_items)」と「実際に紐付く商品の合計点数」が一致していないと、
     最終品での差額吸収が働かず、ロット合計と商品側の合計がズレる。ロットを選んだ時点で
     既存の紐付け件数をDBから数え、点数が合わない場合は警告を表示する。
   ============================================================ */
function BulkBatchAssignModal({ products, batches, onCreateBatch, onClose, onSaved }) {
  // onSavedは呼び出し元(BatchLinkTab)で選択状態のクリア+再読み込みを行うため、
  // その結果このモーダルへ渡されるproducts propは処理完了後に変わりうる(空になる等)。
  // 処理結果(row status)の表示が消えてしまわないよう、開いた時点のリストをローカルに固定して使う。
  const [items] = useState(products);
  const [extraBatches, setExtraBatches] = useState([]); // この画面内で新規作成したロット(親のbatches propに反映されるまでの一時保持)
  const [batchModalOpen, setBatchModalOpen] = useState(false);
  const [batchId, setBatchId] = useState("");
  const [processing, setProcessing] = useState(false);
  const [rowStatus, setRowStatus] = useState({}); // { [productId]: "pending" | "done" | "error" }
  const [errorMessages, setErrorMessages] = useState([]);
  const [done, setDone] = useState(false);
  // ★選択したロットに「今回選ぶ商品以外で」既に紐付いている件数(点数チェック用)
  const [otherLinkedCount, setOtherLinkedCount] = useState(null);
  const [countCheckError, setCountCheckError] = useState(false);

  const allBatches = useMemo(() => {
    const ids = new Set(batches.map((b) => b.id));
    return [...batches, ...extraBatches.filter((b) => !ids.has(b.id))];
  }, [batches, extraBatches]);

  const selectedBatch = allBatches.find((b) => b.id === batchId) || null;

  // ロットを選ぶたびに、そのロットに既に紐付いている商品数を数え直す(今回選択中の商品は除く)
  useEffect(() => {
    if (!batchId) { setOtherLinkedCount(null); setCountCheckError(false); return; }
    let cancelled = false;
    (async () => {
      const { data, error } = await supabase.from("products").select("id").eq("batch_id", batchId);
      if (cancelled) return;
      // ★取得に失敗した場合は「チェックできなかった」ことを明示する。黙って非表示にすると、
      //   点数が合っていないのに何の警告も出ないまま登録できてしまう。
      if (error || !data) { setOtherLinkedCount(null); setCountCheckError(true); return; }
      setCountCheckError(false);
      const selectedIdSet = new Set(items.map((p) => p.id));
      setOtherLinkedCount(data.filter((r) => !selectedIdSet.has(r.id)).length);
    })();
    return () => { cancelled = true; };
  }, [batchId, items]);

  // 紐付け後にこのロットへ紐付く合計点数と、ロットの総点数(total_items)の突き合わせ
  const countCheck = useMemo(() => {
    if (!selectedBatch || otherLinkedCount === null) return null;
    const totalItems = Number(selectedBatch.total_items) || 0;
    const after = otherLinkedCount + items.length;
    return { totalItems, after, matches: totalItems === after };
  }, [selectedBatch, otherLinkedCount, items]);

  // ★別のロットに既に紐付いている商品を選んでいる場合の警告。付け替えると「元のロット」側は
  //   点数が減るため、そのロットの送料・手数料の合計と商品側の合計が合わなくなる(1.9の最終品吸収は
  //   総点数に達したときにだけ働くため、減った側は自動では直らない)。
  const reassignFrom = useMemo(() => {
    const names = items
      .filter((p) => p.batch_id && p.batch_id !== batchId)
      .map((p) => {
        const b = batches.find((x) => x.id === p.batch_id);
        return b ? (b.name ? `${b.name}(${b.purchase_date})` : b.purchase_date) : "別のロット";
      });
    return [...new Set(names)];
  }, [items, batchId, batches]);

  const handleBatchCreated = async (form) => {
    const res = await onCreateBatch(form);
    if (!res.ok) { alert(res.message || "ロットの登録に失敗しました"); return; }
    setExtraBatches((prev) => [...prev, res.batch]);
    setBatchModalOpen(false);
    setBatchId(res.batch.id);
  };

  const handleSubmit = async () => {
    if (!batchId || processing) return;
    const batch = allBatches.find((b) => b.id === batchId);
    if (!batch) return;
    const warns = [];
    if (countCheck && !countCheck.matches) {
      warns.push(`⚠️ 点数が一致していません(このロットに紐付く合計 ${countCheck.after}点 / ロットの総点数 ${countCheck.totalItems}点)。\nこのまま進めると、ロットの送料・手数料の合計と、商品側に配分された合計がズレます。`);
    }
    if (countCheckError) {
      warns.push("⚠️ 点数の確認ができませんでした(通信エラー)。ロットの総点数と実際の紐付け点数が合っているか、登録後にご確認ください。");
    }
    if (reassignFrom.length > 0) {
      warns.push(`⚠️ 別のロット(${reassignFrom.join("、")})に紐付いている商品が含まれています。付け替えると、元のロット側は点数が減り、送料・手数料の合計が合わなくなります。`);
    }
    const warn = warns.length > 0 ? `\n\n${warns.join("\n\n")}` : "";
    if (!window.confirm(`選択中の${items.length}件を、このロットへ紐付けます(国際送料・その他手数料は自動計算され、商品代と中国国内送料は変更しません)。よろしいですか?${warn}`)) return;

    setProcessing(true);
    setErrorMessages([]);
    const messages = [];
    const succeededIds = [];
    const nameOf = (p) => p.product_name || p.product_code || "(名称未設定)";

    // 「最終品吸収方式」がDB上の登録済み件数に依存するため、必ず1件ずつ完了を待ってから次へ進む
    for (let i = 0; i < items.length; i++) {
      const p = items[i];
      setRowStatus((prev) => ({ ...prev, [p.id]: "pending" }));
      const amounts = await computeBatchItemAmounts(batch, p.id);
      const form = { ...p, batch_id: batch.id, shipping_cny: amounts.shipping, fee_cny: amounts.fee };
      // 利益(profit_jpy)の同期はループの後でまとめて行うため、ここでは個別同期を止める
      const res = await updateProductCore(form, p, { syncProfits: false });

      if (!res.ok) {
        // ★updateProductCoreは「ウォレットの旧消化を払い戻してからUPDATE」の順で動くため、
        //   ここで失敗した場合はウォレット残高と商品の状態が食い違っている可能性がある。
        //   そのまま次の商品を処理すると、その不整合な残高を前提にFIFO消化が進んでしまうため、
        //   1件でも失敗したらループを中断する(残りは未処理のまま残し、原因解消後にやり直す)。
        messages.push(`${nameOf(p)}: ${res.message}`);
        setRowStatus((prev) => ({ ...prev, [p.id]: "error" }));
        const remaining = items.length - (i + 1);
        if (remaining > 0) {
          messages.push(`エラーが発生したため、残り${remaining}件は処理していません。ウォレット残高と上記商品の状態を確認してから、改めてやり直してください。`);
        }
        break;
      }

      succeededIds.push(p.id);
      if (res.warning) {
        // 商品自体は更新されたがウォレット再消化でエラー → 「完了」ではなく警告として明示する
        messages.push(`${nameOf(p)}: ${res.warning}`);
        setRowStatus((prev) => ({ ...prev, [p.id]: "warn" }));
      } else {
        setRowStatus((prev) => ({ ...prev, [p.id]: "done" }));
      }
    }

    // ★原価が変わった商品について、販売明細に保存済みの利益(sale_items.profit_jpy)を再計算して同期する。
    //   profit_jpyは登録時点のスナップショットで原価修正に自動追随しない(1.12参照)。ダッシュボードや
    //   ホストクラブ別の利益合計はこの保存値を集計するため、ここで直さないと月次損益(都度再計算)とズレる。
    if (succeededIds.length > 0) {
      const syncRes = await syncSaleItemProfits(succeededIds);
      if (!syncRes.ok) messages.push(`販売明細の利益(profit_jpy)の再計算に失敗しました: ${syncRes.message}`);
    }

    setProcessing(false);
    setDone(true);
    setErrorMessages(messages);
    onSaved();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <div className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
        <h2 className="font-display text-lg">仕入れロットへ一括登録</h2>
        <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          選択中の{items.length}件に、同じ仕入れロットをまとめて割り当てます。商品代と中国国内送料の入力値は変更せず、国際送料・その他手数料のみロットの配分から自動計算されます。
          既にロットが設定されている商品を含めると、そのロットの割り当ては上書きされます。
          金額が変わるため、各商品のウォレット消化は一度取り消して再消化されます(そのときのFIFO順で消化し直すため、
          適用される為替レート、つまり確定JPY原価が多少変わることがあります)。
        </p>

        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>仕入れロット</label>
          <div className="flex gap-2">
            <select value={batchId} onChange={(e) => setBatchId(e.target.value)} disabled={processing}
              className="flex-1 rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
              <option value="">選択してください</option>
              {allBatches.map((b) => <option key={b.id} value={b.id}>{b.name ? `${b.name}(${b.purchase_date})` : b.purchase_date}</option>)}
            </select>
            <button type="button" onClick={() => setBatchModalOpen(true)} disabled={processing}
              className="text-xs px-3 py-2 rounded-lg shrink-0 disabled:opacity-60" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
              + 新規ロット登録
            </button>
          </div>
        </div>

        {/* ★点数チェック: ロットの総点数と、紐付け後に実際にこのロットへ紐付く点数を突き合わせる。
            一致していないと「最終品吸収方式」による差額吸収が働かず、合計がズレる(1.9参照) */}
        {countCheck && (
          <div className="rounded-lg px-3 py-2 text-xs space-y-0.5"
            style={countCheck.matches
              ? { background: "var(--mz-surface-hover)", color: "var(--mz-ink-muted)" }
              : { background: "#3a2a1f", color: "#d6a98f" }}>
            <p>
              ロットの総点数: {countCheck.totalItems}点 / 紐付け後の合計: {countCheck.after}点
              {otherLinkedCount > 0 ? `(既存 ${otherLinkedCount}点 + 今回 ${items.length}点)` : ""}
            </p>
            {/* ★端数の扱いを事前に見せる: 1点あたりは小数点4桁まで保持し、総点数に達する最後の1点で
                「ロット合計 − 既に登録済みの実際の合計」を差額として吸収する(1.9「最終品吸収方式」) */}
            {selectedBatch && (
              <p>
                1点あたり: 送料 {preciseCny(selectedBatch.per_item_shipping_cny)} CNY ・ 手数料 {preciseCny(selectedBatch.per_item_fee_cny)} CNY
                (割り切れない分は最後の1点で差額調整され、合計は必ずロット合計と一致します)
              </p>
            )}
            {countCheck.matches ? (
              <p>点数が一致しています。送料・手数料の合計はロット合計とぴったり一致します。</p>
            ) : (
              <p>⚠️ 点数が一致していません。このまま登録すると、ロットの送料・手数料合計と商品側の合計がズレます(ロットの総点数を修正するか、選択する商品を調整してください)。</p>
            )}
          </div>
        )}

        {countCheckError && (
          <div className="rounded-lg px-3 py-2 text-xs" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
            ⚠️ 点数の確認ができませんでした(通信エラー)。ロットの総点数と実際の紐付け点数が合っているか、登録後にご確認ください。
          </div>
        )}

        {/* ★別ロットからの付け替えは、元のロット側の合計が合わなくなるため明示的に警告する */}
        {reassignFrom.length > 0 && (
          <div className="rounded-lg px-3 py-2 text-xs" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
            ⚠️ 別のロット({reassignFrom.join("、")})に紐付いている商品が含まれています。付け替えると、元のロット側は点数が減り、
            送料・手数料の合計が合わなくなります(元のロットの総点数も併せて修正してください)。
          </div>
        )}

        <div className="rounded-lg divide-y max-h-64 overflow-y-auto" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
          {items.map((p) => (
            <div key={p.id} className="flex items-center gap-3 px-3 py-2">
              <div className="min-w-0 flex-1">
                <p className="text-sm truncate">{p.product_name || "(名称未設定)"}</p>
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                  No.{p.product_code || "-"}{p.batch_id ? " ・ 既にロット紐付け済み" : ""}
                </p>
              </div>
              {rowStatus[p.id] === "pending" && <span className="text-xs shrink-0" style={{ color: "var(--mz-ink-muted)" }}>処理中...</span>}
              {rowStatus[p.id] === "done" && <span className="text-xs shrink-0" style={{ color: "#8fd19e" }}>✓ 完了</span>}
              {rowStatus[p.id] === "warn" && <span className="text-xs shrink-0" style={{ color: "#d6a98f" }}>⚠ 要確認</span>}
              {rowStatus[p.id] === "error" && <span className="text-xs shrink-0" style={{ color: "#f2b8bd" }}>✗ 失敗</span>}
              {!rowStatus[p.id] && done && <span className="text-xs shrink-0" style={{ color: "var(--mz-ink-muted)" }}>- 未処理</span>}
            </div>
          ))}
        </div>

        {errorMessages.length > 0 && (
          <div className="rounded-lg px-3 py-2 text-xs space-y-1" style={{ background: "#3a1f22", color: "#f2b8bd" }}>
            <p className="font-medium">一部の商品でエラー・警告が発生しました:</p>
            {errorMessages.map((m, i) => <p key={i}>・{m}</p>)}
          </div>
        )}

        {done && errorMessages.length === 0 && (
          <p className="text-xs rounded-lg px-3 py-2" style={{ background: "var(--mz-surface-hover)", color: "var(--mz-ink-muted)" }}>
            全件の登録が完了しました。
          </p>
        )}

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} disabled={processing}
            className="flex-1 rounded-lg py-2.5 text-sm disabled:opacity-60" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
            {done ? "閉じる" : "キャンセル"}
          </button>
          {!done && (
            <button type="button" onClick={handleSubmit} disabled={!batchId || processing}
              className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60" style={{ background: "var(--mz-gold)", color: "#1a1710" }}>
              {processing ? "登録中..." : `${items.length}件を登録`}
            </button>
          )}
        </div>
      </div>

      {batchModalOpen && (
        <BatchFormModal onClose={() => setBatchModalOpen(false)} onSave={handleBatchCreated} />
      )}
    </div>
  );
}

/* ============================================================
   ロット紐付け(BatchLinkTab) ★2026-08-17実装
   ・仕入れロットは国際送料・手数料が確定してから登録する運用のため、商品を登録する時点では
     ロットがまだ存在しない。特に販売登録の「新規仕入で追加」で作られた受注商品は、保存と同時に
     status が「販売済み」になり(2.4参照)、「仕入れ商品」タブ(status=未販売のみ)にも
     サンプル・在庫一覧(created_via_sale=falseのみ)にも出てこなくなる。
   ・そのため従来は「販売一覧 → 該当の販売を編集 → 明細の『仕入編集』 → ロットを選ぶ」という
     手順を、商品1点ごと・販売1件ごとに繰り返す必要があった。
   ・このタブは、その紐付け作業だけを目的に、状態(未販売/販売済み/返品済み)を問わず
     ロット未紐付けの商品を横断表示し、チェックで複数選択して一括で紐付けられるようにする(2.35参照)。
   ============================================================ */
function BatchLinkTab({ batches, onCreateBatch }) {
  const [products, setProducts] = useState(null); // null=読込中
  const [linkFilter, setLinkFilter] = useState("unlinked"); // "unlinked" | "all"
  const [kindFilter, setKindFilter] = useState("all"); // "all" | "order" | "sample" | "stock"
  const [searchText, setSearchText] = useState("");
  const [selectedIds, setSelectedIds] = useState([]);
  const [bulkAssignOpen, setBulkAssignOpen] = useState(false);
  const [loadError, setLoadError] = useState(null);
  // ★紐付けが全点数分そろっていないロット(= ウォレット未消化分が残っているロット)
  const [pendingBatches, setPendingBatches] = useState([]);

  const loadAll = useCallback(async () => {
    setProducts(null);
    setLoadError(null);
    let query = supabase
      .from("products")
      .select("id,type,status,sample_purpose,created_via_sale,return_source_product_id,product_url,product_code,product_image_url,product_name,category,size,size_options,selling_price_jpy,purchase_date,created_at,batch_id,purchase_amount_cny,shipping_cny,fee_cny,domestic_shipping_cny,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy,cost_source,estimated_purchase_cny")
      // ★返品在庫(return_source_product_idあり)は常に除外する。返品登録はコスト0円・ウォレット消化なしで
      //   作られる行(1.10参照)で、batch_idが永久にnullのままのため、除外しないとこの一覧に residual として
      //   出続け、誤って選択するとウォレットから送料を二重に消化してしまう。
      .is("return_source_product_id", null)
      .order("created_at", { ascending: false });
    if (linkFilter === "unlinked") query = query.is("batch_id", null);
    const { data: productsData, error } = await query;
    if (error) { setLoadError("商品の読み込みに失敗しました"); setProducts([]); return; }

    // どの販売に紐づいているかを併記する(PendingPurchasesTabと同じく、埋め込みではなく2段階取得。2.30参照)
    const ids = (productsData || []).map((p) => p.id);
    const linkMap = {};
    if (ids.length > 0) {
      const { data: linkRows, error: linkErr } = await supabase
        .from("sale_items")
        .select("product_id,sale_id")
        .in("product_id", ids);
      if (!linkErr && linkRows && linkRows.length > 0) {
        const saleIds = [...new Set(linkRows.map((r) => r.sale_id))];
        const { data: salesData } = await supabase
          .from("sales")
          .select("id,transaction_date,host_clubs(name),hosts(name)")
          .in("id", saleIds);
        const saleById = {};
        (salesData || []).forEach((s) => { saleById[s.id] = s; });
        linkRows.forEach((r) => { linkMap[r.product_id] = saleById[r.sale_id] || null; });
      }
    }
    setProducts((productsData || []).map((p) => ({ ...p, linkedSale: linkMap[p.id] || null })));
  }, [linkFilter]);

  // ★2026-08-17実装: 「まだ全点数の紐付けが終わっていないロット」を検出して先頭に案内する。
  //   ロットに金額を入れただけではウォレットは消化されないため(消化は商品へ振り分けた時点)、
  //   紐付け漏れがあると、実際には支払済みの送料・手数料がウォレット残高に残り続ける(2.35参照)。
  const loadPendingBatches = useCallback(async () => {
    const { data, error } = await supabase.from("products").select("batch_id").not("batch_id", "is", null);
    if (error || !data) { setPendingBatches([]); return; }
    const countById = {};
    data.forEach((r) => { countById[r.batch_id] = (countById[r.batch_id] || 0) + 1; });
    setPendingBatches(
      batches
        .map((b) => ({ batch: b, linked: countById[b.id] || 0, total: Number(b.total_items) || 0 }))
        .filter((x) => x.linked < x.total)
    );
  }, [batches]);

  useEffect(() => { loadAll(); }, [loadAll]);
  useEffect(() => { loadPendingBatches(); }, [loadPendingBatches]);

  // 商品の区分ラベル(受注 / サンプル(目的) / 在庫)。返品在庫はクエリ側で除外済み
  const kindOf = (p) => {
    if (p.created_via_sale) return "受注";
    if (p.type === "sample") return `サンプル(${p.sample_purpose || "展示用"})`;
    return "在庫";
  };

  const filtered = useMemo(() => {
    if (!products) return [];
    const q = searchText.trim().toLowerCase();
    return products.filter((p) => {
      if (kindFilter === "order" && !p.created_via_sale) return false;
      if (kindFilter === "sample" && (p.created_via_sale || p.type !== "sample")) return false;
      if (kindFilter === "stock" && (p.created_via_sale || p.type !== "stock")) return false;
      if (q) {
        const hay = `${p.product_name || ""} ${p.product_code || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [products, kindFilter, searchText]);

  // フィルタや再読み込みで一覧から消えた商品の選択は自動的に外す
  useEffect(() => {
    setSelectedIds((prev) => prev.filter((id) => filtered.some((p) => p.id === id)));
  }, [filtered]);

  const toggleSelect = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };
  const allSelected = filtered.length > 0 && selectedIds.length === filtered.length;
  const toggleSelectAll = () => {
    setSelectedIds(allSelected ? [] : filtered.map((p) => p.id));
  };

  const selectClass = "rounded-lg px-3 py-2 text-sm bg-transparent";
  const selectStyle = { border: "1px solid var(--mz-border)", color: "var(--mz-ink)" };

  return (
    <div className="space-y-4">
      <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
        仕入れロットが確定した後で、そのロットに含まれる商品をまとめて紐付けるための画面です。販売登録済み(販売済み)の受注商品も、
        サンプル・在庫も、状態を問わずここに表示されます。チェックを入れて「仕入れロットへ一括登録」を押すと、選択した全商品に同じロットが割り当てられ、
        国際送料・その他手数料が自動計算されます(商品代と中国国内送料は変更されません)。返品在庫はコスト0円で扱うため、この一覧には表示されません。
      </p>

      {loadError && (
        <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{loadError}</p>
      )}

      {/* ★未消化(紐付け未完了)のロットがあれば先頭で案内する。ロット登録だけではウォレットは減らないため */}
      {pendingBatches.length > 0 && (
        <div className="rounded-xl p-4 text-xs space-y-1.5" style={{ background: "#3a2a1f", color: "#d6a98f", border: "1px solid #7a5a3a" }}>
          <p className="font-medium">紐付けが済んでいない仕入れロットがあります</p>
          {pendingBatches.map(({ batch, linked, total }) => (
            <p key={batch.id}>
              ・{batch.name ? `${batch.name}(${batch.purchase_date})` : batch.purchase_date}: {linked} / {total} 点(残り{total - linked}点)
            </p>
          ))}
          <p className="pt-0.5">
            ロットに金額を入れただけではウォレットは消化されません(消化されるのは商品へ振り分けて保存した時点です)。
            残りを紐付けるまで、その分の送料・手数料はウォレット残高に残ったままになります。
          </p>
        </div>
      )}

      <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
        <div className="flex flex-wrap gap-2">
          <select value={linkFilter} onChange={(e) => setLinkFilter(e.target.value)} className={selectClass} style={selectStyle}>
            <option value="unlinked">ロット未紐付けのみ</option>
            <option value="all">すべて(紐付け済みも表示)</option>
          </select>
          <select value={kindFilter} onChange={(e) => setKindFilter(e.target.value)} className={selectClass} style={selectStyle}>
            <option value="all">区分: すべて</option>
            <option value="order">受注(新規仕入対応)</option>
            <option value="sample">サンプル</option>
            <option value="stock">在庫</option>
          </select>
        </div>
        <input
          type="text" value={searchText} onChange={(e) => setSearchText(e.target.value)}
          placeholder="商品名・商品番号で絞り込み"
          className="w-full rounded-lg px-3 py-2 text-sm bg-transparent" style={selectStyle}
        />
      </div>

      {products === null ? (
        <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
      ) : filtered.length === 0 ? (
        <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>該当する商品はありません</p>
      ) : (
        <>
          <div className="flex items-center gap-3 flex-wrap">
            <button type="button" onClick={toggleSelectAll} className="text-xs px-2.5 py-1.5 rounded-lg"
              style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
              {allSelected ? "選択解除" : `表示中の${filtered.length}件をすべて選択`}
            </button>
            <span className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
              {selectedIds.length > 0 ? `${selectedIds.length}件選択中` : "商品を選択してください"}
            </span>
            <button type="button" onClick={() => setBulkAssignOpen(true)} disabled={selectedIds.length === 0}
              className="text-xs px-3 py-1.5 rounded-lg ml-auto disabled:opacity-40"
              style={{ background: "var(--mz-gold)", color: "#1a1710" }}>
              仕入れロットへ一括登録
            </button>
          </div>

          <div className="rounded-lg divide-y" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
            {filtered.map((p) => (
              <label key={p.id} className="flex items-center gap-3 px-3 py-3 cursor-pointer">
                <input
                  type="checkbox"
                  checked={selectedIds.includes(p.id)}
                  onChange={() => toggleSelect(p.id)}
                  className="shrink-0 w-4 h-4"
                />
                {p.product_image_url ? (
                  <img src={p.product_image_url} alt="" className="w-12 h-12 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
                ) : (
                  <div className="w-12 h-12 rounded-md flex items-center justify-center shrink-0" style={{ background: "var(--mz-surface-hover)" }}>
                    <Icon name="tag" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
                  </div>
                )}
                <div className="min-w-0 flex-1">
                  <p className="text-sm truncate">{p.product_name || "(名称未設定)"}</p>
                  <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                    {[kindOf(p), p.status, p.size, p.product_code ? `No.${p.product_code}` : ""].filter(Boolean).join(" / ")}
                  </p>
                  {p.linkedSale ? (
                    <p className="text-xs mt-0.5" style={{ color: "var(--mz-ink-muted)" }}>
                      販売: {p.linkedSale.transaction_date} ・ {p.linkedSale.host_clubs ? p.linkedSale.host_clubs.name : "-"}
                      {p.linkedSale.hosts ? ` / ${p.linkedSale.hosts.name}` : ""}
                    </p>
                  ) : null}
                  {p.batch_id && (
                    <p className="text-xs mt-0.5" style={{ color: "#d6a98f" }}>
                      ロット紐付け済み{(() => {
                        const b = batches.find((x) => x.id === p.batch_id);
                        return b ? `: ${b.name ? `${b.name}(${b.purchase_date})` : b.purchase_date}` : "";
                      })()}
                    </p>
                  )}
                </div>
              </label>
            ))}
          </div>
        </>
      )}

      {bulkAssignOpen && (
        <BulkBatchAssignModal
          products={filtered.filter((p) => selectedIds.includes(p.id))}
          batches={batches}
          onCreateBatch={onCreateBatch}
          onClose={() => setBulkAssignOpen(false)}
          onSaved={() => { setSelectedIds([]); loadAll(); loadPendingBatches(); }}
        />
      )}
    </div>
  );
}

/* ============================================================
   仕入れ商品(PendingPurchasesTab) ★2026-08-04実装
   ・「新規仕入で追加」(created_via_sale=true)で登録された商品は、サンプル・在庫の一覧や
     「在庫から追加」検索候補からは常に除外される(2.30参照)。この専用タブが唯一の
     受け皿となり、金額(仕入れロットの選択・返金確定後のCNY修正等)を編集できる。
   ・その商品が既にどの販売に紐づいているか(sale_items経由)を併せて表示し、
     万が一「販売登録を保存し忘れて迷子になった商品」もここで確認・拾い直せるようにする。
   ============================================================ */
function PendingPurchasesTab({ batches, clubs, onCreateBatch, onSaveSale }) {
  const [products, setProducts] = useState(null); // null=読込中
  const [modalProduct, setModalProduct] = useState(null);
  // ★2026-08-04実装: 「この商品で販売登録する」用。紐付いていない商品を選ぶと、
  //   その商品があらかじめ明細に入った状態でSaleFormModal(新規販売登録)を開く(2.30参照)
  const [linkingProduct, setLinkingProduct] = useState(null);
  // ★2026-08-04実装: 「受注(新規仕入対応)」の商品で、既に販売済みになったもの(=このタブの
  //   通常一覧には出てこない)も、商品番号で検索すれば状態を問わず編集できるようにする(2.30参照)
  const [codeSearchText, setCodeSearchText] = useState("");
  const [codeSearchResult, setCodeSearchResult] = useState(null);
  const [codeSearching, setCodeSearching] = useState(false);

  const handleCodeSearch = async () => {
    const code = codeSearchText.trim();
    if (!code) { setCodeSearchResult(null); return; }
    setCodeSearching(true);
    const { data, error } = await supabase
      .from("products")
      .select("id,type,status,sample_purpose,product_url,product_code,product_image_url,product_name,category,size,size_options,selling_price_jpy,purchase_date,created_at,batch_id,purchase_amount_cny,shipping_cny,fee_cny,domestic_shipping_cny,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy,cost_source,estimated_purchase_cny")
      .ilike("product_code", `%${code}%`);
    setCodeSearching(false);
    setCodeSearchResult(error ? [] : (data || []));
  };

  const loadAll = useCallback(async () => {
    const { data: productsData, error } = await supabase
      .from("products")
      .select("id,type,status,sample_purpose,product_url,product_code,product_image_url,product_name,category,size,size_options,selling_price_jpy,purchase_date,created_at,batch_id,purchase_amount_cny,shipping_cny,fee_cny,domestic_shipping_cny,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy,cost_source,estimated_purchase_cny")
      .eq("created_via_sale", true)
      .eq("status", "未販売")
      .order("created_at", { ascending: false });
    if (error) { setProducts([]); return; }

    const ids = (productsData || []).map((p) => p.id);
    let linkMap = {};
    if (ids.length > 0) {
      // ★2026-08-04実装(バグ修正): sale_itemsから直接sales(...)を埋め込むクエリが失敗しても
      //   エラーを握りつぶしていたため、実際は紐付いているのに「未紐付け」と誤表示していた。
      //   product_id→sale_id→sales情報の2段階取得に分け、確実に紐付け状況を反映する。
      const { data: linkRows, error: linkErr } = await supabase
        .from("sale_items")
        .select("product_id,sale_id")
        .in("product_id", ids);
      if (!linkErr && linkRows && linkRows.length > 0) {
        const saleIds = [...new Set(linkRows.map((r) => r.sale_id))];
        const { data: salesData } = await supabase
          .from("sales")
          .select("id,transaction_date,host_clubs(name),hosts(name)")
          .in("id", saleIds);
        const saleById = {};
        (salesData || []).forEach((s) => { saleById[s.id] = s; });
        linkRows.forEach((r) => { linkMap[r.product_id] = saleById[r.sale_id] || null; });
      }
    }
    setProducts((productsData || []).map((p) => ({ ...p, linkedSale: linkMap[p.id] || null })));
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  const handleSaveProduct = async (form) => {
    const res = await updateProductCore(form, modalProduct);
    if (!res.ok) { alert(res.message); return; }
    if (res.warning) alert(res.warning);
    setModalProduct(null);
    loadAll();
    if (codeSearchResult !== null) handleCodeSearch();
  };

  // ★2026-08-04実装: 販売登録(SaleFormModal)の保存後、この商品もあわせて一覧を再読み込みする
  const handleSaveLinkingSale = async (form) => {
    const ok = await onSaveSale(form);
    if (ok) { setLinkingProduct(null); loadAll(); }
    return ok;
  };

  if (products === null) return <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>;

  return (
    <div className="space-y-4">
      <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
        販売登録の「新規仕入で追加」で登録した商品(未販売分)の一覧です。仕入れロットの選択や、返金確定後の正しいCNY金額への修正はここから行えます。
        サンプル・在庫の一覧や他の販売登録の「在庫から追加」候補には出てきません。
      </p>

      {/* ★2026-08-04実装: 既に販売済みになった「受注(新規仕入対応)」商品は、下の一覧には出てこないため、
          商品番号検索から状態を問わず見つけて編集できるようにする(2.30参照) */}
      <div className="rounded-xl p-4 space-y-2" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
        <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          商品番号で検索(既に販売済みになったものも含めて編集できます)
        </p>
        <div className="flex gap-2">
          <input
            type="text" value={codeSearchText}
            onChange={(e) => setCodeSearchText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") handleCodeSearch(); }}
            placeholder="例: P-0006"
            className="flex-1 rounded-lg px-3 py-2 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
          <button onClick={handleCodeSearch} disabled={codeSearching} className="rounded-lg px-4 py-2 text-sm shrink-0" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
            {codeSearching ? "検索中..." : "検索"}
          </button>
        </div>
        {codeSearchResult !== null && (
          codeSearchResult.length === 0 ? (
            <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>該当する商品が見つかりませんでした</p>
          ) : (
            <div className="rounded-lg divide-y mt-1" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
              {codeSearchResult.map((p) => (
                <div key={p.id} className="flex items-center gap-3 px-3 py-2.5">
                  <div className="min-w-0 flex-1">
                    <p className="text-sm truncate">{p.product_name || "(名称未設定)"} {p.size ? `- ${p.size}` : ""}</p>
                    <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                      No.{p.product_code} ・ {p.status}
                    </p>
                  </div>
                  <button
                    onClick={() => setModalProduct(p)}
                    className="text-xs px-2.5 py-1.5 rounded-lg shrink-0"
                    style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
                  >
                    編集
                  </button>
                </div>
              ))}
            </div>
          )
        )}
      </div>

      {products.length === 0 ? (
        <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>該当する商品はありません</p>
      ) : (
        <div className="rounded-lg divide-y" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
          {products.map((p) => (
            <div key={p.id} className="flex items-center gap-3 px-3 py-3">
              {p.product_image_url ? (
                <img src={p.product_image_url} alt="" className="w-12 h-12 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
              ) : (
                <div className="w-12 h-12 rounded-md flex items-center justify-center shrink-0" style={{ background: "var(--mz-surface-hover)" }}>
                  <Icon name="tag" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
                </div>
              )}
              <div className="min-w-0 flex-1">
                <p className="text-sm truncate">{p.product_name || "(名称未設定)"}</p>
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                  {[p.category, p.size, p.product_code ? `No.${p.product_code}` : ""].filter(Boolean).join(" / ")}
                </p>
                {p.linkedSale ? (
                  <p className="text-xs mt-0.5" style={{ color: "var(--mz-ink-muted)" }}>
                    紐付け先: {p.linkedSale.transaction_date} ・ {p.linkedSale.host_clubs ? p.linkedSale.host_clubs.name : "-"}
                    {p.linkedSale.hosts ? ` / ${p.linkedSale.hosts.name}` : ""}
                  </p>
                ) : (
                  <p className="text-xs mt-0.5" style={{ color: "#f2b8bd" }}>⚠️ どの販売にも紐付いていません(保存し忘れの可能性)</p>
                )}
              </div>
              <div className="flex flex-col gap-1.5 shrink-0 items-end">
                <button
                  onClick={() => setModalProduct(p)}
                  className="text-xs px-2.5 py-1.5 rounded-lg"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
                >
                  編集
                </button>
                {!p.linkedSale && (
                  <button
                    onClick={() => setLinkingProduct(p)}
                    className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                    style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                  >
                    この商品で販売登録する
                  </button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {modalProduct && (
        <ProductFormModal product={modalProduct} batches={batches} onClose={() => setModalProduct(null)} onSave={handleSaveProduct} onCreateBatch={onCreateBatch} />
      )}

      {linkingProduct && (
        <SaleFormModal clubs={clubs} batches={batches} sale={null} initialProduct={linkingProduct} onClose={() => setLinkingProduct(null)} onSave={handleSaveLinkingSale} />
      )}
    </div>
  );
}

function SalesPage() {
  const [sales, setSales] = useState(null); // null = 読み込み中
  const [clubs, setClubs] = useState([]);
  const [batches, setBatches] = useState([]);
  const [error, setError] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [editingSale, setEditingSale] = useState(null); // null=新規登録モード, obj=編集対象
  const [receiptSale, setReceiptSale] = useState(null); // 領収書プレビュー対象のsale(nullなら非表示)
  // ★2026-07-19実装: 保存直後に表示する「発注が必要な商品」一覧(2.28参照)。nullなら非表示
  const [orderReminder, setOrderReminder] = useState(null);
  // ★2026-07-19実装: 「販売一覧」と「領収書発行(まとめ発行)」のタブ切り替え(2.29参照)
  const [activeTab, setActiveTab] = useState("list");

  const loadAll = useCallback(async () => {
    setError(null);
    const [salesRes, clubsRes, batchesRes] = await Promise.all([
      supabase
        .from("sales")
        .select("id,transaction_date,host_club_id,host_id,receipt_id,total_amount_jpy,host_clubs(name),hosts(name),receipts!fk_sales_receipt_id(receipt_number,recipient_name,honorific,memo),sale_items(id,product_id,unit_price_jpy,subtotal_jpy,profit_jpy,is_new_purchase,order_confirmed,reorder_candidate,reorder_decided,products(product_name,size,product_code,type,sample_purpose,category,product_image_url,product_url,size_options,purchase_amount_cny,shipping_cny,fee_cny,domestic_shipping_cny,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy))")
        .order("transaction_date", { ascending: false }),
      supabase.from("host_clubs").select("id,name").order("name"),
      supabase.from("purchase_batches").select("id,purchase_date,name,total_items,total_shipping_cny,total_fee_cny,per_item_shipping_cny,per_item_fee_cny").order("purchase_date", { ascending: false }),
    ]);
    // sales取得が失敗しても、同時に取得できたクラブ・ロットは反映する(販売登録モーダルを使えなくしないため)
    setClubs(clubsRes.data || []);
    setBatches(batchesRes.data || []);
    if (salesRes.error) { setError("販売記録の取得に失敗しました"); setSales([]); return; }
    setSales(salesRes.data || []);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  /* 販売登録本体(新規): sales → sale_items → products状態更新 → receipts(採番込み) → sales.receipt_id を順に処理。
     編集: sales更新 → sale_itemsを一度全削除して作り直し → 商品ステータスは差分のみ反映 → receiptsは番号を変えずに金額等のみ更新。
     Supabase(PostgREST)からはクライアント側で複数テーブルにまたがるトランザクションを
     張れないため、途中失敗時はアラートで状況を伝え、手動確認を促す形にしている。 */
  const handleSaveSale = async (form) => {
    const totalInclJpy = form.items.reduce((sum, it) => sum + it.unit_price_jpy, 0); // 単価は税込のため、単純合計が税込合計になる
    const totals = calcReceiptTotals(totalInclJpy);

    if (form.id) {
      const saleId = form.id;

      const { data: oldItems, error: oldItemsErr } = await supabase.from("sale_items").select("product_id").eq("sale_id", saleId);
      if (oldItemsErr) { alert("既存の販売明細の取得に失敗しました"); return false; }
      const oldProductIds = new Set((oldItems || []).map((i) => i.product_id));
      const newProductIds = new Set(form.items.map((it) => it.product_id));

      const { error: saleErr } = await supabase
        .from("sales")
        .update({
          transaction_date: form.transaction_date,
          host_club_id: form.host_club_id,
          host_id: form.host_id,
          total_amount_jpy: totals.total,
        })
        .eq("id", saleId);
      if (saleErr) { alert("販売記録の更新に失敗しました"); return false; }

      const { error: delItemsErr } = await supabase.from("sale_items").delete().eq("sale_id", saleId);
      if (delItemsErr) { alert("既存明細の削除に失敗しました"); return false; }

      const itemRows = form.items.map((it) => ({
        sale_id: saleId,
        product_id: it.product_id,
        fulfillment_type: "サンプル現物販売",
        quantity: 1,
        unit_price_jpy: it.unit_price_jpy,
        subtotal_jpy: it.unit_price_jpy,
        profit_jpy: itemPretaxJpy(it.unit_price_jpy) - it.cost_jpy,
        is_new_purchase: !!it.is_new_purchase,
        order_confirmed: !!it.order_confirmed,
        reorder_candidate: !!it.reorder_candidate,
        reorder_decided: !!it.reorder_decided,
      }));
      // ★2026-07-19実装: 挿入結果(実際のsale_items.id)を取得し、「新規仕入で追加」した明細のみを
      //   発注リマインドパネルの対象にする。sale_item.idがあることで、後から「発注確認済み」に
      //   更新できる(2.28/2.29参照)
      const { data: insertedItems, error: itemsErr } = await supabase
        .from("sale_items")
        .insert(itemRows)
        .select("id,is_new_purchase,order_confirmed,products(product_name,category,size,product_code,product_image_url,product_url)");
      if (itemsErr) {
        alert("販売明細の再登録に失敗しました(sales行は更新済みです。手動でご確認ください)");
        return false;
      }
      const newlyOrderedProducts = (insertedItems || [])
        .filter((row) => row.is_new_purchase && !row.order_confirmed)
        .map((row) => ({ id: row.id, ...row.products }));

      // 商品ステータスは差分のみ反映(明細から外れた商品→未販売に復元、新たに加わった商品→販売済みに)
      const toRestore = [...oldProductIds].filter((id) => !newProductIds.has(id));
      const toMarkSold = [...newProductIds].filter((id) => !oldProductIds.has(id));
      if (toRestore.length > 0) await supabase.from("products").update({ status: "未販売" }).in("id", toRestore);
      if (toMarkSold.length > 0) await supabase.from("products").update({ status: "販売済み" }).in("id", toMarkSold);

      // 領収書は番号を変えず、金額等のみ更新(発行者情報も最新の固定値に揃える)
      const { error: receiptUpdErr } = await supabase
        .from("receipts")
        .update({
          issue_date: form.transaction_date,
          recipient_name: form.recipient_name,
          honorific: form.honorific || "様",
          memo: form.memo || "衣装代",
          received_date: form.received_date || form.transaction_date,
          payment_type: form.payment_type || "現金",
          subtotal_jpy: totals.subtotal,
          tax_jpy: totals.tax,
          total_jpy: totals.total,
          issuer_info: ISSUER_INFO_DEFAULT,
        })
        .eq("sale_id", saleId);
      if (receiptUpdErr) {
        alert("領収書の更新に失敗しました(販売記録・明細は更新済みです)");
      }

      setModalOpen(false);
      setEditingSale(null);
      if (newlyOrderedProducts.length > 0) setOrderReminder(newlyOrderedProducts);
      loadAll();
      return true;
    }

    const { data: saleRow, error: saleErr } = await supabase
      .from("sales")
      .insert({
        transaction_date: form.transaction_date,
        host_club_id: form.host_club_id,
        host_id: form.host_id,
        total_amount_jpy: totals.total,
      })
      .select("id")
      .single();
    if (saleErr || !saleRow) { alert("販売記録の登録に失敗しました"); return false; }
    const saleId = saleRow.id;

    const itemRows = form.items.map((it) => ({
      sale_id: saleId,
      product_id: it.product_id,
      fulfillment_type: "サンプル現物販売",
      quantity: 1,
      unit_price_jpy: it.unit_price_jpy,
      subtotal_jpy: it.unit_price_jpy,
      profit_jpy: itemPretaxJpy(it.unit_price_jpy) - it.cost_jpy,
      is_new_purchase: !!it.is_new_purchase,
      reorder_candidate: !!it.reorder_candidate,
      reorder_decided: !!it.reorder_decided,
    }));
    const { data: insertedItems, error: itemsErr } = await supabase
      .from("sale_items")
      .insert(itemRows)
      .select("id,is_new_purchase,products(product_name,category,size,product_code,product_image_url,product_url)");
    if (itemsErr) {
      alert("販売明細の登録に失敗しました(sales行は作成済みです。手動でご確認・削除をお願いします)");
      return false;
    }
    const newlyOrderedProducts = (insertedItems || [])
      .filter((row) => row.is_new_purchase)
      .map((row) => ({ id: row.id, ...row.products }));

    const productIds = form.items.map((it) => it.product_id);
    const { error: statusErr } = await supabase.from("products").update({ status: "販売済み" }).in("id", productIds);
    if (statusErr) {
      alert("商品ステータスの更新に一部失敗した可能性があります。商品一覧をご確認ください。");
    }

    const receiptNumber = await generateReceiptNumber(form.transaction_date);
    const { data: receiptRow, error: receiptErr } = await supabase
      .from("receipts")
      .insert({
        receipt_number: receiptNumber,
        sale_id: saleId,
        issue_date: form.transaction_date,
        recipient_name: form.recipient_name,
        honorific: form.honorific || "様",
        memo: form.memo || "衣装代",
        received_date: form.received_date || form.transaction_date,
        payment_type: form.payment_type || "現金",
        subtotal_jpy: totals.subtotal,
        tax_jpy: totals.tax,
        total_jpy: totals.total,
        issuer_info: ISSUER_INFO_DEFAULT,
      })
      .select("id")
      .single();
    if (receiptErr || !receiptRow) {
      alert("領収書の作成に失敗しました(販売記録・明細は登録済みです)");
      setModalOpen(false);
      if (newlyOrderedProducts.length > 0) setOrderReminder(newlyOrderedProducts);
      loadAll();
      return true;
    }

    await supabase.from("sales").update({ receipt_id: receiptRow.id }).eq("id", saleId);

    setModalOpen(false);
    if (newlyOrderedProducts.length > 0) setOrderReminder(newlyOrderedProducts);
    loadAll();
    return true;
  };

  /* 削除: sale_items・receiptsはsales削除時にDB側のON DELETE CASCADEで自動削除される想定
     (SQL側で設定)。削除前に対象商品IDを取得しておき、削除後に「未販売」へ戻す。 */
  const handleDeleteSale = async (sale) => {
    if (!window.confirm("この販売記録を削除しますか?対象の商品は「未販売」に戻り、領収書も削除されます。")) return;
    const { data: saleItems, error: itemsErr } = await supabase.from("sale_items").select("product_id").eq("sale_id", sale.id);
    if (itemsErr) { alert("販売明細の取得に失敗しました"); return; }
    const { error: delErr } = await supabase.from("sales").delete().eq("id", sale.id);
    if (delErr) { alert("削除に失敗しました"); return; }
    const productIds = (saleItems || []).map((i) => i.product_id);
    if (productIds.length > 0) {
      await supabase.from("products").update({ status: "未販売" }).in("id", productIds);
    }
    loadAll();
  };

  const openEdit = (sale) => {
    setEditingSale(sale);
    setModalOpen(true);
  };

  const closeModal = () => {
    setModalOpen(false);
    setEditingSale(null);
  };

  // ★2026-07-19実装: 「発注未確認」バッジ・未発注リストから、その場で発注確認済みに更新する(2.29参照)
  const handleConfirmOrder = async (itemIds) => {
    if (itemIds.length === 0) return;
    if (!window.confirm(`${itemIds.length}点を発注確認済みにしますか?`)) return;
    const { error } = await supabase.from("sale_items").update({ order_confirmed: true }).in("id", itemIds);
    if (error) { alert("更新に失敗しました"); return; }
    loadAll();
  };

  // ★2026-08-04実装: 「再仕入れ検討」タブから、判断済み(再仕入れする/しない、どちらも)にする(2.31参照)
  const handleDecideReorder = async (itemId) => {
    const { error } = await supabase.from("sale_items").update({ reorder_decided: true }).eq("id", itemId);
    if (error) { alert("更新に失敗しました"); return; }
    loadAll();
  };

  // ★2026-08-04実装: 「仕入れ商品」タブ内のProductFormModalから「+ 新規ロット登録」した場合のロット作成(2.30参照)
  const handleCreateBatchInlineSales = async (form) => {
    const { data, error } = await supabase.from("purchase_batches").insert(form).select().single();
    if (error || !data) return { ok: false, message: "ロットの登録に失敗しました" };
    loadAll();
    return { ok: true, batch: data };
  };

  return (
    <div className="px-4 md:px-6 py-6 md:py-8 max-w-5xl mx-auto w-full space-y-5">
      <div className="flex items-center justify-between gap-3">
        <h2 className="font-display text-lg">販売登録</h2>
        {activeTab === "list" && (
          <button onClick={() => setModalOpen(true)} className="rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap" style={{ background: "var(--mz-gold)", color: "#1a1710" }}>
            + 新規販売登録
          </button>
        )}
      </div>

      {/* ★2026-07-19実装: 販売一覧 / 領収書発行(まとめ発行) / 未発注リストのタブ */}
      {/* ★2026-08-17: タブが6つになりスマホ幅に収まらなくなったため、横スクロール可能にした */}
      <div className="overflow-x-auto -mx-1 px-1">
      <div className="flex gap-1.5 p-1 rounded-lg" style={{ background: "var(--mz-surface-hover)", width: "fit-content" }}>
        <button
          type="button" onClick={() => setActiveTab("list")}
          className="text-xs px-3 py-1.5 rounded-md whitespace-nowrap"
          style={activeTab === "list" ? { background: "var(--mz-gold)", color: "#1a1710" } : { color: "var(--mz-ink-muted)" }}
        >
          販売一覧
        </button>
        <button
          type="button" onClick={() => setActiveTab("merge")}
          className="text-xs px-3 py-1.5 rounded-md whitespace-nowrap"
          style={activeTab === "merge" ? { background: "var(--mz-gold)", color: "#1a1710" } : { color: "var(--mz-ink-muted)" }}
        >
          領収書発行
        </button>
        <button
          type="button" onClick={() => setActiveTab("unordered")}
          className="text-xs px-3 py-1.5 rounded-md whitespace-nowrap"
          style={activeTab === "unordered" ? { background: "var(--mz-gold)", color: "#1a1710" } : { color: "var(--mz-ink-muted)" }}
        >
          未発注リスト
        </button>
        <button
          type="button" onClick={() => setActiveTab("pending")}
          className="text-xs px-3 py-1.5 rounded-md whitespace-nowrap"
          style={activeTab === "pending" ? { background: "var(--mz-gold)", color: "#1a1710" } : { color: "var(--mz-ink-muted)" }}
        >
          仕入れ商品
        </button>
        <button
          type="button" onClick={() => setActiveTab("reorder")}
          className="text-xs px-3 py-1.5 rounded-md whitespace-nowrap"
          style={activeTab === "reorder" ? { background: "var(--mz-gold)", color: "#1a1710" } : { color: "var(--mz-ink-muted)" }}
        >
          再仕入れ検討
        </button>
        {/* ★2026-08-17実装: 送料確定後に登録した仕入れロットを、既存商品へまとめて紐付けるタブ(2.35参照) */}
        <button
          type="button" onClick={() => setActiveTab("batchlink")}
          className="text-xs px-3 py-1.5 rounded-md whitespace-nowrap"
          style={activeTab === "batchlink" ? { background: "var(--mz-gold)", color: "#1a1710" } : { color: "var(--mz-ink-muted)" }}
        >
          ロット紐付け
        </button>
      </div>
      </div>

      {error && <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>}
      {sales === null && !error && <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>}

      {activeTab === "list" && sales !== null && (
        sales.length === 0 ? (
          <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>販売記録がありません</p>
        ) : (
          <div className="space-y-2">
            {sales.map((s) => <SaleCard key={s.id} sale={s} onDelete={handleDeleteSale} onEdit={openEdit} onViewReceipt={setReceiptSale} onConfirmOrder={handleConfirmOrder} />)}
          </div>
        )
      )}

      {activeTab === "merge" && sales !== null && (
        <MergeReceiptTab sales={sales} clubs={clubs} onIssued={(sale) => { loadAll(); setReceiptSale(sale); }} />
      )}

      {activeTab === "unordered" && sales !== null && (
        <UnorderedListTab sales={sales} onConfirmOrder={handleConfirmOrder} />
      )}

      {activeTab === "pending" && (
        <PendingPurchasesTab batches={batches} clubs={clubs} onCreateBatch={handleCreateBatchInlineSales} onSaveSale={handleSaveSale} />
      )}

      {activeTab === "batchlink" && (
        <BatchLinkTab batches={batches} onCreateBatch={handleCreateBatchInlineSales} />
      )}

      {activeTab === "reorder" && sales !== null && (
        <ReorderReviewTab sales={sales} onDecide={handleDecideReorder} />
      )}

      {modalOpen && (
        <SaleFormModal clubs={clubs} batches={batches} sale={editingSale} onClose={closeModal} onSave={handleSaveSale} />
      )}

      {receiptSale && (
        <ReceiptPreviewModal sale={receiptSale} onClose={() => setReceiptSale(null)} />
      )}

      {orderReminder && (
        <OrderReminderModal
          products={orderReminder}
          onClose={() => setOrderReminder(null)}
          onConfirmed={() => { setOrderReminder(null); loadAll(); }}
        />
      )}
    </div>
  );
}

/* ============================================================
   カタログ(catalogs / catalog_items)

   ホスト向けに商品を選んで共有する「カタログ」機能。
   ・カタログ本体(catalogs)+ 選択商品(catalog_items, catalogs⇔productsの中間テーブル)
   ・掲載商品はステータス・種別を問わず個別に検索して選択する
   ・共有は share_token を含む公開URL(#/catalog/:token)経由を想定
     (ログイン不要の公開閲覧ページ自体は次の実装ステップで対応)

   積み残し:
     ・公開閲覧ページ(#/catalog/:token, 認証ゲートの外側で描画)
   ============================================================ */

/* ---- 共有トークン生成(公開URL用のランダム文字列) ---- */
function generateShareToken() {
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
}

/* ---- カタログ カード(一覧表示) ---- */
function CatalogCard({ catalog, itemCount, onEdit, onDuplicate, onDelete, onShare }) {
  return (
    <div
      className="rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"
      style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
    >
      <div className="flex-1 min-w-0">
        <p className="font-display text-base truncate">{catalog.name}</p>
        <div className="flex items-center gap-3 mt-1 flex-wrap text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          <span>掲載商品: {itemCount}点</span>
          <span>作成日: {(catalog.created_at || "").slice(0, 10)}</span>
        </div>
      </div>
      <div className="flex items-center gap-2 shrink-0 flex-wrap">
        <button
          onClick={() => onShare(catalog)}
          className="text-xs px-2.5 py-1.5 rounded-lg font-medium"
          style={{ background: "var(--mz-gold)", color: "#1a1710" }}
        >
          共有リンク
        </button>
        <button
          onClick={() => onEdit(catalog)}
          className="text-xs px-2.5 py-1.5 rounded-lg"
          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
        >
          編集
        </button>
        <button
          onClick={() => onDuplicate(catalog)}
          className="text-xs px-2.5 py-1.5 rounded-lg"
          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
        >
          複製
        </button>
        <button
          onClick={() => onDelete(catalog.id)}
          className="text-xs px-2.5 py-1.5 rounded-lg"
          style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}
        >
          削除
        </button>
      </div>
    </div>
  );
}

/* ---- カタログ 登録・編集モーダル(商品はステータス・種別を問わず検索して個別選択) ---- */
function CatalogFormModal({ catalog, initialItems, onClose, onSave }) {
  const isNew = !catalog.id;
  const [name, setName] = useState(catalog.name || "");
  const [saving, setSaving] = useState(false);

  const [allProducts, setAllProducts] = useState(null); // null = 読み込み中
  const [productSearch, setProductSearch] = useState("");
  const [selectedProducts, setSelectedProducts] = useState(initialItems || []); // [{id,product_name,size,product_code,selling_price_jpy,product_image_url}]

  useEffect(() => {
    let cancelled = false;
    /* ★2026-08-22変更: 掲載候補から「もう提供できない商品」を除外する(2.44参照)。
       ・status = "販売済み" のみを除外する。**「返品済み」は除外しない**
         (返品された商品は現物が手元に在庫として残っており、そのまま売れるため。2026-08-22訂正)。
       ・created_via_sale = true … 販売登録の「新規仕入で追加」で作られた受注商品。
         特定のホストの受注のために仕入れた1点物であり、そもそもカタログに載せる対象ではない
         (サンプル・在庫一覧や在庫検索では2026-08-04に除外済みだったが、ここだけ漏れていた。2.30参照)。
       既にカタログへ追加済みの商品は、この一覧ではなく openEdit がidで取得するため、
       あとから売れてもカタログから勝手に消えることはない(代わりに選択済み一覧側にバッジで警告する)。 */
    supabase
      .from("products")
      .select("id,type,status,sample_purpose,product_name,category,size,product_code,selling_price_jpy,size_options,product_image_url,created_at")
      .neq("status", "販売済み")
      .eq("created_via_sale", false)
      .order("created_at", { ascending: false })
      .then(({ data, error }) => {
        if (cancelled) return;
        setAllProducts(error ? [] : (data || []));
      });
    return () => { cancelled = true; };
  }, []);

  const selectedIds = useMemo(() => new Set(selectedProducts.map((p) => p.id)), [selectedProducts]);

  // ★2026-07-12実装(2026-07-12 上限撤廃): 検索未入力時も登録日の新しい順に画像グリッドで一覧表示する(候補を出さない旧仕様を廃止。2.24参照)。
  //   件数上限は設けず、該当する商品を常に全件表示する。
  const candidates = useMemo(() => {
    if (!allProducts) return [];
    const q = productSearch.trim().toLowerCase();
    return allProducts.filter((p) => {
      if (selectedIds.has(p.id)) return false;
      if (!q) return true;
      return (p.product_name || "").toLowerCase().includes(q) || (p.product_code || "").toLowerCase().includes(q);
    });
  }, [allProducts, selectedIds, productSearch]);

  const addProduct = (p) => { setSelectedProducts((prev) => [...prev, p]); setProductSearch(""); };
  const removeProduct = (id) => setSelectedProducts((prev) => prev.filter((p) => p.id !== id));

  /* ★2026-08-22実装: 候補の一括追加/一括解除(2.44参照)。
     ・追加するのは**いま候補として表示されている分だけ**(検索で絞り込んでいればその結果のみ)。
       「全商品」と称して画面に出ていないものまで入れると、何を入れたのか分からなくなるため。
     ・候補は既に選択済みのものを除いた配列なので、そのまま末尾に足せば重複しない。
     ・一括解除は並び順の作業がまとめて消えるため、確認を挟む(1件ずつの×は確認なしのまま)。 */
  const addAllCandidates = () => {
    if (candidates.length === 0) return;
    setSelectedProducts((prev) => [...prev, ...candidates]);
    setProductSearch("");
  };
  const removeAllProducts = () => {
    if (selectedProducts.length === 0) return;
    if (!window.confirm(`掲載商品${selectedProducts.length}点をすべて外しますか?\n並び順もリセットされます。`)) return;
    setSelectedProducts([]);
  };
  const moveProduct = (index, dir) => {
    setSelectedProducts((prev) => {
      const next = [...prev];
      const j = index + dir;
      if (j < 0 || j >= next.length) return prev;
      [next[index], next[j]] = [next[j], next[index]];
      return next;
    });
  };
  // ★2026-07-19実装: 掲載商品をCATEGORY_OPTIONS(トップス→ボトムス→…)の順に並べ替える。
  //   同カテゴリ内は元の並び順(手動並べ替え・追加順)を維持する安定ソート。
  //   カテゴリ未設定・7分類に一致しない商品は末尾にまとめる。
  const sortSelectedByCategory = () => {
    setSelectedProducts((prev) => {
      const rank = (p) => {
        const idx = CATEGORY_OPTIONS.indexOf(p.category);
        return idx === -1 ? CATEGORY_OPTIONS.length : idx;
      };
      return prev
        .map((p, i) => ({ p, i }))
        .sort((a, b) => rank(a.p) - rank(b.p) || a.i - b.i)
        .map(({ p }) => p);
    });
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    if (selectedProducts.length === 0) { alert("商品を1点以上選択してください"); return; }
    setSaving(true);
    await onSave({ id: catalog.id || null, name: name.trim(), productIds: selectedProducts.map((p) => p.id) });
    setSaving(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <form
        onSubmit={handleSubmit}
        className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <h2 className="font-display text-lg">{isNew ? "新規カタログ" : "カタログを編集"}</h2>

        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>カタログ名(社内管理用)</label>
          <input
            type="text" value={name} onChange={(e) => setName(e.target.value)} required autoFocus
            placeholder="例: ○○クラブ向け 7月カタログ"
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
        </div>

        <div>
          <div className="flex items-center justify-between mb-1.5">
            <label className="block text-xs" style={{ color: "var(--mz-ink-muted)" }}>
              掲載商品{selectedProducts.length > 0 ? `(${selectedProducts.length}点)` : ""}
            </label>
            <div className="flex items-center gap-2 shrink-0">
              {selectedProducts.length > 1 && (
                <button
                  type="button" onClick={sortSelectedByCategory}
                  className="text-[11px] px-2 py-1 rounded-md"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
                >
                  カテゴリ順に並べ替え
                </button>
              )}
              {selectedProducts.length > 0 && (
                <button
                  type="button" onClick={removeAllProducts}
                  className="text-[11px] px-2 py-1 rounded-md"
                  style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}
                >
                  すべて外す
                </button>
              )}
            </div>
          </div>

          {selectedProducts.length > 0 && (
            <div className="space-y-1 mb-2">
              {selectedProducts.map((p, idx) => (
                <div
                  key={p.id}
                  className="flex items-center gap-2 text-xs px-2.5 py-1.5 rounded-lg"
                  style={{ background: "var(--mz-surface-hover)", color: "var(--mz-ink)" }}
                >
                  {p.product_image_url ? (
                    <img src={p.product_image_url} alt="" className="w-8 h-8 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
                  ) : (
                    <div className="w-8 h-8 rounded-md shrink-0 flex items-center justify-center text-[8px] text-center" style={{ background: "var(--mz-bg)", color: "var(--mz-ink-muted)" }}>No Image</div>
                  )}
                  <span className="flex-1 min-w-0 truncate">{productLabel(p)}</span>
                  {p.type === "sample" && p.sample_purpose === "処分用" && (
                    <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0" style={{ background: "#3a2a1f", color: "#d6a98f" }}>処分用</span>
                  )}
                  {/* ★2026-08-22: 掲載後に売れた商品への気づき(2.44参照)。候補からは除外しているが、
                      既に掲載済みの商品は勝手に外さないため、ここで明示して人に判断してもらう。
                      「返品済み」は現物が手元にあり販売可能なので、警告色にはしない。 */}
                  {p.status === "販売済み" && (
                    <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0" style={{ background: "#3a1f22", color: "#f2b8bd" }}>販売済み</span>
                  )}
                  {p.status === "返品済み" && (
                    <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0" style={{ background: "#3a2a1f", color: "#d6a98f" }}>返品済み</span>
                  )}
                  <button type="button" onClick={() => moveProduct(idx, -1)} disabled={idx === 0} className="disabled:opacity-30" style={{ color: "var(--mz-ink-muted)" }}>↑</button>
                  <button type="button" onClick={() => moveProduct(idx, 1)} disabled={idx === selectedProducts.length - 1} className="disabled:opacity-30" style={{ color: "var(--mz-ink-muted)" }}>↓</button>
                  <button
                    type="button" onClick={() => removeProduct(p.id)}
                    className="w-4 h-4 flex items-center justify-center rounded-full shrink-0"
                    style={{ color: "var(--mz-ink-muted)" }}
                  >
                    ×
                  </button>
                </div>
              ))}
            </div>
          )}

          <input
            type="text" value={productSearch} onChange={(e) => setProductSearch(e.target.value)}
            placeholder="商品名・商品番号で絞り込み(未入力時は登録日の新しい順に一覧表示・販売済みと受注商品は除く)"
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />

          {candidates.length > 0 && (
            <button
              type="button" onClick={addAllCandidates}
              className="w-full mt-2 rounded-lg py-2 text-xs font-medium"
              style={{ border: "1px solid var(--mz-gold)", color: "var(--mz-gold-soft)" }}
            >
              {productSearch.trim()
                ? `絞り込み中の${candidates.length}点をすべて追加`
                : `候補の${candidates.length}点をすべて追加`}
            </button>
          )}

          {allProducts === null ? (
            <p className="text-xs mt-1.5" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
          ) : candidates.length === 0 ? (
            <p className="text-xs mt-1.5" style={{ color: "var(--mz-ink-muted)" }}>該当する商品がありません</p>
          ) : (
            <div
              className="mt-1.5 grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-64 overflow-y-auto p-1.5 rounded-lg"
              style={{ border: "1px solid var(--mz-border)" }}
            >
              {candidates.map((p) => (
                <button
                  key={p.id} type="button" onClick={() => addProduct(p)}
                  className="flex flex-col items-center gap-1 rounded-lg p-1.5 hover:bg-white/5 text-left"
                  style={{ border: "1px solid var(--mz-border)" }}
                >
                  <div className="relative w-full">
                    {p.product_image_url ? (
                      <img src={p.product_image_url} alt="" className="w-full aspect-square rounded-md object-cover" />
                    ) : (
                      <div className="w-full aspect-square rounded-md flex items-center justify-center text-[9px] text-center" style={{ background: "var(--mz-surface-hover)", color: "var(--mz-ink-muted)" }}>No Image</div>
                    )}
                    {p.type === "sample" && p.sample_purpose === "処分用" && (
                      <span
                        className="absolute top-1 left-1 text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
                        style={{ background: "#3a2a1f", color: "#d6a98f", border: "1px solid rgba(0,0,0,0.3)" }}
                      >
                        処分用
                      </span>
                    )}
                  </div>
                  <span className="text-[10px] w-full truncate text-center">{productLabel(p)}</span>
                  {p.selling_price_jpy != null && (
                    <span className="text-[9px]" style={{ color: "var(--mz-ink-muted)" }}>{fmtJPY(p.selling_price_jpy)}</span>
                  )}
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="flex-1 rounded-lg py-2.5 text-sm" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
            キャンセル
          </button>
          <button type="submit" disabled={saving} className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60" style={{ background: "var(--mz-gold)", color: "#1a1710" }}>
            {saving ? "保存中..." : "保存"}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ---- 共有リンク・QRコード表示モーダル ---- */
function ShareCatalogModal({ catalog, onClose }) {
  const shareUrl = `${window.location.origin}${window.location.pathname}#/catalog/${catalog.share_token}`;
  const [copied, setCopied] = useState(false);

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      window.prompt("以下のURLをコピーしてください:", shareUrl);
    }
  };

  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(shareUrl)}`;

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <div
        className="w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5 space-y-4 text-center"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <h2 className="font-display text-lg">共有リンク</h2>
        <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          ログイン不要でホストが直接開けるページです。LINEなどでURLを送るか、QRコードを見せてください。
        </p>

        <div className="flex justify-center">
          <img src={qrSrc} alt="QRコード" className="rounded-lg" style={{ border: "1px solid var(--mz-border)", background: "#fff", padding: "8px" }} />
        </div>

        <div
          className="text-xs px-3 py-2.5 rounded-lg break-all text-left"
          style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
        >
          {shareUrl}
        </div>

        <button
          onClick={handleCopy}
          className="w-full rounded-lg py-2.5 text-sm font-medium"
          style={{ background: "var(--mz-gold)", color: "#1a1710" }}
        >
          {copied ? "コピーしました" : "リンクをコピー"}
        </button>
        <button onClick={onClose} className="w-full rounded-lg py-2.5 text-sm" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
          閉じる
        </button>
      </div>
    </div>
  );
}

/* ---- カタログ一覧ページ本体 ---- */
function CatalogsPage() {
  const [catalogs, setCatalogs] = useState(null); // null = 読み込み中
  const [error, setError] = useState(null);
  const [modalCatalog, setModalCatalog] = useState(null); // null=閉じる, {}=新規, obj=編集
  const [modalInitialItems, setModalInitialItems] = useState([]);
  const [shareTarget, setShareTarget] = useState(null);

  const loadAll = useCallback(async () => {
    setError(null);
    const { data, error } = await supabase
      .from("catalogs")
      .select("id,name,share_token,created_at,catalog_items(count)")
      .order("created_at", { ascending: false });
    if (error) { setError("カタログの取得に失敗しました"); setCatalogs([]); return; }
    setCatalogs(data || []);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  const openNew = () => { setModalInitialItems([]); setModalCatalog({}); };

  const openEdit = async (catalog) => {
    const { data, error } = await supabase
      .from("catalog_items")
      .select("sort_order,products(id,type,status,sample_purpose,product_name,category,size,product_code,selling_price_jpy,size_options,product_image_url)")
      .eq("catalog_id", catalog.id)
      .order("sort_order");
    if (error) { alert("掲載商品の取得に失敗しました"); return; }
    setModalInitialItems((data || []).map((row) => row.products).filter(Boolean));
    setModalCatalog(catalog);
  };

  const handleSave = async (form) => {
    if (form.id) {
      const { error: updErr } = await supabase.from("catalogs").update({ name: form.name }).eq("id", form.id);
      if (updErr) { alert("更新に失敗しました"); return; }
      const { error: delErr } = await supabase.from("catalog_items").delete().eq("catalog_id", form.id);
      if (delErr) { alert("掲載商品の更新に失敗しました(カタログ名は更新済みです)"); return; }
      const rows = form.productIds.map((productId, idx) => ({ catalog_id: form.id, product_id: productId, sort_order: idx }));
      const { error: insErr } = await supabase.from("catalog_items").insert(rows);
      if (insErr) { alert("掲載商品の登録に失敗しました"); return; }
    } else {
      const { data: inserted, error: insErr } = await supabase
        .from("catalogs")
        .insert({ name: form.name, share_token: generateShareToken() })
        .select("id")
        .single();
      if (insErr) { alert("登録に失敗しました"); return; }
      const rows = form.productIds.map((productId, idx) => ({ catalog_id: inserted.id, product_id: productId, sort_order: idx }));
      const { error: itemsErr } = await supabase.from("catalog_items").insert(rows);
      if (itemsErr) { alert("掲載商品の登録に失敗しました(カタログ本体は作成済みです)"); return; }
    }
    setModalCatalog(null);
    loadAll();
  };

  /* ★2026-08-22実装: カタログの複製(2.44参照)。
     同じ商品構成のカタログを店舗ごとに配りたいケース向け。
     ・**共有トークンは必ず新規に発行する**(share_tokenを複製すると、複製元と同じURLになり、
       片方を削除したときにもう片方まで見られなくなる/どの店舗に渡したURLか区別できなくなる)。
     ・掲載商品はsort_orderごとそのままコピーする(並べ替えの手間を繰り返さないため)。
     ・カタログ本体だけ作られて商品のコピーに失敗した場合は、中途半端な複製を残さず削除して元に戻す。 */
  const handleDuplicate = async (catalog) => {
    const suggested = `${catalog.name} のコピー`;
    const newName = window.prompt("複製後のカタログ名を入力してください(社内管理用。ホストには表示されません)", suggested);
    if (newName === null) return;                       // キャンセル
    const name = newName.trim();
    if (!name) { alert("カタログ名を入力してください"); return; }

    const { data: srcItems, error: srcErr } = await supabase
      .from("catalog_items")
      .select("product_id,sort_order")
      .eq("catalog_id", catalog.id)
      .order("sort_order");
    if (srcErr) { alert("複製元の掲載商品を取得できませんでした"); return; }

    const { data: inserted, error: insErr } = await supabase
      .from("catalogs")
      .insert({ name, share_token: generateShareToken() })
      .select("id")
      .single();
    if (insErr || !inserted) { alert("カタログの複製に失敗しました"); return; }

    const rows = (srcItems || []).map((r, idx) => ({
      catalog_id: inserted.id,
      product_id: r.product_id,
      sort_order: r.sort_order != null ? r.sort_order : idx,
    }));
    if (rows.length > 0) {
      const { error: itemsErr } = await supabase.from("catalog_items").insert(rows);
      if (itemsErr) {
        // 商品のコピーに失敗したら、空のカタログを残さず取り消す
        await supabase.from("catalogs").delete().eq("id", inserted.id);
        alert("掲載商品の複製に失敗したため、複製を取り消しました。もう一度お試しください。");
        return;
