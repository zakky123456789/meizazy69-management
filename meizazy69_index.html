/* ============================================================
   BuckyDrop突き合わせ(BuckyDropReconcileCard) ★2026-08-18実装
   ・BuckyDropは注文したあとで「実際は安かった」という差額返金(Purchase ordered auto refund)や
     交換・サービス返金を数日遅れで返してくる。そのためシステムに入れた金額が実費とズレていき、
     ウォレット残高が合わなくなる(2026-08-18に8.00 CNYのズレとして実際に発生。5章35番参照)。
   ・返金を1件ずつ追いかけるのは非現実的なので、「注文ごとの確定純額」で突き合わせる方式にした。
     BuckyDropの明細エクスポート(Transaction Statement)から、返金・交換・凍結解除まで含めた
     純額を注文単位で再計算できることを実データで検証済み(費用統計画面の数字と完全一致)。
   ・対応関係:
       調達(注文支払い − 注文返金)      ⇔ 商品代 + 中国国内送料 の合計(商品ごと)
       物流(荷物支払い − 荷物返金)      ⇔ ロットの国際送料合計
       サービス(サービス購入 − サービス返金) ⇔ ロットのその他手数料合計
   ・交換費用の凍結/解除は必ず相殺されるため合計には影響しないが、内訳としては表示する。
   ・**この画面はDBを一切書き換えない**(差額を表示するだけ)。どの商品を直すかは人が判断する。
   ============================================================ */

// 取引タイプ → 支出の符号(支払い/購入=+1、返金/解除=-1)と、集計区分
const BD_TX_SIGN = {
  "注文支払い": 1, "注文返金": -1,
  "荷物支払い": 1, "荷物返金": -1, "荷物追加支払い": 1,
  "サービス購入": 1, "サービス返金": -1,
  "交換費用凍結": 1, "交換費用解除": -1,
  "返品・交換追加支払い": 1, "売り手手数料決済": 1,
};
const BD_TX_CATEGORY = {
  "注文支払い": "procure", "注文返金": "procure",
  "荷物支払い": "logistics", "荷物返金": "logistics", "荷物追加支払い": "logistics",
  "サービス購入": "service", "サービス返金": "service",
  "交換費用凍結": "exchange", "交換費用解除": "exchange",
  "返品・交換追加支払い": "other", "売り手手数料決済": "other",
};

/* 明細1行の金額文字列("CN ¥ 57.25" 等)を数値にする */
function parseBdAmount(v) {
  if (v == null) return 0;
  if (typeof v === "number") return v;
  const cleaned = String(v).replace(/[^\d.]/g, "");
  return cleaned ? parseFloat(cleaned) : 0;
}

/* 業務伝票番号("S3113317892001,P3113317892005-OH2086..." 等)から代購注文番号を取り出す */
function extractBdOrderNo(v) {
  const first = String(v == null ? "" : v).split(/[,\-]/)[0].trim();
  return first;
}

/* 明細シートの配列(オブジェクト)から、注文ごとの確定純額を集計する */
function aggregateBdStatement(rows) {
  const byOrder = {};
  let matched = 0;
  rows.forEach((r) => {
    const type = String(r["取引タイプ"] || "").trim();
    const sign = BD_TX_SIGN[type];
    const cat = BD_TX_CATEGORY[type];
    if (!sign || !cat) return; // 未知の取引タイプは無視(将来BuckyDrop側が増やしても壊れないように)
    const order = extractBdOrderNo(r["業務伝票番号"]);
    if (!order) return;
    matched += 1;
    const b = byOrder[order] || (byOrder[order] = { order, procure: 0, logistics: 0, service: 0, exchange: 0, other: 0 });
    b[cat] += sign * parseBdAmount(r["金額"]);
  });
  Object.values(byOrder).forEach((b) => {
    b.procure = preciseCny(b.procure);
    b.logistics = preciseCny(b.logistics);
    b.service = preciseCny(b.service);
    b.exchange = preciseCny(b.exchange);
    b.other = preciseCny(b.other);
    b.total = preciseCny(b.procure + b.logistics + b.service + b.exchange + b.other);
  });
  return { orders: Object.values(byOrder).sort((a, b) => b.total - a.total), matched };
}

/* ★2026-08-18実装: BuckyDropの注文管理画面「購入注文」の部分をコピー&ペーストしてもらい、
   商品ごとの金額を読み取る(2.37参照)。
   ・明細エクスポートには部分返金がどの商品のものか記録されないため、金額のズレを商品単位まで
     特定できない。一方この画面には商品ごとの確定金額が出ているので、貼り付けてもらえば照合できる。
   ・画面にエクスポート機能が無いため、貼り付けという手段を採っている。
   ・書式に依存しすぎないよう、「購入注文番号(P+数字)」「ステータス」「CN ¥ 金額」の3つだけを
     出現順に拾う。行の並びやタブ/空白の入り方が変わっても壊れにくい。
   ・配送注文の番号(PG…)は数字が続かないため P\d+ にはマッチしない。履行注文(S…)・店舗注文(M…)も同様。 */
function parseBdPurchaseOrders(text) {
  if (!text || !text.trim()) return [];
  const re = /(P\d{8,})|(返品済み)|(入庫成功)|CN\s*[¥￥]\s*([\d,]+(?:\.\d+)?)/g;
  const out = [];
  let currentNo = null;
  let currentStatus = null;
  let m;
  while ((m = re.exec(text)) !== null) {
    if (m[1]) { currentNo = m[1]; currentStatus = null; continue; }
    if (m[2]) { currentStatus = "返品済み"; continue; }
    if (m[3]) { currentStatus = "入庫成功"; continue; }
    if (m[4]) {
      // 購入注文番号が出てくる前の金額(注文コストの合計など)は対象外
      if (!currentNo) continue;
      out.push({ orderNo: currentNo, status: currentStatus, price: preciseCny(parseFloat(m[4].replace(/,/g, ""))) });
    }
  }
  return out;
}

/* 2つの金額リストを多重集合として比較し、片方にしか無いものを返す */
function diffPriceMultisets(listA, listB) {
  const countB = {};
  listB.forEach((v) => { const k = String(preciseCny(v)); countB[k] = (countB[k] || 0) + 1; });
  const onlyA = [];
  listA.forEach((v) => {
    const k = String(preciseCny(v));
    if (countB[k] > 0) countB[k] -= 1; else onlyA.push(preciseCny(v));
  });
  const onlyB = [];
  Object.keys(countB).forEach((k) => { for (let i = 0; i < countB[k]; i++) onlyB.push(Number(k)); });
  return { onlyA, onlyB };
}

/* 貼り付けたBuckyDropの購入注文と、システムの商品代を1点ずつ突き合わせる */
function BdItemPasteCompare({ systemItems }) {
  const [text, setText] = useState("");
  const [excludeReturned, setExcludeReturned] = useState(true);

  const parsed = useMemo(() => parseBdPurchaseOrders(text), [text]);
  const bdItems = useMemo(
    () => (excludeReturned ? parsed.filter((x) => x.status !== "返品済み") : parsed),
    [parsed, excludeReturned]
  );

  const sysPrices = systemItems.map((p) => preciseCny(Number(p.purchase_amount_cny) || 0));
  const bdPrices = bdItems.map((x) => x.price);
  const bdSum = preciseCny(bdPrices.reduce((a, b) => a + b, 0));
  const sysSum = preciseCny(sysPrices.reduce((a, b) => a + b, 0));
  const { onlyA: onlyBd, onlyB: onlySys } = diffPriceMultisets(bdPrices, sysPrices);

  // システム側の「BuckyDropに無い金額」がどの商品か引けるようにする
  const productsByPrice = {};
  systemItems.forEach((p) => {
    const k = String(preciseCny(Number(p.purchase_amount_cny) || 0));
    (productsByPrice[k] = productsByPrice[k] || []).push(p);
  });

  const oneToOne = onlyBd.length === 1 && onlySys.length === 1;

  return (
    <div className="space-y-2 mt-2">
      <p style={{ color: "var(--mz-ink-muted)" }}>
        BuckyDropの注文管理画面で「購入注文」の部分を範囲選択してコピーし、ここに貼り付けてください。
        商品ごとの金額を読み取って、システムの商品代と1点ずつ突き合わせます。
      </p>
      <textarea
        value={text} onChange={(e) => setText(e.target.value)} rows={4}
        placeholder="ここに貼り付け(P3113317892001 … CN ¥ 163 のような内容)"
        className="w-full rounded-lg px-2 py-1.5 text-xs bg-transparent"
        style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
      />

      {parsed.length > 0 && (
        <>
          <label className="flex items-center gap-2 cursor-pointer" style={{ color: "var(--mz-ink-muted)" }}>
            <input type="checkbox" checked={excludeReturned} onChange={() => setExcludeReturned((v) => !v)} />
            <span>「返品済み」の商品を除外する(交換前の商品はシステムに残らないため、通常はオン)</span>
          </label>

          <div className="flex flex-wrap gap-x-4 gap-y-1" style={{ color: "var(--mz-ink-muted)" }}>
            <span>読み取り: {parsed.length}点(除外後 {bdItems.length}点)</span>
            <span>BuckyDrop合計: {fmtCnyCompact(bdSum)}</span>
            <span>システム合計: {fmtCnyCompact(sysSum)}({systemItems.length}点)</span>
            <span style={{ color: Math.abs(bdSum - sysSum) > 0.0001 ? "#d6a98f" : "#8fd19e" }}>
              差額: {fmtCnyCompact(preciseCny(sysSum - bdSum))}
            </span>
          </div>

          {bdItems.length !== systemItems.length && (
            <p style={{ color: "#d6a98f" }}>
              ⚠️ 点数が違います(BuckyDrop {bdItems.length}点 / システム {systemItems.length}点)。
              貼り付け範囲が足りていないか、交換前の商品の扱いがずれている可能性があります。
            </p>
          )}

          {onlyBd.length === 0 && onlySys.length === 0 ? (
            <p style={{ color: "#8fd19e" }}>✓ 金額の内訳が完全に一致しています</p>
          ) : (
            <div className="rounded-lg px-2.5 py-2 space-y-1" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
              {onlyBd.length > 0 && (
                <p>BuckyDrop側にあって、システムに無い金額: <strong>{onlyBd.map((v) => fmtCnyCompact(v)).join(" / ")}</strong></p>
              )}
              {onlySys.length > 0 && (
                <div>
                  <p>システム側にあって、BuckyDropに無い金額:</p>
                  {onlySys.map((v, i) => {
                    const cands = productsByPrice[String(v)] || [];
                    return (
                      <p key={i} className="pl-3">
                        ・{fmtCnyCompact(v)} — {cands.map((p) => `${p.product_name || "(名称未設定)"}(No.${p.product_code || "-"})`).join(" / ") || "該当商品不明"}
                      </p>
                    );
                  })}
                </div>
              )}
              {oneToOne && (
                <p className="pt-1" style={{ color: "var(--mz-gold-soft)" }}>
                  → <strong>
                    {(productsByPrice[String(onlySys[0])] || []).map((p) => `${p.product_name || "(名称未設定)"}(No.${p.product_code || "-"})`).join(" / ")}
                    の商品代を {fmtCnyCompact(onlySys[0])} → {fmtCnyCompact(onlyBd[0])} に直してください
                  </strong>
                </p>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function BuckyDropReconcileCard({ batches }) {
  const [open, setOpen] = useState(false);
  const [parsing, setParsing] = useState(false);
  const [error, setError] = useState(null);
  const [fileName, setFileName] = useState("");
  const [result, setResult] = useState(null); // { orders, matched }
  const [systemTotals, setSystemTotals] = useState({}); // { [batchId]: {procure, logistics, service} }
  const inputRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    if (typeof XLSX === "undefined") { setError("表計算ライブラリの読み込みに失敗しました。通信環境を確認して、ページを再読み込みしてください。"); return; }
    setParsing(true); setError(null); setResult(null); setFileName(file.name);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      if (rows.length === 0) throw new Error("シートに行がありません");
      if (!("取引タイプ" in rows[0]) || !("業務伝票番号" in rows[0]) || !("金額" in rows[0])) {
        throw new Error("「取引タイプ」「業務伝票番号」「金額」の列が見つかりません。BuckyDropの Transaction Statement のファイルか確認してください");
      }
      const agg = aggregateBdStatement(rows);
      if (agg.orders.length === 0) throw new Error("集計できる取引が1件もありませんでした");

      // システム側の金額を、突き合わせ対象のロットぶんだけ取得する
      const orderNos = new Set(agg.orders.map((o) => o.order));
      const targets = batches.filter((b) => b.bd_order_no && orderNos.has(String(b.bd_order_no).trim()));
      const totals = {};
      for (const b of targets) {
        const { data, error: qErr } = await supabase
          .from("products")
          .select("id,product_code,product_name,size,status,purchase_amount_cny,domestic_shipping_cny,shipping_cny,fee_cny")
          .eq("batch_id", b.id)
          .order("product_code", { ascending: true });
        if (qErr) throw new Error("システム側の商品金額の取得に失敗しました");
        const procure = (data || []).reduce((sum, x) =>
          sum + (Number(x.purchase_amount_cny) || 0) + (Number(x.domestic_shipping_cny) || 0), 0);
        totals[b.id] = {
          procure: preciseCny(procure),
          logistics: preciseCny(Number(b.total_shipping_cny) || 0),
          service: preciseCny(Number(b.total_fee_cny) || 0),
          count: (data || []).length,
          // ★2026-08-18: 差額が出たときに「どの商品か」を探す範囲を示すため、商品ごとの内訳も保持する。
          //   BuckyDropの部分返金は明細上どの商品か記録されないため、機械的な特定は不可能。
          //   BuckyDropの注文一覧(商品ごとの金額が出る画面)と見比べてもらうための一覧(2.37参照)。
          items: data || [],
        };
      }
      setSystemTotals(totals);
      setResult(agg);
    } catch (e) {
      setError(e.message || "ファイルの読み込みに失敗しました");
    }
    setParsing(false);
  };

  const rowsForOrder = (o) => {
    const batch = batches.find((b) => b.bd_order_no && String(b.bd_order_no).trim() === o.order);
    const sys = batch ? systemTotals[batch.id] : null;
    return { batch, sys };
  };

  return (
    <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
      <button type="button" onClick={() => setOpen((v) => !v)} className="text-sm w-full text-left" style={{ color: "var(--mz-gold-soft)" }}>
        {open ? "▲ " : "▼ "}BuckyDropと突き合わせる
      </button>

      {open && (
        <div className="space-y-3">
          <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
            BuckyDropの「明細」→ Transaction Statement をエクスポートして、ここに読み込ませてください。
            返金・交換まで含めた<strong>確定後の純額</strong>を注文ごとに計算し、システムの金額と並べて差額を表示します。
            ロットの編集画面で「BuckyDropの注文番号」を入れておくと自動で対応づきます。
            <br />
            この画面はデータを書き換えません。差額が出た場合は、どの商品を直すかご自身で判断してください。
          </p>

          <div
            onClick={() => inputRef.current && inputRef.current.click()}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}
            className="rounded-lg px-4 py-6 text-center text-xs cursor-pointer"
            style={{ border: "1px dashed var(--mz-border)", color: "var(--mz-ink-muted)" }}
          >
            {parsing ? "読み込み中..." : (fileName || "明細ファイル(.xlsx)をドラッグ&ドロップ、またはクリックして選択")}
          </div>
          <input
            ref={inputRef} type="file" accept=".xlsx,.xls" className="hidden"
            onChange={(e) => handleFile(e.target.files && e.target.files[0])}
          />

          {error && <p className="text-xs rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>}

          {result && (
            <div className="space-y-3">
              <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                {result.orders.length}件の注文を集計しました(対象取引 {result.matched}件)
              </p>
              {result.orders.map((o) => {
                const { batch, sys } = rowsForOrder(o);
                const lines = sys ? [
                  { label: "調達(商品代+国内送料)", bd: o.procure, sysv: sys.procure },
                  { label: "国際送料", bd: o.logistics, sysv: sys.logistics },
                  { label: "その他手数料", bd: o.service, sysv: sys.service },
                ] : [];
                const anyDiff = lines.some((l) => Math.abs(l.bd - l.sysv) > 0.0001);
                return (
                  <div key={o.order} className="rounded-lg p-3 space-y-2"
                    style={{ border: `1px solid ${sys && anyDiff ? "#7a5a3a" : "var(--mz-border)"}`, background: "var(--mz-surface-hover)" }}>
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <span className="text-sm">{o.order}</span>
                      <span className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                        {batch ? `⇄ ${batch.name ? batch.name : batch.purchase_date}(${sys ? sys.count : 0}点)` : "対応するロット未設定"}
                      </span>
                    </div>

                    {!batch ? (
                      <p className="text-xs" style={{ color: "#d6a98f" }}>
                        この注文番号を持つロットがありません。ロットの編集画面で「BuckyDropの注文番号」に <strong>{o.order}</strong> を入れると突き合わせできます。
                        (BuckyDrop側の確定純額: 調達 {fmtCnyCompact(o.procure)} / 国際送料 {fmtCnyCompact(o.logistics)} / 手数料 {fmtCnyCompact(o.service)} / 合計 {fmtCnyCompact(o.total)} CNY)
                      </p>
                    ) : (
                      <>
                        <div className="text-xs space-y-1">
                          <div className="flex justify-between gap-2" style={{ color: "var(--mz-ink-muted)" }}>
                            <span className="flex-1">項目</span>
                            <span className="w-24 text-right">BuckyDrop</span>
                            <span className="w-24 text-right">システム</span>
                            <span className="w-20 text-right">差額</span>
                          </div>
                          {lines.map((l) => {
                            const diff = preciseCny(l.sysv - l.bd);
                            const ng = Math.abs(diff) > 0.0001;
                            return (
                              <div key={l.label} className="flex justify-between gap-2" style={{ color: ng ? "#d6a98f" : "var(--mz-ink)" }}>
                                <span className="flex-1">{l.label}</span>
                                <span className="w-24 text-right">{fmtCnyCompact(l.bd)}</span>
                                <span className="w-24 text-right">{fmtCnyCompact(l.sysv)}</span>
                                <span className="w-20 text-right">{ng ? `${diff > 0 ? "+" : ""}${fmtCnyCompact(diff)}` : "一致"}</span>
                              </div>
                            );
                          })}
                        </div>
                        {anyDiff ? (
                          <>
                            <p className="text-xs rounded-lg px-2.5 py-1.5" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
                              ⚠️ 差額があります。「システム」が多い(+)ならウォレットを使いすぎ、少ない(−)なら使い足りていない状態です。
                            </p>
                            {Math.abs(sys.procure - o.procure) > 0.0001 && (
                              <details className="text-xs">
                                <summary className="cursor-pointer py-1" style={{ color: "var(--mz-gold-soft)" }}>
                                  この{sys.count}点のどれかがズレています(クリックで一覧)
                                </summary>
                                <p className="mt-1 mb-2" style={{ color: "var(--mz-ink-muted)" }}>
                                  BuckyDropの明細には「どの商品の返金か」が記録されていないため、システム側では特定できません。
                                  BuckyDropの注文一覧(商品ごとの金額が出る画面)と、下の商品代を見比べてください。
                                  差額は <strong>{fmtCnyCompact(preciseCny(sys.procure - o.procure))} CNY</strong> です。
                                </p>
                                <div className="rounded-lg divide-y" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
                                  {sys.items.map((it) => {
                                    const gap = preciseCny(sys.procure - o.procure);
                                    const after = preciseCny((Number(it.purchase_amount_cny) || 0) - gap);
                                    return (
                                      <div key={it.id} className="flex items-center gap-2 px-2 py-1.5">
                                        <span className="flex-1 truncate">
                                          {it.product_name || "(名称未設定)"}{it.size ? ` - ${it.size}` : ""}
                                          <span style={{ color: "var(--mz-ink-muted)" }}> (No.{it.product_code || "-"}{it.status === "販売済み" ? "・販売済み" : ""})</span>
                                        </span>
                                        <span className="w-20 text-right">{fmtCnyCompact(it.purchase_amount_cny)}</span>
                                        <span className="w-20 text-right" style={{ color: "var(--mz-ink-muted)" }}>→ {fmtCnyCompact(after)}</span>
                                      </div>
                                    );
                                  })}
                                </div>
                                <p className="mt-1.5" style={{ color: "var(--mz-ink-muted)" }}>
                                  右端は「この商品が原因だった場合の正しい金額」です。BuckyDrop側と一致する行が見つかれば、それが犯人です。
                                </p>
                                {/* ★2026-08-18実装: 目視で探さずに済むよう、BuckyDropの購入注文を貼り付けて
                                    1点ずつ突き合わせる(2.37参照) */}
                                <BdItemPasteCompare systemItems={sys.items} />
                              </details>
                            )}
                          </>
                        ) : (
                          <p className="text-xs" style={{ color: "#8fd19e" }}>✓ 3項目とも一致しています</p>
                        )}
                        {Math.abs(o.exchange) > 0.0001 && (
                          <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                            ※ 交換費用の凍結/解除が {fmtCnyCompact(o.exchange)} CNY 残っています(通常は相殺されて0になります)
                          </p>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---- 仕入れロット一覧 ---- */
function BatchList({ batches, usageCountByBatch, onEdit, onDelete, deletingBatchId }) {
  if (batches.length === 0) {
    return <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>仕入れロットがありません</p>;
  }
  return (
    <div className="space-y-2">
      {batches.map((b) => {
        // ★2026-08-17実装: ロットに金額を入れただけではウォレットは消化されない(消化されるのは
        //   その金額が商品へ振り分けられて保存されたとき)。紐付けが済んでいないロットは、実際には
        //   支払済みの送料・手数料がウォレット残高に残ったままになるため、目立つように表示する(2.35参照)
        const linked = usageCountByBatch[b.id] || 0;
        const total = Number(b.total_items) || 0;
        const remaining = total - linked;
        return (
        <div key={b.id} className="rounded-xl p-4" style={{ background: "var(--mz-surface)", border: `1px solid ${remaining > 0 ? "#7a5a3a" : "var(--mz-border)"}` }}>
          <div className="flex items-center justify-between flex-wrap gap-2">
            <p className="text-sm font-medium">{b.name ? `${b.name}(${b.purchase_date})` : b.purchase_date}</p>
            <div className="flex items-center gap-2">
              <span className="text-xs" style={{ color: remaining === 0 ? "var(--mz-ink-muted)" : "#d6a98f" }}>
                紐付け済み: {linked} / {total} 点
              </span>
              <button
                onClick={() => onEdit(b)}
                className="text-xs px-2.5 py-1 rounded-lg"
                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
              >
                編集
              </button>
              {/* ★2026-08-17実装: ロットの削除(2.35参照) */}
              <button
                onClick={() => onDelete(b)}
                disabled={deletingBatchId === b.id}
                className="text-xs px-2.5 py-1 rounded-lg disabled:opacity-60"
                style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}
              >
                {deletingBatchId === b.id ? "削除中..." : "削除"}
              </button>
            </div>
          </div>
          <div className="text-xs mt-1.5 flex flex-wrap gap-x-4 gap-y-1" style={{ color: "var(--mz-ink-muted)" }}>
            <span>送料合計: {b.total_shipping_cny} CNY(1点 {Number(b.per_item_shipping_cny).toFixed(2)})</span>
            <span>手数料合計: {b.total_fee_cny} CNY(1点 {Number(b.per_item_fee_cny).toFixed(2)})</span>
          </div>
          {remaining > 0 && (
            <p className="text-xs mt-2 rounded-lg px-2.5 py-1.5" style={{ background: "#3a2a1f", color: "#d6a98f" }}>
              ⚠️ 残り{remaining}点が未紐付けです。この分の送料・手数料はまだウォレットから消化されていません(残高が実態より多く見えています)。販売登録ページの「ロット紐付け」タブから商品に紐付けてください。
            </p>
          )}
          {remaining < 0 && (
            <p className="text-xs mt-2 rounded-lg px-2.5 py-1.5" style={{ background: "#3a1f22", color: "#f2b8bd" }}>
              ⚠️ 総点数({total}点)より多い{linked}点が紐付いています。端数の調整が正しく働かず、合計がズレている可能性があります。ロットの総点数を実態に合わせて修正してください。
            </p>
          )}
        </div>
        );
      })}
    </div>
  );
}

/* ---- 画像アップロード用ドロップゾーン(ドラッグ&ドロップ + クリック選択の両対応) ---- */
function ImageDropZone({ label, previewUrl, uploading, onFile, helperText, accept = "image/*", dropText = "ドラッグ&ドロップ、またはクリックして画像を選択" }) {
  const [dragOver, setDragOver] = useState(false);
  const inputRef = useRef(null);
  const isPdfPreview = !!previewUrl && /\.pdf($|\?)/i.test(previewUrl);

  const handleFiles = (files) => {
    const file = files && files[0];
    if (file) onFile(file);
  };

  return (
    <div>
      <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>{label}</label>
      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => {
          e.preventDefault();
          setDragOver(false);
          handleFiles(e.dataTransfer.files);
        }}
        onClick={() => inputRef.current && inputRef.current.click()}
        className="rounded-lg p-3 flex items-center gap-3 cursor-pointer transition-colors"
        style={{
          border: `1.5px dashed ${dragOver ? "var(--mz-gold)" : "var(--mz-border)"}`,
          background: dragOver ? "var(--mz-surface-hover)" : "transparent",
        }}
      >
        {previewUrl ? (
          isPdfPreview ? (
            <div className="w-14 h-14 rounded-lg shrink-0 flex flex-col items-center justify-center gap-0.5" style={{ background: "var(--mz-surface-hover)", border: "1px solid var(--mz-border)" }}>
              <Icon name="file" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
              <span className="text-[9px]" style={{ color: "var(--mz-ink-muted)" }}>PDF</span>
            </div>
          ) : (
            <img src={previewUrl} alt="" className="w-14 h-14 rounded-lg object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
          )
        ) : (
          <div className="w-14 h-14 rounded-lg shrink-0 flex items-center justify-center" style={{ background: "var(--mz-surface-hover)" }}>
            <Icon name="tag" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
          </div>
        )}
        <div className="text-xs leading-relaxed" style={{ color: "var(--mz-ink-muted)" }}>
          {uploading ? "アップロード中..." : (
            <>
              {dropText}
              {helperText && <><br />{helperText}</>}
            </>
          )}
        </div>
        <input
          ref={inputRef} type="file" accept={accept} className="hidden"
          onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }}
        />
      </div>
    </div>
  );
}

/* ---- サンプル商品番号の自動採番("S-0001"形式、既存最大値+1) ---- */
async function generateNextProductCode(type) {
  const prefix = type === "sample" ? "S" : "P";
  const { data, error } = await supabase
    .from("products")
    .select("product_code")
    .eq("type", type)
    .not("product_code", "is", null)
    .ilike("product_code", `${prefix}-%`);
  if (error || !data) return `${prefix}-0001`;
  let maxNum = 0;
  data.forEach((r) => {
    const m = /^[A-Z]-(\d+)$/.exec(r.product_code || "");
    if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
  });
  return `${prefix}-${String(maxNum + 1).padStart(4, "0")}`;
}

/* ---- 商品登録・編集モーダル ---- */
function ProductFormModal({ product, batches, onClose, onSave, onCreateBatch }) {
  const isNew = !product.id;
  const [type, setType] = useState(product.type || "sample");
  const [status, setStatus] = useState(product.status || "未販売");
  const [samplePurpose, setSamplePurpose] = useState(product.sample_purpose || "展示用");
  const [extraBatches, setExtraBatches] = useState([]); // この画面内で新規作成したロット(親のbatches propに反映されるまでの一時保持)
  const [batchModalOpen, setBatchModalOpen] = useState(false);
  const [imageUrl, setImageUrl] = useState(product.product_image_url || "");
  const [uploadingImage, setUploadingImage] = useState(false);
  const [extractImageUrl, setExtractImageUrl] = useState("");
  const [uploadingExtractImage, setUploadingExtractImage] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [visionError, setVisionError] = useState(null);
  const [productUrl, setProductUrl] = useState(product.product_url || "");
  const [productCode, setProductCode] = useState(product.product_code || "");
  const [productName, setProductName] = useState(product.product_name || "");
  const [category, setCategory] = useState(product.category || "");
  const [size, setSize] = useState(product.size || "");
  const [sizeOptionsText, setSizeOptionsText] = useState(product.size_options || "");
  const [sellingPriceJpy, setSellingPriceJpy] = useState(product.selling_price_jpy != null ? String(product.selling_price_jpy) : "");
  const [purchaseDate, setPurchaseDate] = useState(product.purchase_date || todayISO());
  const [batchId, setBatchId] = useState(product.batch_id || "");
  const [purchaseAmountCny, setPurchaseAmountCny] = useState(product.purchase_amount_cny != null ? String(product.purchase_amount_cny) : "");
  /* ★2026-08-23: 支払い経路と、直接支払い時のJPY手入力(2.46参照)。
     直接支払いのときだけJPY欄を出し、入力値をそのまま確定原価として保存する。 */
  const [costSource, setCostSource] = useState(costSourceOf(product));
  /* ★2026-08-23: 仕入れ予想価格(2.47参照)。まだ仕入れていない商品が「いくらで仕入れられるか」の目安。
     販売価格を決める材料になるが、実際の原価ではないため productCostJpy には一切含めない。 */
  const [estimatedPurchaseCny, setEstimatedPurchaseCny] = useState(product.estimated_purchase_cny != null ? String(product.estimated_purchase_cny) : "");
  const [purchaseAmountJpy, setPurchaseAmountJpy] = useState(product.purchase_amount_jpy != null ? String(product.purchase_amount_jpy) : "");
  const [shippingJpy, setShippingJpy] = useState(product.shipping_jpy != null ? String(product.shipping_jpy) : "");
  const [feeJpy, setFeeJpy] = useState(product.fee_jpy != null ? String(product.fee_jpy) : "");
  const [domesticShippingJpy, setDomesticShippingJpy] = useState(product.domestic_shipping_jpy != null ? String(product.domestic_shipping_jpy) : "");
  const [shippingCny, setShippingCny] = useState(product.shipping_cny != null ? String(product.shipping_cny) : "");
  const [feeCny, setFeeCny] = useState(product.fee_cny != null ? String(product.fee_cny) : "");
  // ★2026-08-17実装: 中国国内送料(1点ごと。ロットの按分対象外)。2.36参照
  const [domesticShippingCny, setDomesticShippingCny] = useState(product.domestic_shipping_cny != null ? String(product.domestic_shipping_cny) : "");
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState(null);

  // ★2026-07-10実装: AI自動抽出でカラーバリエーションが検出された場合の一括登録用state。
  //   colorOptions: 検出された色名の配列(例: ["黒","灰","白"])。isNewかつAI抽出時のみ使う。
  //   checkedColors: どの色を実際に仕入れるか(チェックボックスの選択状態)。
  //   colorCostInputs: 色ごとの商品代・送料・手数料(CNY)。色によって金額が異なる場合があるため個別入力。
  //   colorImages / uploadingColorImage: 色ごとの商品画像(未指定の場合は共通の商品画像を使う)。
  const [colorOptions, setColorOptions] = useState([]);
  const [checkedColors, setCheckedColors] = useState({});
  const [colorCostInputs, setColorCostInputs] = useState({});
  const [colorImages, setColorImages] = useState({});
  const [uploadingColorImage, setUploadingColorImage] = useState({});

  // 「サイズ展開」テキスト(例: "S/M/L/XL")を選択肢配列にパース。
  // 既存のsize(編集時)がリストに含まれていなければ先頭に追加しておく(選択が消えないように)。
  const sizeOptionsList = useMemo(() => {
    const list = sizeOptionsText.split(/[\/,、]/).map((s) => s.trim()).filter(Boolean);
    if (size && !list.includes(size)) list.unshift(size);
    return list;
  }, [sizeOptionsText, size]);

  // 新規登録・サンプル区分の場合、商品番号が空欄なら自動採番する(手動入力があれば上書きしない)
  useEffect(() => {
    if (!isNew || type !== "sample" || productCode) return;
    let cancelled = false;
    (async () => {
      const code = await generateNextProductCode("sample");
      if (!cancelled) setProductCode(code);
    })();
    return () => { cancelled = true; };
  }, [isNew, type]);

  // ★2026-07-10変更: 商品代・送料・手数料は、編集時(既に消化済み)でも変更可能とする。
  // 保存時にCNY金額が変わっていれば、旧消化を取り消して新金額で再消化する(ProductsPage側のhandleSaveProductで実施)。

  // 商品画像(アプリ上に表示する写真)のアップロード
  const handleProductImageFile = async (file) => {
    setUploadingImage(true);
    const res = await uploadProductImage(file);
    setUploadingImage(false);
    if (!res.ok) { alert(res.message); return; }
    setImageUrl(res.url);
  };

  // AI自動抽出用スクショのアップロード → アップロード後、自動でVision抽出まで実行
  const handleExtractImageFile = async (file) => {
    setUploadingExtractImage(true);
    setVisionError(null);
    const res = await uploadProductImage(file);
    setUploadingExtractImage(false);
    if (!res.ok) { alert(res.message); return; }
    setExtractImageUrl(res.url);
    await runExtraction(res.url);
  };

  const runExtraction = async (url) => {
    const target = url || extractImageUrl;
    if (!target) return;
    setExtracting(true);
    setVisionError(null);
    try {
      const info = await extractProductInfoFromImage(target);
      if (info.product_name) setProductName(info.product_name);
      if (info.category && CATEGORY_OPTIONS.includes(info.category)) setCategory(info.category);
      if (info.price_cny != null) setPurchaseAmountCny(String(info.price_cny));
      if (info.size_range) setSizeOptionsText(info.size_range);
      // ★2026-07-10実装: カラーバリエーションが検出された場合、選択式の一括登録UIを表示する
      if (Array.isArray(info.colors) && info.colors.length > 0) {
        setColorOptions(info.colors);
        setCheckedColors({});
        setColorCostInputs({});
      } else {
        setColorOptions([]);
      }
    } catch (err) {
      setVisionError(err.message || "AI自動抽出に失敗しました");
    }
    setExtracting(false);
  };

  // 親(ProductsPage)のbatches propは非同期(loadAll)で更新されるため、この画面内で
  // 新規作成したロットはextraBatchesに一時的に保持し、選択肢に反映する。
  const allBatches = useMemo(() => {
    const ids = new Set(batches.map((b) => b.id));
    return [...batches, ...extraBatches.filter((b) => !ids.has(b.id))];
  }, [batches, extraBatches]);

  const handleBatchChange = async (id) => {
    setBatchId(id);
    if (!id) return;
    const b = allBatches.find((x) => x.id === id);
    if (b) {
      const amounts = await computeBatchItemAmounts(b, product.id || null);
      setShippingCny(String(amounts.shipping));
      setFeeCny(String(amounts.fee));
    }
  };

  const handleBatchCreated = async (form) => {
    const res = await onCreateBatch(form);
    if (!res.ok) { alert(res.message || "ロットの登録に失敗しました"); return; }
    setExtraBatches((prev) => [...prev, res.batch]);
    setBatchModalOpen(false);
    setBatchId(res.batch.id);
    const amounts = await computeBatchItemAmounts(res.batch, product.id || null);
    setShippingCny(String(amounts.shipping));
    setFeeCny(String(amounts.fee));
  };

  // ★2026-07-10実装: カラーバリエーション一括登録用のチェック切り替え・金額入力ハンドラ
  const toggleColor = (color) => {
    setCheckedColors((prev) => ({ ...prev, [color]: !prev[color] }));
    // 初めてチェックした色は、共通欄(AI自動抽出で入った商品代等)の現在値をデフォルトとして引き継ぐ
    // ★2026-08-23: 直接支払いのJPY欄も同じく共通欄の現在値を引き継ぐ(2.46参照)
    setColorCostInputs((prev) => (prev[color] ? prev : { ...prev, [color]: {
      purchaseAmountCny: purchaseAmountCny || "", shippingCny: shippingCny || "", feeCny: feeCny || "", domesticShippingCny: domesticShippingCny || "",
      purchaseAmountJpy: purchaseAmountJpy || "", shippingJpy: shippingJpy || "", feeJpy: feeJpy || "", domesticShippingJpy: domesticShippingJpy || "",
    } }));
  };

  const updateColorCost = (color, field, value) => {
    setColorCostInputs((prev) => ({ ...prev, [color]: { ...(prev[color] || {}), [field]: value } }));
  };

  // 色ごとの商品画像アップロード。未指定の色は共通の商品画像(imageUrl)をそのまま使う。
  const handleColorImageFile = async (color, file) => {
    setUploadingColorImage((prev) => ({ ...prev, [color]: true }));
    const res = await uploadProductImage(file);
    setUploadingColorImage((prev) => ({ ...prev, [color]: false }));
    if (!res.ok) { alert(res.message); return; }
    setColorImages((prev) => ({ ...prev, [color]: res.url }));
  };

  const activeColors = colorOptions.filter((c) => checkedColors[c]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setFormError(null);
    if (!productName.trim() || !purchaseDate) return;

    // ★2026-07-10実装: カラーバリエーションが1色以上選択されている場合は一括登録モード
    if (activeColors.length > 0) {
      for (const c of activeColors) {
        const costs = colorCostInputs[c] || {};
        if (costs.purchaseAmountCny === undefined || costs.purchaseAmountCny === "" || isNaN(parseFloat(costs.purchaseAmountCny))) {
          setFormError(`「${c}」の商品代を入力してください`);
          return;
        }
      }
      setSaving(true);
      const multiItems = [];
      // ★2026-07-10バグ修正: generateNextProductCodeをループ内で毎回awaitすると、
      //   この時点ではまだどの色もDBにinsertされていないため、全色が同じ「DB上の最大値+1」を
      //   返してしまい商品番号が重複していた。そのため最初の1回だけDBから採番し、
      //   以降はローカルの連番でインクリメントする。
      const firstCode = await generateNextProductCode(type);
      const codePrefix = type === "sample" ? "S" : "P";
      const firstCodeMatch = /^[A-Z]-(\d+)$/.exec(firstCode);
      let nextCodeNum = firstCodeMatch ? parseInt(firstCodeMatch[1], 10) : 1;
      for (const c of activeColors) {
        const code = `${codePrefix}-${String(nextCodeNum).padStart(4, "0")}`;
        nextCodeNum += 1;
        const costs = colorCostInputs[c] || {};
        multiItems.push({
          type,
          status,
          sample_purpose: type === "sample" ? samplePurpose : null,
          product_image_url: colorImages[c] || imageUrl || null,
          product_url: productUrl.trim() || null,
          product_code: code,
          product_name: `${productName.trim()}(${c})`,
          category: category || null,
          size: size.trim() || null,
          size_options: sizeOptionsText.trim() || null,
          selling_price_jpy: sellingPriceJpy ? parseFloat(sellingPriceJpy) : null,
          purchase_date: purchaseDate,
          batch_id: batchId || null,
          purchase_amount_cny: costs.purchaseAmountCny ? parseFloat(costs.purchaseAmountCny) : 0,
          shipping_cny: costs.shippingCny ? parseFloat(costs.shippingCny) : 0,
          fee_cny: costs.feeCny ? parseFloat(costs.feeCny) : 0,
          domestic_shipping_cny: costs.domesticShippingCny ? parseFloat(costs.domesticShippingCny) : 0,
          // ★2026-08-23: カラーバリエーション一括登録も直接支払いに対応(2.46参照)
          cost_source: costSource,
          estimated_purchase_cny: estimatedPurchaseCny ? parseFloat(estimatedPurchaseCny) : null,
          purchase_amount_jpy: costs.purchaseAmountJpy ? parseFloat(costs.purchaseAmountJpy) : 0,
          shipping_jpy: costs.shippingJpy ? parseFloat(costs.shippingJpy) : 0,
          fee_jpy: costs.feeJpy ? parseFloat(costs.feeJpy) : 0,
          domestic_shipping_jpy: costs.domesticShippingJpy ? parseFloat(costs.domesticShippingJpy) : 0,
        });
      }
      await onSave({ multiItems });
      setSaving(false);
      return;
    }

    setSaving(true);
    await onSave({
      id: product.id || null,
      type,
      status,
      sample_purpose: type === "sample" ? samplePurpose : null,
      product_image_url: imageUrl || null,
      product_url: productUrl.trim() || null,
      product_code: productCode.trim() || null,
      product_name: productName.trim(),
      category: category.trim() || null,
      size: size.trim() || null,
      size_options: sizeOptionsText.trim() || null,
      selling_price_jpy: sellingPriceJpy ? parseFloat(sellingPriceJpy) : null,
      // ★2026-08-23: 仕入れなし(カタログ用)は仕入れ日を持たせず、金額もすべて0で保存する(2.47参照)
      purchase_date: costSource === COST_SOURCE_NONE ? (purchaseDate || null) : purchaseDate,
      batch_id: costSource === COST_SOURCE_NONE ? null : (batchId || null),
      purchase_amount_cny: costSource === COST_SOURCE_NONE ? 0 : (purchaseAmountCny ? parseFloat(purchaseAmountCny) : 0),
      shipping_cny: costSource === COST_SOURCE_NONE ? 0 : (shippingCny ? parseFloat(shippingCny) : 0),
      fee_cny: costSource === COST_SOURCE_NONE ? 0 : (feeCny ? parseFloat(feeCny) : 0),
      domestic_shipping_cny: costSource === COST_SOURCE_NONE ? 0 : (domesticShippingCny ? parseFloat(domesticShippingCny) : 0),
      cost_source: costSource,
      estimated_purchase_cny: estimatedPurchaseCny ? parseFloat(estimatedPurchaseCny) : null,
      purchase_amount_jpy: costSource === COST_SOURCE_NONE ? 0 : (purchaseAmountJpy ? parseFloat(purchaseAmountJpy) : 0),
      shipping_jpy: costSource === COST_SOURCE_NONE ? 0 : (shippingJpy ? parseFloat(shippingJpy) : 0),
      fee_jpy: costSource === COST_SOURCE_NONE ? 0 : (feeJpy ? parseFloat(feeJpy) : 0),
      domestic_shipping_jpy: costSource === COST_SOURCE_NONE ? 0 : (domesticShippingJpy ? parseFloat(domesticShippingJpy) : 0),
    });
    setSaving(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <form
        onSubmit={handleSubmit}
        className="w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[92vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <h2 className="font-display text-lg">{isNew ? "新規仕入れ登録" : "商品情報を編集"}</h2>

        {/* 商品画像(アプリ表示用) */}
        <ImageDropZone
          label="商品画像(アプリ上に表示される写真)"
          previewUrl={imageUrl}
          uploading={uploadingImage}
          onFile={handleProductImageFile}
          helperText="サムネイル・一覧表示に使用されます"
        />

        {/* AI自動抽出用スクショ(商品画像とは別に登録) */}
        <div>
          <ImageDropZone
            label="商品情報スクショ(淘宝の商品名・価格部分。AI自動抽出用)"
            previewUrl={extractImageUrl}
            uploading={uploadingExtractImage}
            onFile={handleExtractImageFile}
            helperText="ドロップすると自動でAI抽出を実行します"
          />
          {extractImageUrl && (
            <button
              type="button" onClick={() => runExtraction()} disabled={uploadingExtractImage || extracting}
              className="mt-2 text-xs px-3 py-1.5 rounded-lg disabled:opacity-40 whitespace-nowrap"
              style={{ border: "1px solid var(--mz-gold)", color: "var(--mz-gold-soft)" }}
            >
              {extracting ? "AI解析中..." : "もう一度AIで抽出する"}
            </button>
          )}
          {visionError && <p className="text-xs mt-1" style={{ color: "#f2b8bd" }}>{visionError}</p>}
        </div>

        {/* ★2026-08-23実装: 支払い経路の選択(2.46参照)。単品・カラーバリエーション一括の両方に効く。
            直接支払いを選ぶとウォレットを使わず、JPY欄がそのまま確定原価になる。 */}
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>支払い経路</label>
          <select
            value={costSource}
            onChange={(e) => {
              const next = e.target.value;
              /* 「仕入れなし」から実際の仕入れへ切り替えたとき、商品代が未入力なら仕入れ予想価格を
                 初期値として引き継ぐ(予想と実額がほぼ同じことが多く、入れ直す手間を省くため)。
                 既に商品代が入っている場合は上書きしない。 */
              if (costSource === COST_SOURCE_NONE && next !== COST_SOURCE_NONE
                  && !(parseFloat(purchaseAmountCny) > 0) && parseFloat(estimatedPurchaseCny) > 0) {
                setPurchaseAmountCny(estimatedPurchaseCny);
              }
              setCostSource(next);
            }}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
            {COST_SOURCE_OPTIONS.map((o) => <option key={o} value={o}>{COST_SOURCE_LABELS[o] || o}</option>)}
          </select>
          <p className="text-xs mt-1.5" style={{ color: "var(--mz-ink-muted)" }}>
            {costSource === COST_SOURCE_DIRECT
              ? "タオバオ・微店から直接仕入れた場合など、いつもの転送業者のウォレットを経由しない仕入れです。ウォレット残高は減りません。CNYは記録用、JPYが実際に支払った金額として原価になります。"
              : "いつもの転送業者のチャージ残高(ウォレット)からFIFOで自動消化します。"}
          </p>
        </div>

        {colorOptions.length > 0 && (
          <div className="rounded-lg p-3 space-y-2" style={{ background: "var(--mz-surface-hover)", border: "1px solid var(--mz-border)" }}>
            <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
              カラーバリエーションが検出されました。仕入れる色にチェックを入れ、色ごとの商品代・送料・手数料を入力してください(チェックした色の数だけ商品が一括登録されます。商品名の末尾に色が自動で付きます)。
            </p>
            {colorOptions.map((c) => (
              <div key={c} className="rounded-lg p-2" style={{ border: "1px solid var(--mz-border)" }}>
                <label className="flex items-center gap-2 text-sm cursor-pointer">
                  <input type="checkbox" checked={!!checkedColors[c]} onChange={() => toggleColor(c)} />
                  <span>{c}</span>
                </label>
                {checkedColors[c] && (
                  <div className="mt-2 space-y-2">
                    <ImageDropZone
                      label="この色の商品画像(未指定の場合は上の共通画像を使用)"
                      previewUrl={colorImages[c] || imageUrl}
                      uploading={!!uploadingColorImage[c]}
                      onFile={(file) => handleColorImageFile(c, file)}
                      helperText="ドラッグ&ドロップ、またはクリックして画像を選択"
                    />

/* ---- 返品登録モーダル(コスト0円・ウォレット消化なし) ---- */
function ReturnFormModal({ sourceProduct, onClose, onSave }) {
  const [returnDate, setReturnDate] = useState(todayISO());
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    await onSave({ return_date: returnDate });
    setSaving(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <form
        onSubmit={handleSubmit}
        className="w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5 space-y-4"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}

        <p className="text-sm" style={{ color: "var(--mz-ink-muted)" }}>
          「{sourceProduct.product_name}」の返品分を、新しい在庫として登録します(商品代は既に支払い済みのため、ウォレットは消化されません)。
        </p>
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>返品日</label>
          <input type="date" value={returnDate} onChange={(e) => setReturnDate(e.target.value)} required
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
        </div>
        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="flex-1 rounded-lg py-2.5 text-sm" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>キャンセル</button>
          <button type="submit" disabled={saving} className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60" style={{ background: "var(--mz-gold)", color: "#1a1710" }}>
            {saving ? "登録中..." : "返品登録"}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ---- 商品・サンプル在庫ページ本体 ---- */
/* ★2026-08-04実装: 商品編集(既存商品のCNY金額変更を含む)の保存処理を共通関数として切り出し。
   ProductsPageの編集画面だけでなく、販売登録ページの「仕入れ商品」タブからの編集でも再利用する(2.30参照)。
   original: モーダルを開いた時点の元データ(CNY金額の変更検知に使用) */
/* ★2026-08-17実装: 指定した商品に紐づく販売明細の利益(sale_items.profit_jpy)を、現在の確定原価から
   再計算して書き戻す(2.35参照)。
   ・profit_jpyは販売登録時点のスナップショットで、後から商品原価を修正しても自動追随しない(1.12参照)。
   ・販売一覧(SaleCard)や月次損益は都度再計算するため画面上は正しく見えるが、ダッシュボードと
     ホストクラブ詳細の利益合計は保存済みのprofit_jpyを合算するため、直さないと数字が食い違う。
   ・そのため「後から原価を変える」処理(ロット一括紐付け等)では、変更後にこの関数を呼んで同期する。 */
async function syncSaleItemProfits(productIds) {
  if (!productIds || productIds.length === 0) return { ok: true };

  const { data: prods, error: prodErr } = await supabase
    .from("products")
    .select("id,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy")
    .in("id", productIds);
  if (prodErr) return { ok: false, message: "商品の確定原価の取得に失敗しました" };
  const costById = {};
  (prods || []).forEach((p) => { costById[p.id] = productCostJpy(p); });

  const { data: rows, error: itemErr } = await supabase
    .from("sale_items")
    .select("id,product_id,unit_price_jpy")
    .in("product_id", productIds);
  if (itemErr) return { ok: false, message: "販売明細の取得に失敗しました" };
  if (!rows || rows.length === 0) return { ok: true };

  for (const row of rows) {
    if (!(row.product_id in costById)) continue;
    const profit = itemPretaxJpy(row.unit_price_jpy) - costById[row.product_id];
    const { error: updErr } = await supabase.from("sale_items").update({ profit_jpy: profit }).eq("id", row.id);
    if (updErr) return { ok: false, message: "販売明細の利益の更新に失敗しました" };
  }
  return { ok: true };
}

/* options.syncProfits:
   ★2026-08-22追加。CNY金額が変わった場合に、その商品が売れている販売明細の利益
   (sale_items.profit_jpy)も自動で同期するかどうか(既定: する)。
   ロット一括紐付け・ロット編集時の再配分・ロット削除のように、多数の商品をループで処理して
   最後にまとめて syncSaleItemProfits を呼ぶ側は false を渡すこと(1点ごとに呼ぶと
   同じ更新を何度も往復することになり無駄に遅くなるため)。 */
async function updateProductCore(form, original, options) {
  const opts = options || {};
  const syncProfits = opts.syncProfits !== false;
  const orig = original || {};
  /* ★2026-08-23: 支払い経路(2.46参照)。
     ・直接支払い … ウォレットを一切触らず、入力されたJPYをそのまま確定額として保存する。
     ・経路を切り替えた場合も「旧経路の後始末 → 新経路で確定」の順で処理する。
       ウォレット→直接に切り替えるときは、必ず先に旧消化を払い戻すこと
       (残したままだと、その商品の原価が消えたのにウォレットだけ減ったままになる)。 */
  const newSource = costSourceOf(form);
  const oldSource = costSourceOf(orig);
  const sourceChanged = newSource !== oldSource;
  const oldTotalCny = (Number(orig.purchase_amount_cny) || 0) + (Number(orig.shipping_cny) || 0) + (Number(orig.fee_cny) || 0)
    + (Number(orig.domestic_shipping_cny) || 0);
  const newTotalCny = (Number(form.purchase_amount_cny) || 0) + (Number(form.shipping_cny) || 0) + (Number(form.fee_cny) || 0)
    + (Number(form.domestic_shipping_cny) || 0);
  const cnyChanged =
    (Number(form.purchase_amount_cny) || 0) !== (Number(orig.purchase_amount_cny) || 0) ||
    (Number(form.shipping_cny) || 0) !== (Number(orig.shipping_cny) || 0) ||
    (Number(form.fee_cny) || 0) !== (Number(orig.fee_cny) || 0) ||
    (Number(form.domestic_shipping_cny) || 0) !== (Number(orig.domestic_shipping_cny) || 0);
  const jpyChanged = (newSource === COST_SOURCE_DIRECT || newSource === COST_SOURCE_NONE) && (
    (Number(form.purchase_amount_jpy) || 0) !== (Number(orig.purchase_amount_jpy) || 0) ||
    (Number(form.shipping_jpy) || 0) !== (Number(orig.shipping_jpy) || 0) ||
    (Number(form.fee_jpy) || 0) !== (Number(orig.fee_jpy) || 0) ||
    (Number(form.domestic_shipping_jpy) || 0) !== (Number(orig.domestic_shipping_jpy) || 0)
  );
  const costsChanged = cnyChanged || jpyChanged || sourceChanged;
  // ウォレットの組み替えが要るのは「金額(CNY)が変わった」か「経路が変わった」場合だけ
  const needsWalletRework = cnyChanged || sourceChanged;

  if (needsWalletRework) {
    if (newSource === COST_SOURCE_WALLET) {
      const balance = await getWalletRemainingTotal();
      if (!balance.ok) return { ok: false, message: "ウォレット残高の確認に失敗しました" };
      // 旧経路が直接支払いなら、払い戻しで戻ってくる残高は無い
      const refundable = oldSource === COST_SOURCE_WALLET ? oldTotalCny : 0;
      const projectedBalance = balance.total + refundable;
      if (projectedBalance < newTotalCny) {
        return { ok: false, message: `ウォレット残高が不足しています(必要額: ${newTotalCny.toFixed(2)} CNY / 旧消化分を払い戻した場合の残高: ${projectedBalance.toFixed(2)} CNY)。先にチャージを追加してから再度保存してください。` };
      }
    }
    if (oldSource === COST_SOURCE_WALLET) {
      const reverseRes = await reverseWalletConsumption(form.id);
      if (!reverseRes.ok) return { ok: false, message: reverseRes.message };
    }
  }

  const patch = {
    type: form.type,
    status: form.status,
    sample_purpose: form.type === "sample" ? (form.sample_purpose || "展示用") : null,
    product_image_url: form.product_image_url,
    product_url: form.product_url,
    product_code: form.product_code,
    product_name: form.product_name,
    category: form.category,
    size: form.size,
    size_options: form.size_options,
    selling_price_jpy: form.selling_price_jpy,
    purchase_date: form.purchase_date,
    batch_id: form.batch_id,
    purchase_amount_cny: form.purchase_amount_cny,
    shipping_cny: form.shipping_cny,
    fee_cny: form.fee_cny,
    domestic_shipping_cny: form.domestic_shipping_cny,
    cost_source: newSource,
    // ★2026-08-23: 仕入れ予想価格。原価ではないので消化・利益計算には一切使わない(2.47参照)
    estimated_purchase_cny: form.estimated_purchase_cny != null ? form.estimated_purchase_cny : null,
  };
  /* 直接支払いの場合は、入力されたJPYをそのまま確定額として保存する(ウォレット消化は行わない)。
     ウォレットへ戻した場合は、この後のFIFO消化で上書きされるため、いったん0にしておく
     (消化が失敗したときに古い直接入力額が残り続けるのを防ぐ)。 */
  if (newSource === COST_SOURCE_DIRECT || newSource === COST_SOURCE_NONE) {
    // 仕入れなし(カタログ用)はフォーム側で0が入るため、そのまま書けば0になる(2.47参照)
    patch.purchase_amount_jpy = Number(form.purchase_amount_jpy) || 0;
    patch.shipping_jpy = Number(form.shipping_jpy) || 0;
    patch.fee_jpy = Number(form.fee_jpy) || 0;
    patch.domestic_shipping_jpy = Number(form.domestic_shipping_jpy) || 0;
  } else if (sourceChanged) {
    patch.purchase_amount_jpy = 0;
    patch.shipping_jpy = 0;
    patch.fee_jpy = 0;
    patch.domestic_shipping_jpy = 0;
  }
  const { error } = await supabase.from("products").update(patch).eq("id", form.id);
  if (error) return { ok: false, message: "更新に失敗しました" };

  if (newSource === COST_SOURCE_WALLET && needsWalletRework) {
    const consumeRes = await consumeAndFinalizeProductCost(form.id, {
      purchaseCny: form.purchase_amount_cny,
      shippingCny: form.shipping_cny,
      feeCny: form.fee_cny,
      domesticShippingCny: form.domestic_shipping_cny,
    });
    if (!consumeRes.ok) {
      return { ok: true, warning: `商品情報は更新されましたが、ウォレット再消化処理でエラーが発生しました: ${consumeRes.message}\nチャージ台帳・商品情報をご確認ください。` };
    }
  }

  /* ★2026-08-22実装: 原価(CNY)が変わったら、この商品が売れている販売明細に保存済みの利益
     (sale_items.profit_jpy)も再計算して同期する(1.12・2.18参照)。
     profit_jpyは販売登録時点のスナップショットで、原価修正に自動追随しない。販売一覧・月次損益は
     都度再計算するため画面上は正しく見えるが、ダッシュボードとホストクラブ詳細の利益合計だけは
     この保存値を合算するため、直さないと数字が食い違う。
     2026-08-17時点ではロット関連の一括処理でのみ同期していたが、商品を個別に編集した場合
     (ProductFormModal からの保存)も同じズレが起きるため、共通処理であるここへ移した。 */
  if (costsChanged && syncProfits) {
    const sync = await syncSaleItemProfits([form.id]);
    if (!sync.ok) {
      return {
        ok: true,
        warning: `商品情報は更新されましたが、販売明細の利益(profit_jpy)の再計算に失敗しました: ${sync.message}\nダッシュボード・ホストクラブ別の利益合計が古い値のままになっている可能性があります。`,
      };
    }
  }
  return { ok: true };
}

/* ★2026-08-17実装: 仕入れロットの合計金額・総点数を編集したとき、既に紐付いている商品へ
   国際送料・その他手数料を配分し直す(2.35参照)。

   ・2026-08-04に入れたロット編集機能は「以後に登録する商品への按分」だけを変えるもので、
     既に紐付け済みの商品の金額は据え置きだった。当時は「商品を登録してからロットを作る」流れが
     無かったため問題にならなかったが、ロットを後から作って一括紐付けする運用(2.35)では、
     ロットの金額を修正しても商品側が古い金額のまま残り、ロット合計と商品側の合計が食い違う。
   ・配分規則は登録時とまったく同じにする(1.9「最終品吸収方式」)。総点数に達する最後の1点だけが
     差額を吸収し、それ以外は preciseCny(1点あたり)。
   ・**computeBatchItemAmounts を流用してはいけない**。あの関数は「DB上の"他の"商品の現在値」を数えて
     最後の1点かどうかを判定するため、既に総点数ぶん紐付いている状態で全商品に対して呼ぶと、
     どの商品も「最後の1点」と判定され、互いの古い値を参照し合って壊れる。ここでは配分表を
     メモリ上で先に決めてから流し込む。
   ・ウォレットは updateProductCore 経由で1点ずつ取り消し→再消化する(並列にすると残高が壊れる)。 */
/* updateProductCore が書き込む列を漏れなく含んだ、商品編集用のSELECT列。
   1列でも欠けると、その値が undefined としてDBに書き戻され、既存の値が消える(2.36参照)。 */
const PRODUCT_EDIT_SELECT = "id,type,status,sample_purpose,product_url,product_code,product_image_url,product_name,category,size,size_options,selling_price_jpy,purchase_date,created_at,return_date,return_source_product_id,batch_id,purchase_amount_cny,shipping_cny,fee_cny,domestic_shipping_cny,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy,cost_source,estimated_purchase_cny";

async function reallocateBatchAmounts(batch) {
  const { data: rows, error } = await supabase
    .from("products")
    .select(PRODUCT_EDIT_SELECT)
    .eq("batch_id", batch.id)
    .order("created_at", { ascending: true })
    .order("id", { ascending: true });
  if (error) return { ok: false, message: "このロットに紐づく商品の取得に失敗しました" };

  const list = rows || [];
  if (list.length === 0) return { ok: true, updated: 0, total: 0, messages: [] };

  const totalItems = Number(batch.total_items) || 0;
  if (totalItems <= 0) return { ok: false, message: "ロットの総点数が未設定のため、配分し直せません。" };
  if (list.length > totalItems) {
    return {
      ok: false,
      message: `このロットには総点数(${totalItems}点)より多い${list.length}点が紐付いています。\n先にロットの総点数を実態に合わせて修正してください。`,
    };
  }

  const totalShipping = Number(batch.total_shipping_cny) || 0;
  const totalFee = Number(batch.total_fee_cny) || 0;
  const perShipping = preciseCny(totalShipping / totalItems);
  const perFee = preciseCny(totalFee / totalItems);

  // 先に配分表を確定させる(i+1 が総点数に達する1点だけが差額を吸収する)
  let sumShipping = 0;
  let sumFee = 0;
  const plan = list.map((product, i) => {
    const isLast = (i + 1) === totalItems;
    const shipping = isLast ? preciseCny(totalShipping - sumShipping) : perShipping;
    const fee = isLast ? preciseCny(totalFee - sumFee) : perFee;
    sumShipping += shipping;
    sumFee += fee;
    return { product, shipping, fee };
  });

  const messages = [];
  const changedIds = [];
  let failed = null;
  for (const { product, shipping, fee } of plan) {
    // 金額が変わらない商品はウォレットを触らない(無駄な取り消し→再消化でレートが変わるのを避ける)
    if ((Number(product.shipping_cny) || 0) === shipping && (Number(product.fee_cny) || 0) === fee) continue;
    // 利益(profit_jpy)の同期はループの後でまとめて行うため、ここでは個別同期を止める
    const res = await updateProductCore({ ...product, shipping_cny: shipping, fee_cny: fee }, product, { syncProfits: false });
    const name = product.product_name || product.product_code || "(名称未設定)";
    if (!res.ok) {
      // ウォレットの払い戻し途中で失敗している可能性があるため、後続は処理せず中断する
      failed = `${name}: ${res.message}`;
      break;
    }
    if (res.warning) messages.push(`${name}: ${res.warning}`);
    changedIds.push(product.id);
  }

  // 中断した場合でも、そこまでに原価が変わった商品の利益(sale_items.profit_jpy)は同期しておく
  if (changedIds.length > 0) {
    const sync = await syncSaleItemProfits(changedIds);
    if (!sync.ok) messages.push(`販売明細の利益(profit_jpy)の再計算に失敗しました: ${sync.message}`);
  }

  if (failed) {
    return {
      ok: false,
      message: `${failed}\n\n${changedIds.length}点まで反映した時点で中断しました。ウォレット残高と該当商品をご確認のうえ、もう一度お試しください。`,
      updated: changedIds.length,
    };
  }
  return { ok: true, updated: changedIds.length, total: list.length, messages };
}

/* ★2026-08-17実装: 仕入れロットを削除する(2.35参照)。
   ・紐付いている商品がある場合は「完全な取り消し」として、各商品の国際送料・その他手数料を0円に戻し、
     消化済みのウォレットを払い戻してから削除する(商品代・中国国内送料は1点ごとの費用なのでそのまま残す)。
   ・**必ず全商品の batch_id を外し終えてから purchase_batches を削除すること。**
     products.batch_id のFKは ON DELETE SET NULL(2026-08-17 確認済み)。ロットを直接DELETEしても
     商品は消えないが、batch_id だけが黙って NULL になり、**商品側には配分済みの
     shipping_cny / fee_cny とウォレット消化が残ったまま**になる(どのロット由来か辿れない金額が残る)。
     先に1点ずつ金額を0に戻してから削除することで、この取り残しを防ぐ。
     なお運用中にFKを ON DELETE RESTRICT へ変更した場合も、この順序であれば正しく動作する
     (削除時点で参照している行が無いため RESTRICT には引っかからない)。
   ・ウォレットの整合性を壊さないよう、商品は1点ずつ順番に処理し、失敗したらロットは削除しない。 */
async function deleteBatchWithUnlink(batch) {
  const { data: rows, error } = await supabase
    .from("products")
    .select(PRODUCT_EDIT_SELECT)
    .eq("batch_id", batch.id)
    .order("created_at", { ascending: true })
    .order("id", { ascending: true });
  if (error) return { ok: false, message: "このロットに紐づく商品の取得に失敗しました" };

  const list = rows || [];
  const messages = [];
  const changedIds = [];
  let failed = null;

  for (const product of list) {
    // 利益(profit_jpy)の同期はループの後でまとめて行うため、ここでは個別同期を止める
    const res = await updateProductCore(
      { ...product, batch_id: null, shipping_cny: 0, fee_cny: 0 },
      product,
      { syncProfits: false }
    );
    const name = product.product_name || product.product_code || "(名称未設定)";
    if (!res.ok) { failed = `${name}: ${res.message}`; break; }
    if (res.warning) messages.push(`${name}: ${res.warning}`);
    changedIds.push(product.id);
  }

  // 中断した場合も、そこまでに原価が変わった商品の利益は同期しておく
  if (changedIds.length > 0) {
    const sync = await syncSaleItemProfits(changedIds);
    if (!sync.ok) messages.push(`販売明細の利益(profit_jpy)の再計算に失敗しました: ${sync.message}`);
  }

  if (failed) {
    return {
      ok: false,
      message: `${failed}\n\n商品${changedIds.length}点まで処理した時点で中断し、ロットは削除していません。\nウォレット残高と該当商品をご確認のうえ、もう一度お試しください。`,
    };
  }

  const { error: delErr } = await supabase.from("purchase_batches").delete().eq("id", batch.id);
  if (delErr) {
    return {
      ok: false,
      message: `商品${changedIds.length}点の紐付けは外して金額を0円に戻しましたが、ロット自体の削除に失敗しました。\n`
        + `このロットをまだ参照している商品が残っている可能性があります(商品番号で検索して確認してください)。\nもう一度削除をお試しください。`,
    };
  }

  return { ok: true, unlinked: changedIds.length, messages };
}

function ProductsPage() {

  const loadAll = useCallback(async () => {
    setError(null);
    const [productsRes, batchesRes, consumptionsRes, batchLinkRes] = await Promise.all([
      supabase.from("products")
        .select("id,type,status,sample_purpose,product_url,product_code,product_image_url,product_name,category,size,size_options,selling_price_jpy,purchase_date,created_at,return_date,return_source_product_id,batch_id,purchase_amount_cny,shipping_cny,fee_cny,domestic_shipping_cny,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy,cost_source,estimated_purchase_cny")
        .eq("created_via_sale", false) // ★2026-08-04実装: 販売登録からの新規仕入はサンプル・在庫の一覧から除外(2.30参照)
        .order("created_at", { ascending: false }),
      supabase.from("purchase_batches").select("id,purchase_date,name,total_items,total_shipping_cny,total_fee_cny,per_item_shipping_cny,per_item_fee_cny").order("purchase_date", { ascending: false }),
      supabase.from("agent_charge_consumptions").select("id,product_id"),

  useEffect(() => { loadAll(); }, [loadAll]);

  // ★2026-07-10実装: 販売登録画面の「展示用サンプルが売れました。再仕入れしますか？」に
  //   「はい」と回答した場合、その商品情報を事前入力した状態で新規登録モーダルを開く。
  /* ★2026-08-24: 「再仕入れ検討」から来た場合は、その販売明細のidも受け取っておく。
     登録が完了した時点で reorder_decided=true にし、キャンセルしたら何もしない(2.31参照)。 */
  const [reorderSaleItemId, setReorderSaleItemId] = useState(null);
  useEffect(() => {
    if (pendingProductPrefill) {
      setModalProduct(pendingProductPrefill);
      pendingProductPrefill = null;
    }
    if (pendingReorderSaleItemId) {
      setReorderSaleItemId(pendingReorderSaleItemId);
      pendingReorderSaleItemId = null;
    }
  }, []);

  /* 再仕入れ検討からの登録が完了したときだけ、その明細を判断済みにする。
     失敗しても商品登録自体は成功しているため、警告に留めて処理は止めない
     (一覧に残るだけなので、あとで「再仕入れ不要」を押せば消せる)。 */
  const markReorderDecided = async () => {
    if (!reorderSaleItemId) return;
    const { error } = await supabase.from("sale_items").update({ reorder_decided: true }).eq("id", reorderSaleItemId);
    if (error) {
      alert("商品は登録されましたが、「再仕入れ検討」からの削除に失敗しました。\n販売登録ページの再仕入れ検討タブで「再仕入れ不要」を押して消してください。");
    }
    setReorderSaleItemId(null);
  };


  const consumedProductIds = useMemo(() => new Set((consumptions || []).map((c) => c.product_id)), [consumptions]);

  // ★2026-08-17修正: 受注商品(created_via_sale=true)も含めた全商品から数える(2.35参照)
  const usageCountByBatch = useMemo(() => {
    const m = {};
    (batchLinkRows || []).forEach((p) => { if (p.batch_id) m[p.batch_id] = (m[p.batch_id] || 0) + 1; });
    return m;
  }, [batchLinkRows]);

  const filteredProducts = useMemo(() => {
    if (!products) return [];
    // 売れた商品(販売済み・返品済み)は一覧から常に除外し、未販売のみを表示する(状態フィルタのUIは廃止)。
    let list = products.filter((p) => p.status === "未販売");
    if (filterKind === "sample_all") {
      list = list.filter((p) => p.type === "sample");
    } else if (filterKind === "sample_display") {
      list = list.filter((p) => p.type === "sample" && (p.sample_purpose || "展示用") === "展示用");
    } else if (filterKind === "sample_disposal") {
      list = list.filter((p) => p.type === "sample" && p.sample_purpose === "処分用");
    } else if (filterKind === "stock_normal") {
      list = list.filter((p) => p.type === "stock" && !p.return_source_product_id);
    } else if (filterKind === "stock_returned") {
      list = list.filter((p) => p.type === "stock" && !!p.return_source_product_id);
    }
    // 登録日(created_at)で並べ替え。同時刻の場合はidで安定ソート。
    const sorted = [...list].sort((a, b) => {
      const dateCompare = (a.created_at || "").localeCompare(b.created_at || "");
      if (dateCompare !== 0) return sortOrder === "asc" ? dateCompare : -dateCompare;
      return sortOrder === "asc" ? (a.id > b.id ? 1 : -1) : (a.id < b.id ? 1 : -1);
    });
    return sorted;
  }, [products, filterKind, sortOrder]);

  /* 仕入れ確定(products登録)時のウォレット消化処理は共通ヘルパーに委譲 */
  const consumeAndFinalize = consumeAndFinalizeProductCost;

  // 新規商品1点分の登録処理(ウォレット残高事前チェック→insert→FIFO消化確定)を共通化。
  // 単品の新規登録・カラーバリエーション一括登録(2.22参照)の両方から呼び出す。
  const insertNewProductCore = async (item) => {
    // ★2026-08-23: 直接支払い(ウォレットを使わない仕入れ)はウォレット残高を一切見ない(2.46参照)
    const source = costSourceOf(item);
    const totalNeeded = (item.purchase_amount_cny || 0) + (item.shipping_cny || 0) + (item.fee_cny || 0) + (item.domestic_shipping_cny || 0);
    if (source === COST_SOURCE_WALLET) {
      const balance = await getWalletRemainingTotal();
      if (!balance.ok) return { ok: false, message: "ウォレット残高の確認に失敗しました" };
      if (balance.total < totalNeeded) {
        return { ok: false, message: `ウォレット残高が不足しています(必要額: ${totalNeeded.toFixed(2)} CNY / 残高: ${balance.total.toFixed(2)} CNY)。先にチャージを追加してください。` };
      }
    }

    const { data: inserted, error } = await supabase.from("products").insert({
      type: item.type,
      status: item.status,
      sample_purpose: item.type === "sample" ? (item.sample_purpose || "展示用") : null,
      product_image_url: item.product_image_url,
      product_url: item.product_url,
      product_code: item.product_code,
      product_name: item.product_name,
      category: item.category,
      size: item.size,
      size_options: item.size_options,
      selling_price_jpy: item.selling_price_jpy,
      purchase_date: item.purchase_date,
      batch_id: item.batch_id,
      purchase_amount_cny: item.purchase_amount_cny,
      shipping_cny: item.shipping_cny,
      fee_cny: item.fee_cny,
      domestic_shipping_cny: item.domestic_shipping_cny || 0,
      cost_source: source,
      estimated_purchase_cny: item.estimated_purchase_cny != null ? item.estimated_purchase_cny : null,
      // 直接支払いは入力されたJPYをそのまま確定額として保存する(ウォレット消化なし)
      ...(source !== COST_SOURCE_WALLET ? {
        purchase_amount_jpy: Number(item.purchase_amount_jpy) || 0,
        shipping_jpy: Number(item.shipping_jpy) || 0,
        fee_jpy: Number(item.fee_jpy) || 0,
        domestic_shipping_jpy: Number(item.domestic_shipping_jpy) || 0,
      } : {}),
    }).select("id").single();

    if (error || !inserted) return { ok: false, message: `${item.product_name}: 登録に失敗しました` };
    if (source !== COST_SOURCE_WALLET) return { ok: true };

    const consumeRes = await consumeAndFinalize(inserted.id, {
      purchaseCny: item.purchase_amount_cny,
      shippingCny: item.shipping_cny,
      feeCny: item.fee_cny,
      domesticShippingCny: item.domestic_shipping_cny || 0,
    });
    if (!consumeRes.ok) {
      return { ok: true, warning: `${item.product_name}: 登録は完了しましたが、ウォレット消化処理でエラーが発生しました(${consumeRes.message})。チャージ台帳・商品情報をご確認ください。` };
    }
    return { ok: true };
  };

  const handleSaveProduct = async (form) => {
    // ★2026-07-10実装: カラーバリエーション一括登録(ProductFormModalでAI検出した色を複数選択した場合)
    if (form.multiItems) {
      const messages = [];
      for (const item of form.multiItems) {
        const res = await insertNewProductCore(item);
        if (!res.ok) messages.push(res.message);
        else if (res.warning) messages.push(res.warning);
      }
      if (messages.length > 0) alert(messages.join("\n"));
      // ★2026-08-24: カラバリ一括でも、1点でも登録できていれば「再仕入れ検討」から外す(2.31参照)
      await markReorderDecided();
      setModalProduct(null);
      loadAll();
      return;
    }

    if (form.id) {
      // 編集: 共通関数(updateProductCore)に委譲。CNY金額の変更検知・ウォレット再消化はそちら側で行う。
      const res = await updateProductCore(form, modalProduct);
      if (!res.ok) { alert(res.message); return; }
      if (res.warning) alert(res.warning);
      setModalProduct(null);
      loadAll();
      if (codeSearchResult !== null) handleCodeSearch(); // 商品番号検索経由で開いていた場合、検索結果も更新
      return;
    }

    // 通常の単品新規登録
    const res = await insertNewProductCore(form);
    if (!res.ok) { alert(res.message); return; }
    if (res.warning) alert(res.warning);

    // ★2026-08-24: 登録できて初めて「再仕入れ検討」から外す(2.31参照)
    await markReorderDecided();
    setModalProduct(null);
    loadAll();
  };

  const handleDeleteProduct = async (product) => {
    // ★2026-08-04実装: catalog_items.product_idはON DELETE RESTRICTのため、掲載中のカタログが
    //   あると削除が失敗する。事前にどのカタログに載っているか調べ、外した上で削除するか
    //   まとめて確認できるようにする(2.31参照)
    const { data: catalogRows, error: catalogErr } = await supabase
      .from("catalog_items")
      .select("id,catalogs(name)")
      .eq("product_id", product.id);
    if (catalogErr) { alert("カタログ掲載状況の確認に失敗しました"); return; }

    const catalogNames = (catalogRows || []).map((r) => (r.catalogs ? r.catalogs.name : null)).filter(Boolean);
    const hasConsumption = consumedProductIds.has(product.id);

    let confirmMsg;
    if (catalogNames.length > 0) {
      confirmMsg = `この商品は以下のカタログに掲載されています:\n・${catalogNames.join("\n・")}\n\nカタログから外した上で削除しますか?`;
    } else {
      confirmMsg = hasConsumption
        ? "この商品を削除しますか?仕入れにかかったウォレット消化額(CNY)は、消化元のチャージ残高へ自動的に払い戻されます。"
        : "この商品を削除しますか?";
    }
    if (!window.confirm(confirmMsg)) return;

    if (catalogRows && catalogRows.length > 0) {
      const { error: delCatalogErr } = await supabase.from("catalog_items").delete().eq("product_id", product.id);
      if (delCatalogErr) { alert("カタログからの削除に失敗しました"); return; }
    }

    if (hasConsumption) {
      const reverseRes = await reverseWalletConsumption(product.id);
      if (!reverseRes.ok) { alert(reverseRes.message); return; }
    }

    const { error } = await supabase.from("products").delete().eq("id", product.id);
    if (error) { alert("削除に失敗しました"); return; }
    loadAll();
  };

  const handleTogglePurpose = async (product) => {
    const next = product.sample_purpose === "処分用" ? "展示用" : "処分用";
    const { error } = await supabase.from("products").update({ sample_purpose: next }).eq("id", product.id);
    if (error) { alert("目的区分の切替に失敗しました"); return; }
    loadAll();
  };

  // 仕入れロットのINSERT本体(「仕入れロット」タブからの登録・商品登録モーダルからの
  // 「+ 新規ロット登録」の両方で共通利用する)。
  const createBatch = async (form) => {
    const { data, error } = await supabase.from("purchase_batches").insert(form).select().single();
    if (error || !data) return { ok: false, message: "ロットの登録に失敗しました" };
    return { ok: true, batch: data };
  };

  const handleSaveBatch = async (form) => {
    const res = await createBatch(form);
    if (!res.ok) { alert(res.message); return; }
    setModalBatch(false);
    loadAll();
  };

  /* ★2026-08-17変更: 既存の仕入れロットを編集する。
     従来は purchase_batches の行を書き換えるだけで、既に紐付いている商品の金額はそのままだったため、
     「ロットの国際送料を直したのに、1商品ごとの金額が変わらない」状態になっていた(2.35参照)。
     合計金額・総点数を変更した場合は、紐付け済みの商品へ配分し直すかどうかを確認する。 */
  const handleUpdateBatch = async (form) => {
    const { id, ...patch } = form;
    const before = editingBatch || {};
    const amountsChanged =
      (Number(patch.total_shipping_cny) || 0) !== (Number(before.total_shipping_cny) || 0) ||
      (Number(patch.total_fee_cny) || 0) !== (Number(before.total_fee_cny) || 0) ||
      (Number(patch.total_items) || 0) !== (Number(before.total_items) || 0);

    const { error } = await supabase.from("purchase_batches").update(patch).eq("id", id);
    if (error) { alert("ロットの更新に失敗しました"); return; }

    const linkedCount = usageCountByBatch[id] || 0;
    if (amountsChanged && linkedCount > 0) {
      const proceed = window.confirm(
        `このロットには既に${linkedCount}点の商品が紐付いています。\n\n` +
        `変更後の金額で、この${linkedCount}点の国際送料・その他手数料を配分し直しますか?\n\n` +
        `［OK］各商品の金額を上書きし、ウォレットの消化もやり直します(推奨)。\n` +
        `　　　商品側の合計がロット合計とぴったり一致します。\n` +
        `　　　※再消化はそのときのFIFO順で行うため、確定JPY原価が多少変わることがあります。\n\n` +
        `［キャンセル］ロットの数字だけ変更し、商品側は今の金額のまま残します。\n` +
        `　　　　　　　この場合、ロット合計と商品側の合計が食い違ったままになります。`
      );
      if (proceed) {
        const res = await reallocateBatchAmounts({ id, ...patch });
        if (!res.ok) {
          alert(res.message);
        } else if (res.messages && res.messages.length > 0) {
          alert(`${res.updated}点の金額を配分し直しました。\n\n以下は確認が必要です:\n${res.messages.join("\n")}`);
        } else if (res.updated === 0) {
          alert("配分し直す必要のある商品はありませんでした(各商品の金額は既に変更後の配分と一致しています)。");
        } else {
          alert(`${res.updated}点の国際送料・その他手数料を配分し直しました。`);
        }
      }
    }

    setEditingBatch(null);
    loadAll();
  };

  // 商品登録モーダル内の「+ 新規ロット登録」から呼ばれる。一覧(batches state)はバックグラウンドで
  // 更新しつつ、作成結果はモーダル側にもそのまま返して即座に選択・自動入力できるようにする。
  // ★2026-08-17実装: 仕入れロットの削除(2.35参照)
  const handleDeleteBatch = async (batch) => {
    const linked = usageCountByBatch[batch.id] || 0;
    const label = batch.name ? `${batch.name}(${batch.purchase_date})` : batch.purchase_date;
    const message = linked > 0
      ? `仕入れロット「${label}」を削除します。\n\n`
        + `このロットには${linked}点の商品が紐付いています。削除すると、その${linked}点の国際送料・その他手数料を0円に戻し、`
        + `消化済みのぶんをウォレットへ払い戻します(商品代・中国国内送料は1点ごとの費用のため、そのまま残ります)。\n\n`
        + `この操作は取り消せません。よろしいですか?`
      : `仕入れロット「${label}」を削除します。よろしいですか?`;
    if (!window.confirm(message)) return;

    setDeletingBatchId(batch.id);
    const res = await deleteBatchWithUnlink(batch);
    setDeletingBatchId(null);
    if (!res.ok) { alert(res.message); loadAll(); return; }
    if (res.messages && res.messages.length > 0) {
      alert(`ロットを削除しました(商品${res.unlinked}点の国際送料・その他手数料を0円に戻しました)。\n\n以下は確認が必要です:\n${res.messages.join("\n")}`);
    } else if (res.unlinked > 0) {
      alert(`ロットを削除し、商品${res.unlinked}点の国際送料・その他手数料を0円に戻しました。`);
    }
    loadAll();
  };

  const handleCreateBatchInline = async (form) => {
    const res = await createBatch(form);
    if (res.ok) loadAll();
    return res;
  };

  const handleSaveReturn = async (form) => {
    const src = returnTarget;
    const { error } = await supabase.from("products").insert({
      type: src.type,
      status: "未販売",
      product_image_url: src.product_image_url,
      product_url: src.product_url,
      product_code: src.product_code,
      product_name: src.product_name,
      category: src.category,
      size: src.size,
      size_options: src.size_options,
      selling_price_jpy: src.selling_price_jpy,
      purchase_date: src.purchase_date,
      return_date: form.return_date,
      return_source_product_id: src.id,

      purchase_amount_cny: 0,

      fee_cny: 0,
      domestic_shipping_cny: 0,
      purchase_amount_jpy: 0,
      shipping_jpy: 0,
      fee_jpy: 0,
      domestic_shipping_jpy: 0,
    });
    if (error) { alert("返品登録に失敗しました"); return; }
    setReturnTarget(null);
    loadAll();
  };

  return (
    <div className="px-4 md:px-6 py-6 md:py-8 max-w-5xl mx-auto w-full space-y-5">

          <button onClick={() => setView("batches")} className="px-3 py-2"

        {view === "list" ? (

              <option value="sample_display">サンプル: 展示用</option>

      {/* ★2026-08-04実装: 商品番号で直接検索して編集する機能。販売済み・返品済みなど、通常の一覧に

          <div className="flex gap-2">

      {products !== null && view === "list" && (
        filteredProducts.length === 0 ? (
          <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>該当する商品がありません</p>
        ) : (
          <div className="space-y-2">
            {filteredProducts.map((p) => (
              <ProductCard
                key={p.id}
                product={p}
                onEdit={(prod) => setModalProduct(prod)}

      {products !== null && view === "batches" && (
        <div className="space-y-3">
          {/* ★2026-08-18実装: BuckyDropの明細と突き合わせて差額を確認する(2.37参照) */}
          <BuckyDropReconcileCard batches={batches} />
          <BatchList batches={batches} usageCountByBatch={usageCountByBatch} onEdit={setEditingBatch} onDelete={handleDeleteBatch} deletingBatchId={deletingBatchId} />
        </div>
      )}

      {modalProduct && (
        <ProductFormModal
          product={modalProduct}
          batches={batches}
          /* ★2026-08-24: キャンセルしたら「再仕入れ検討」の持ち回りを破棄する。
             残したままだと、次に別の商品を新規登録したときに無関係な明細が判断済みになる(2.31参照)。

      {modalBatch && (
        <BatchFormModal onClose={() => setModalBatch(false)} onSave={handleSaveBatch} />
      )}
      {editingBatch && (

      )}
      {returnTarget && (
        <ReturnFormModal sourceProduct={returnTarget} onClose={() => setReturnTarget(null)} onSave={handleSaveReturn} />
      )}
    </div>
  );
}

/* ============================================================

     ・販売一覧・削除(削除時は商品を「未販売」へ自動復元)、編集(明細差分反映)
