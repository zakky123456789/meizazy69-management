/* ★2026-08-22追加: 配信中のHTMLがどのビルドかを画面左下に表示するための版数(2.41参照)。
   GitHub Pagesのキャッシュ等で「差し替えたつもりのファイルがまだ古い」ケースを、
   画面を見るだけで切り分けられるようにする。**コードを変更したら必ずこの値も更新すること。** */
const BUILD_VERSION = "2026-08-24l";

/* ★2026-08-24追加: 仕入原価を月次損益へ計上し始める日(2.45参照)。
   「その月に仕入れた商品の原価をその月の経費にする」方式へ切り替えた際、
   **過去に登録済みの全商品が遡って計上されてしまう**問題が起きた
   (7月に¥322,912、8月の報酬基準額が¥41,719→¥-281,072に転落した)。
   過去分は別途処理済みのため、計上開始日より前の仕入れは対象外とする。

   **商品の種類で開始日が違う**(2026-08-24にユーザーと確認):
   ・受注商品(created_via_sale = true。販売登録の「新規仕入で追加」由来のオーダー)
     … 8月分から計上する。
   ・サンプル・在庫(created_via_sale = false) … 8月28日分から計上する。

   ・この日より前のpurchase_dateを持つ商品は、どの月の仕入原価にも入らない。
   ・**handleCalculateMonthlyProfit と checkStaleMonthlyProfits の両方で必ず同じ値・同じ判定を使うこと**
     (片方だけだと、実際はズレていないのに毎回「古い」と警告が出続ける。2.37参照)。 */
const PURCHASE_COST_BASIS_FROM_ORDER = "2026-08-01";   // 受注商品(オーダー)
const PURCHASE_COST_BASIS_FROM_SAMPLE = "2026-08-28";  // サンプル・在庫
const PURCHASE_COST_BASIS_FROM_MIN =
  PURCHASE_COST_BASIS_FROM_ORDER < PURCHASE_COST_BASIS_FROM_SAMPLE
    ? PURCHASE_COST_BASIS_FROM_ORDER : PURCHASE_COST_BASIS_FROM_SAMPLE;

/* その商品を仕入原価として計上してよいか(計上開始日の判定)。
   種類ごとに開始日が違うため、必ずこの関数を通して判定すること。 */
function isPurchaseCostCountable(p) {
  const d = String((p || {}).purchase_date || "");
  if (!d) return false; // 仕入れ日が未入力の商品はどの月にも計上しない
  const from = p.created_via_sale ? PURCHASE_COST_BASIS_FROM_ORDER : PURCHASE_COST_BASIS_FROM_SAMPLE;
  return d >= from;
}

const ISSUER_INFO_DEFAULT = "〒012-0055\n秋田県湯沢市山田字荻生田26-2\nIMPORT PRIME合同会社\n08016592527";

/* ---- 領収書の金額計算(★2026-08-05変更: 消費税免税事業者のため、税抜・消費税額への分割をやめ、税込合計金額のみを扱う。
   関数名・戻り値のキー(subtotal/tax/total)はそのまま据え置いているが、subtotalはtotalと同値・taxは常に0になる点に注意。
   呼び出し側で内訳表示をしていた箇所は「合計金額」のみの表示に変更済み(2.3参照)。) ---- */
function calcReceiptTotals(totalInclJpy) {
  const total = Math.round(Number(totalInclJpy) || 0);
  return { subtotal: total, tax: 0, total };
}

/* ---- 明細1件分の利益計算用の金額(★2026-08-05: 消費税免税事業者のため、税抜換算せず税込単価をそのまま使用するよう変更。
   関数名・呼び出し箇所はitemPretaxJpyのまま据え置くが、中身は単純にunitPriceInclJpyを返すだけになっている点に注意) ---- */
function itemPretaxJpy(unitPriceInclJpy) {
  return Math.round(Number(unitPriceInclJpy) || 0);
}

/* ---- 商品の原価合計(商品代+国際送料+その他手数料+中国国内送料、JPY確定額) ---- */
function productCostJpy(p) {
  return (Number(p.purchase_amount_jpy) || 0) + (Number(p.shipping_jpy) || 0) + (Number(p.fee_jpy) || 0)
    + (Number(p.domestic_shipping_jpy) || 0); // ★2026-08-17: 中国国内送料を原価に算入(2.36参照)
}

/* ---- 商品の表示ラベル(「商品名 - サイズ」形式、sale_items設計に準拠) ---- */
function productLabel(p) {
  let label = p.product_name || "(名称未設定)";
  if (p.size) label += ` - ${p.size}`;
  if (p.product_code) label += `(No.${p.product_code})`;
  return label;
}

/* ---- 領収書番号の自動採番("2026-0001"形式、年度でリセット) ----
   ★2026-08-06実装: 他システムで先に発行した分と番号を合わせたい等のケースに対応するため、
   receipt_number_overrides(year, last_number)に手動で基準点を設定できるようにした。
   実際の採番は「receipts内の既存最大値」と「overridesの値」のうち大きい方を採用し、その+1を返す。 */
async function generateReceiptNumber(dateStr) {
  const year = (dateStr || todayISO()).slice(0, 4);
  const [{ data, error }, { data: overrideRow }] = await Promise.all([
    supabase.from("receipts").select("receipt_number").ilike("receipt_number", `${year}-%`),
    supabase.from("receipt_number_overrides").select("last_number").eq("year", year).maybeSingle(),
  ]);
  let maxNum = overrideRow ? overrideRow.last_number : 0;
  if (!error && data) {
    const re = new RegExp(`^${year}-(\\d+)$`);
    data.forEach((r) => {
      const m = re.exec(r.receipt_number || "");
      if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
    });
  }
  return `${year}-${String(maxNum + 1).padStart(4, "0")}`;
}

/* ---- 領収書PDFのファイル名生成 ★2026-08-06実装 ----
   電子帳簿保存法の検索要件(取引年月日・取引金額・取引先)を満たす形式で統一する。
   「取引先」は社内管理用のホストクラブ名ではなく、相手にもファイルを渡すことを考慮し、
   実際の請求・受領先である領収書の宛名(recipient_name)を使う。
   例: "20260806_SDK（株）_148000円_領収書_2026-0042" */
function buildReceiptFileName(receipt, fallbackName) {
  const date = (receipt.issue_date || "").replace(/-/g, "");
  const rawName = (receipt.recipient_name || fallbackName || "宛先未設定").trim();
  // ファイル名に使えない/紛らわしい記号だけ除去する(スラッシュ・コロン等)
  const safeName = rawName.replace(/[\\/:*?"<>|]/g, "");
  const amount = receipt.total_jpy != null ? Math.round(Number(receipt.total_jpy)) : 0;
  return `${date}_${safeName}_${amount}円_領収書_${receipt.receipt_number}`;
}

/* ---- HTML文字列組み立て用のエスケープ ★2026-08-14実装 ---- */
function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---- 領収書印刷用の完全に独立した静的HTMLドキュメントを組み立てる ★2026-08-14実装 ----
   別タブでこれだけを開いて印刷することで、アプリ本体(ダーク背景・長いスクロール領域等)を
   一切巻き込まずに済むようにする(iOS Safari等でのヘッダー/フッター・黒塗り対策)。 */
function buildReceiptPrintHtml(receipt, items, clubName) {
  const rows = items.map((it) => `
    <tr>
      <td style="padding:4px 0;">${escapeHtml(saleItemLabel(it))}</td>
      <td style="padding:4px 0; text-align:right; white-space:nowrap;">${escapeHtml(fmtJPY(it.unit_price_jpy))}</td>
    </tr>`).join("");

  const itemsTable = items.length > 0 ? `
    <table style="width:100%; font-size:12px; border-collapse:collapse; margin-bottom:16px;">
      <thead>
        <tr style="border-bottom:1px solid #ccc;">
          <th style="text-align:left; padding:4px 0;">品名</th>
          <th style="text-align:right; padding:4px 0;">金額</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>` : "";

  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(buildReceiptFileName(receipt, clubName))}</title>
<style>
  @page { margin: 10mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    color: #1a1710; padding: 24px;
  }
  .title { font-size: 22px; font-weight: 700; margin: 0; }
  .recipient { font-size: 16px; display: inline-block; border-bottom: 1px solid #1a1710; padding-bottom: 2px; margin-top: 20px; }
  .amount { font-size: 24px; font-weight: 700; margin: 16px 0 0; }
  .small { font-size: 12px; margin-top: 4px; }
  .header-right { text-align: right; font-size: 12px; max-width: 220px; }
  .issuer-box { margin-top: 12px; padding-top: 8px; border-top: 1px solid #ccc; text-align: left; }
  .issuer-label { color: #888; margin: 0 0 4px; }
  .issuer-info { color: #555; white-space: pre-line; margin: 0; }
  .totals { font-size: 12px; border-top: 1px solid #ccc; padding-top: 8px; }
  .totals-row { display: flex; justify-content: space-between; }
  @media print {
    body { padding: 0; }
  }
</style>
</head>
<body>
  <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px;">
    <div>
      <p class="title">領収書</p>
      <p class="recipient">${escapeHtml(receipt.recipient_name || clubName)} ${escapeHtml(receipt.honorific || "様")}</p>
      <p class="amount">${escapeHtml(fmtJPY(receipt.total_jpy))} -</p>
      <p class="small">但し ${escapeHtml(receipt.memo || "衣装代")} として</p>
      <p class="small">${receipt.payment_type === "振込" ? "振込にて受領しました。" : "現金にて受領しました。"}</p>
    </div>
    <div class="header-right">
      <p style="margin:0;">No. ${escapeHtml(receipt.receipt_number)}</p>
      <p style="margin:0;">受領日: ${escapeHtml(receipt.received_date || receipt.issue_date)}</p>
      <p style="margin:0;">発行日: ${escapeHtml(receipt.issue_date)}</p>
      <div class="issuer-box">
        <p class="issuer-label">発行者</p>
        <p class="issuer-info">${escapeHtml(receipt.issuer_info)}</p>
      </div>
    </div>
  </div>
  ${itemsTable}
  <div class="totals">
    <div class="totals-row"><span>合計点数</span><span>${items.length}点</span></div>
    <div class="totals-row" style="font-weight:700;"><span>合計金額</span><span>${escapeHtml(fmtJPY(receipt.total_jpy))}</span></div>
  </div>
</body>
</html>`;
}

/* ---- 外注費請求書番号の自動採番(generateInvoiceNumber) ----
   receiptsと同じ考え方で年ごとにリセットする連番だが、領収書番号と混同しないよう
   "INV-{年}-{4桁連番}"形式にする(例: INV-2026-0001)。 */
async function generateInvoiceNumber(dateStr) {
  const year = (dateStr || todayISO()).slice(0, 4);
  const { data, error } = await supabase
    .from("contractor_invoices")
    .select("invoice_number")
    .ilike("invoice_number", `INV-${year}-%`);
  if (error || !data) return `INV-${year}-0001`;
  let maxNum = 0;
  const re = new RegExp(`^INV-${year}-(\\d+)$`);
  data.forEach((r) => {
    const m = re.exec(r.invoice_number || "");
    if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
  });
  return `INV-${year}-${String(maxNum + 1).padStart(4, "0")}`;
}

/* ---- 販売登録モーダル ----
   ・ホストクラブ/ホスト選択 → 未販売商品を検索して複数点まとめて追加
   ・単価はselling_price_jpyを初期値に編集可(値引き等に対応)
   ・quantityは常に1(products1登録=1点のため、複数点は複数sale_item行で表現) */
/* ============================================================
   販売画面からの「新規仕入対応」フロー
   ・訪問時に持って行ったサンプルが気に入られたが在庫がない場合など、
     販売登録のその場で新しい商品(type: "stock")を仕入れ確定させ、
     即座に販売明細へ追加するためのモーダル。
   ・参考サンプル(既存のsample商品)を検索して選ぶと、
     product_url / product_name / category / size_options / 参考販売価格を自動引き継ぎ。
     サイズ・仕入原価(CNY)は必ずこの1点ごとに都度入力する。
   ・登録と同時にウォレット(agent_charges)からFIFO消化(consumeAndFinalizeProductCost)。
   ============================================================ */
function NewPurchaseModal({ batches, onClose, onCreated }) {
  const [referenceSearch, setReferenceSearch] = useState("");
  const [references, setReferences] = useState(null); // null = 読み込み中
  const [selectedRefId, setSelectedRefId] = useState(null);

  const [productImageUrl, setProductImageUrl] = useState("");
  const [productUrl, setProductUrl] = useState("");
  const [productCode, setProductCode] = useState("");
  const [productName, setProductName] = useState("");
  const [category, setCategory] = useState("");
  const [sizeOptionsText, setSizeOptionsText] = useState("");
  const [size, setSize] = useState("");
  const [sellingPriceJpy, setSellingPriceJpy] = useState("");
  const [purchaseDate, setPurchaseDate] = useState(todayISO());
  const [batchId, setBatchId] = useState("");
  const [purchaseAmountCny, setPurchaseAmountCny] = useState("");
  /* ★2026-08-23: 支払い経路(2.46参照)。直接支払いのときはウォレットを使わずJPYを手入力する。 */
  const [costSource, setCostSource] = useState(COST_SOURCE_WALLET);
  const [purchaseAmountJpy, setPurchaseAmountJpy] = useState("");
  const [shippingJpy, setShippingJpy] = useState("");
  const [feeJpy, setFeeJpy] = useState("");
  const [domesticShippingJpy, setDomesticShippingJpy] = useState("");
  const [shippingCny, setShippingCny] = useState("");
  const [feeCny, setFeeCny] = useState("");
  // ★2026-08-17実装: 中国国内送料(1点ごと。ロットの按分対象外)。2.36参照
  const [domesticShippingCny, setDomesticShippingCny] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);

  // 参考サンプル候補(type: "sample")を取得。ステータスは問わない(あくまで名称・URL等の参照元のため)
  useEffect(() => {
    let cancelled = false;
    supabase
      .from("products")
      .select("id,product_name,category,product_url,product_image_url,product_code,size_options,selling_price_jpy")
      .eq("type", "sample")
      .order("product_name")
      .then(({ data, error }) => {
        if (cancelled) return;
        setReferences(error ? [] : (data || []));
      });
    return () => { cancelled = true; };
  }, []);

  // 新規商品(在庫)の商品番号を自動採番("P-0001"形式、手動編集可)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const code = await generateNextProductCode("stock");
      if (!cancelled) setProductCode(code);
    })();
    return () => { cancelled = true; };
  }, []);

  const referenceCandidates = useMemo(() => {
    if (!references) return [];
    const q = referenceSearch.trim().toLowerCase();
    return references.filter((p) => {
      if (!q) return true;
      return (p.product_name || "").toLowerCase().includes(q) || (p.product_code || "").toLowerCase().includes(q);
    });
  }, [references, referenceSearch]);

  const sizeOptionsList = useMemo(() => {
    return sizeOptionsText.split(/[\/,、]/).map((s) => s.trim()).filter(Boolean);
  }, [sizeOptionsText]);

  const handleSelectReference = (ref) => {
    setSelectedRefId(ref.id);
    setProductImageUrl(ref.product_image_url || "");
    setProductUrl(ref.product_url || "");
    setProductName(ref.product_name || "");
    setCategory(ref.category || "");
    setSizeOptionsText(ref.size_options || "");
    setSellingPriceJpy(ref.selling_price_jpy != null ? String(ref.selling_price_jpy) : "");
    setSize(""); // サイズはこの1点用に都度選び直す
  };

  const clearReference = () => {
    setSelectedRefId(null);
    setProductImageUrl("");
    setProductUrl("");
    setProductName("");
    setCategory("");
    setSizeOptionsText("");
    setSellingPriceJpy("");
    setSize("");
  };

  const handleBatchChange = async (id) => {
    setBatchId(id);
    if (!id) return;
    const b = batches.find((x) => x.id === id);
    if (b) {
      const amounts = await computeBatchItemAmounts(b, null);
      setShippingCny(String(amounts.shipping));
      setFeeCny(String(amounts.fee));
    }
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError(null);
    if (!productName.trim()) { setError("商品名を入力してください"); return; }
    if (!size.trim()) { setError("この1点の実サイズを入力してください"); return; }
    if (!purchaseDate) { setError("仕入れ日を入力してください"); return; }

    const purchaseCny = parseFloat(purchaseAmountCny) || 0;
    const shippingCnyVal = parseFloat(shippingCny) || 0;
    const feeCnyVal = parseFloat(feeCny) || 0;
    const domesticShippingCnyVal = parseFloat(domesticShippingCny) || 0;
    const totalNeeded = purchaseCny + shippingCnyVal + feeCnyVal + domesticShippingCnyVal;

    setSaving(true);

    // 事前にウォレット残高を確認(部分消化を避けるため、ProductsPageの新規仕入登録と同じ方針)
    // ★2026-08-23: 直接支払いはウォレットを使わないため、この確認自体を行わない(2.46参照)
    if (costSource === COST_SOURCE_WALLET) {
      const balance = await getWalletRemainingTotal();
      if (!balance.ok) { setError("ウォレット残高の確認に失敗しました"); setSaving(false); return; }
      if (balance.total < totalNeeded) {
        setError(`ウォレット残高が不足しています(必要額: ${totalNeeded.toFixed(2)} CNY / 残高: ${balance.total.toFixed(2)} CNY)。先にチャージを追加してください。`);
        setSaving(false);
        return;
      }
    }

    const { data: inserted, error: insertErr } = await supabase.from("products").insert({
      type: "stock",
      status: "未販売",
      // ★2026-08-04実装: 販売登録からの「新規仕入で追加」由来の商品であることを示すフラグ。
      //   サンプル・在庫の一覧や「在庫から追加」検索候補から除外し、代わりに販売登録ページの
      //   「仕入れ商品」タブで管理する(2.30参照)
      created_via_sale: true,
      product_image_url: productImageUrl || null,
      product_url: productUrl.trim() || null,
      product_code: productCode.trim() || null,
      product_name: productName.trim(),
      category: category.trim() || null,
      size: size.trim(),
      size_options: sizeOptionsText.trim() || null,
      selling_price_jpy: sellingPriceJpy ? parseFloat(sellingPriceJpy) : null,
      purchase_date: purchaseDate,
      batch_id: batchId || null,
      purchase_amount_cny: purchaseCny,
      shipping_cny: shippingCnyVal,
      fee_cny: feeCnyVal,
      domestic_shipping_cny: domesticShippingCnyVal,
      cost_source: costSource,
      // 直接支払いは入力されたJPYをそのまま確定原価として保存する(ウォレット消化なし)
      ...(costSource === COST_SOURCE_DIRECT ? {
        purchase_amount_jpy: parseFloat(purchaseAmountJpy) || 0,
        shipping_jpy: parseFloat(shippingJpy) || 0,
        fee_jpy: parseFloat(feeJpy) || 0,
        domestic_shipping_jpy: parseFloat(domesticShippingJpy) || 0,
      } : {}),
    }).select("id").single();

    if (insertErr || !inserted) { setError("商品の登録に失敗しました"); setSaving(false); return; }

    if (costSource === COST_SOURCE_WALLET) {
      const consumeRes = await consumeAndFinalizeProductCost(inserted.id, {
        purchaseCny, shippingCny: shippingCnyVal, feeCny: feeCnyVal, domesticShippingCny: domesticShippingCnyVal,
      });
      if (!consumeRes.ok) {
        setSaving(false);
        alert(`商品は登録されましたが、ウォレット消化処理でエラーが発生しました: ${consumeRes.message}\nチャージ台帳・商品情報をご確認ください。`);
        // 登録済み商品情報を渡して明細追加までは行う(在庫としては存在するため)
      }
    }

    // 確定後の商品情報(原価JPY確定額込み)を取得し、そのまま販売明細へ追加する
    const { data: finalProduct, error: fetchErr } = await supabase
      .from("products")
      .select("id,product_name,category,size,product_code,product_image_url,product_url,selling_price_jpy,purchase_amount_jpy,shipping_jpy,fee_jpy,domestic_shipping_jpy")
      .eq("id", inserted.id)
      .single();

    setSaving(false);
    if (fetchErr || !finalProduct) { setError("商品は登録されましたが、明細への反映に失敗しました。商品一覧からご確認ください。"); return; }

    onCreated(finalProduct);
  };

  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <form
        onSubmit={handleSubmit}
        className="w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[92vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <h2 className="font-display text-lg">新規仕入対応</h2>
        <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          在庫のない商品をその場で仕入れ確定し、このままこの販売の明細に追加します(ウォレットからFIFOで即時消化されます)。
        </p>

        {/* 参考サンプル検索 */}
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>参考サンプルを選ぶ(商品名・URL・カテゴリを自動引き継ぎ)</label>
          <input
            type="text" value={referenceSearch} onChange={(e) => setReferenceSearch(e.target.value)}
            placeholder="サンプルの商品名・商品番号で検索"
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent mb-2"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
          {references === null ? (
            <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
          ) : referenceCandidates.length === 0 ? (
            <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>該当するサンプルがありません</p>
          ) : (
            // ★2026-08-04実装: 「在庫から追加」・カタログ商品選択と同じ画像グリッド方式に変更。
            //   商品番号を明示的に表示(件数上限も撤廃・2.30参照)
            <div
              className="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-56 overflow-y-auto p-1.5 rounded-lg"
              style={{ border: "1px solid var(--mz-border)" }}
            >
              {referenceCandidates.map((p) => (
                <button
                  type="button" key={p.id} onClick={() => handleSelectReference(p)}
                  className="flex flex-col items-center gap-1 rounded-lg p-1.5 hover:bg-white/5 text-left"
                  style={{ border: p.id === selectedRefId ? "1px solid var(--mz-gold)" : "1px solid var(--mz-border)" }}
                >
                  <div className="relative w-full">
                    {p.product_image_url ? (
                      <img src={p.product_image_url} alt="" className="w-full aspect-square rounded-md object-cover" />
                    ) : (
                      <div className="w-full aspect-square rounded-md flex items-center justify-center text-[9px] text-center" style={{ background: "var(--mz-surface-hover)", color: "var(--mz-ink-muted)" }}>No Image</div>
                    )}
                    {p.id === selectedRefId && (
                      <span
                        className="absolute top-1 right-1 text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
                        style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                      >
                        選択中
                      </span>
                    )}
                  </div>
                  <span className="text-[10px] w-full truncate text-center" style={{ color: p.id === selectedRefId ? "var(--mz-gold-soft)" : "var(--mz-ink)" }}>
                    {p.product_name || "(名称未設定)"}
                  </span>
                  {p.product_code && (
                    <span className="text-[9px]" style={{ color: "var(--mz-ink-muted)" }}>No.{p.product_code}</span>
                  )}
                  {p.selling_price_jpy != null && (
                    <span className="text-[9px]" style={{ color: "var(--mz-ink-muted)" }}>{fmtJPY(p.selling_price_jpy)}</span>
                  )}
                </button>
              ))}
            </div>
          )}
          {selectedRefId && (
            <button type="button" onClick={clearReference} className="text-[11px] mt-1" style={{ color: "var(--mz-ink-muted)" }}>
              参照を解除して手入力に戻す
            </button>
          )}
        </div>

        <div className="pt-1" style={{ borderTop: "1px solid var(--mz-border)" }} />

        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>商品名</label>
          <input type="text" value={productName} onChange={(e) => setProductName(e.target.value)} required
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>カテゴリ</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)} required
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
              <option value="">選択してください</option>
              {CATEGORY_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>商品番号</label>
            <input type="text" value={productCode} onChange={(e) => setProductCode(e.target.value)}
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
          </div>
        </div>

        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>この1点の実サイズ(必須)</label>
          {sizeOptionsList.length > 0 ? (
            <select value={size} onChange={(e) => setSize(e.target.value)} required
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
              <option value="">選択してください</option>
              {sizeOptionsList.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          ) : (
            <input type="text" value={size} onChange={(e) => setSize(e.target.value)} placeholder="M / L / 42 / フリー" required
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
          )}
        </div>

        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>淘宝商品ページURL(任意)</label>
          <input type="text" value={productUrl} onChange={(e) => setProductUrl(e.target.value)}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
        </div>

        <div className="pt-1" style={{ borderTop: "1px solid var(--mz-border)" }} />

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>仕入れ日</label>
            <input type="date" value={purchaseDate} onChange={(e) => setPurchaseDate(e.target.value)} required
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
          </div>
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>仕入れロット(任意)</label>
            <select value={batchId} onChange={(e) => handleBatchChange(e.target.value)}

    e.preventDefault();
    if (!name.trim()) return;
    setSaving(true);
    setError(null);
    const { data: hostRow, error: hostError } = await supabase
      .from("hosts").insert({ host_club_id: hostClubId, name: name.trim() }).select("id,name").single();

        onCreated(hostRow); // ホスト自体は登録済みなので選択状態にはする

          <input type="checkbox" checked={addAddress} onChange={(e) => setAddAddress(e.target.checked)} />
          配送先も一緒に登録する

    return () => { cancelled = true; };
  }, []);

  // ホストクラブ変更時にホスト一覧を再取得。編集モードで最初から選択済みのホストは、
  // そのクラブのホスト一覧に含まれていれば維持し、含まれていなければクリアする。
  useEffect(() => {
    if (!hostClubId) { setHosts([]); setHostId(""); return; }
    let cancelled = false;
    supabase.from("hosts").select("id,name").eq("host_club_id", hostClubId).order("name").then(({ data, error }) => {
      if (cancelled) return;
      const list = error ? [] : (data || []);
      setHosts(list);
      setHostId((prev) => (list.some((h) => h.id === prev) ? prev : ""));
    });
    return () => { cancelled = true; };
  }, [hostClubId]);

  // ★2026-08-06実装: 宛名を手動編集していない場合のみ、ホスト/クラブ選択に合わせて宛名候補を自動提案する
  useEffect(() => {
    if (recipientNameTouched) return;
    const club = clubs.find((c) => c.id === hostClubId);
    const host = hosts.find((h) => h.id === hostId);
    setRecipientNameInput(host ? host.name : (club ? club.name : ""));
  }, [hostClubId, hostId, hosts, clubs, recipientNameTouched]);

  const selectedIds = useMemo(() => new Set(items.map((it) => it.productId)), [items]);

  const candidates = useMemo(() => {
    if (!unsoldProducts) return [];
    return unsoldProducts.filter((p) => {
      if (selectedIds.has(p.id)) return false;
      if (!searchText.trim()) return true;
      const q = searchText.trim().toLowerCase();
      return (p.product_name || "").toLowerCase().includes(q) || (p.product_code || "").toLowerCase().includes(q);
    });
  }, [unsoldProducts, selectedIds, searchText]);

  const addItem = (product, isNewPurchase = false) => {
    // ★2026-08-04実装: 「在庫から追加」で売れた展示用サンプル(処分用は対象外)は、
    //   後で再仕入れするかどうかを「再仕入れ検討」タブで判断できるようタグ付けする(2.31参照)
    const isReorderCandidate = !isNewPurchase && product.type === "sample" && (product.sample_purpose || "展示用") === "展示用";
    setItems((prev) => [...prev, {
      productId: product.id,
      product,
      unitPrice: product.selling_price_jpy != null ? String(product.selling_price_jpy) : "",
      isNewPurchase,
      isReorderCandidate,
      reorderDecided: false,
    }]);
    setSearchText("");
  };

  // 新規仕入対応モーダルで商品が仕入れ確定された時: そのままこの販売の明細に追加する
  // ★2026-07-19実装: 発注リマインド表示のため isNewPurchase: true でタグ付けする
  const handleProductCreated = (product) => {
    addItem(product, true);
    setNewPurchaseOpen(false);
  };
  const removeItem = (productId) => setItems((prev) => prev.filter((it) => it.productId !== productId));
  const updateUnitPrice = (productId, value) => setItems((prev) => prev.map((it) => (it.productId === productId ? { ...it, unitPrice: value } : it)));

  const totalInclJpy = items.reduce((sum, it) => sum + (parseFloat(it.unitPrice) || 0), 0); // 単価は税込のため、単純合計が税込合計になる
  const totals = calcReceiptTotals(totalInclJpy);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError(null);
    if (!hostClubId) { setError("ホストクラブを選択してください"); return; }
    if (items.length === 0) { setError("商品を1点以上追加してください"); return; }
    if (items.some((it) => it.unitPrice === "" || isNaN(parseFloat(it.unitPrice)) || parseFloat(it.unitPrice) < 0)) {
      setError("単価をすべて正しく入力してください");
      return;
    }

    const club = clubs.find((c) => c.id === hostClubId);
    const host = hosts.find((h) => h.id === hostId);
    // ★2026-08-06実装: 手入力があればそれを優先し、未入力ならホスト/クラブ名にフォールバックする
    const recipientName = recipientNameInput.trim() || (host ? host.name : (club ? club.name : ""));

    setSaving(true);
    const ok = await onSave({
      id: sale ? sale.id : null,
      transaction_date: transactionDate,
      host_club_id: hostClubId,
      host_id: hostId || null,
      recipient_name: recipientName,
      honorific: honorific || "様",
      memo: memo.trim() || "衣装代",
      received_date: receivedDate || transactionDate,
      payment_type: paymentType || "現金",
      items: items.map((it) => ({
        product_id: it.productId,
        unit_price_jpy: parseFloat(it.unitPrice),
        cost_jpy: productCostJpy(it.product),
        is_new_purchase: !!it.isNewPurchase,
        order_confirmed: !!it.orderConfirmed,
        reorder_candidate: !!it.isReorderCandidate,
        reorder_decided: !!it.reorderDecided,
      })),
    });
    setSaving(false);
    if (!ok) return; // onSave側でエラー表示済み。モーダルは開いたままにして再試行可能にする
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <form
        onSubmit={handleSubmit}
        className="w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[92vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <h2 className="font-display text-lg">{isEdit ? "販売記録を編集" : "販売登録"}</h2>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>取引日</label>
            <input type="date" value={transactionDate} onChange={(e) => setTransactionDate(e.target.value)} required
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
          </div>
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <label className="block text-xs" style={{ color: "var(--mz-ink-muted)" }}>ホストクラブ</label>
              <button type="button" onClick={() => setShowAddClub(true)} className="text-xs" style={{ color: "var(--mz-gold-soft)" }}>+新規</button>
            </div>
            <select value={hostClubId} onChange={(e) => setHostClubId(e.target.value)} required
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
              <option value="">選択してください</option>
              {clubOptions.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-1.5">
            <label className="block text-xs" style={{ color: "var(--mz-ink-muted)" }}>ホスト(任意)</label>
            <button type="button" onClick={() => setShowAddHost(true)} disabled={!hostClubId} className="text-xs disabled:opacity-40" style={{ color: "var(--mz-gold-soft)" }}>+新規</button>
          </div>
          <select value={hostId} onChange={(e) => setHostId(e.target.value)} disabled={!hostClubId}
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent disabled:opacity-50" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
            <option value="">指定なし(クラブ宛)</option>
            {hosts.map((h) => <option key={h.id} value={h.id}>{h.name}</option>)}
          </select>
        </div>

        {/* ★2026-08-06実装: 領収書の宛名・敬称・但し書き。未編集ならホスト/クラブ名が自動で入る */}
        <div className="grid grid-cols-3 gap-3">
          <div className="col-span-2">
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>宛名(領収書用)</label>
            <input
              type="text" value={recipientNameInput}
              onChange={(e) => { setRecipientNameTouched(true); setRecipientNameInput(e.target.value); }}
              placeholder="未入力ならホスト/クラブ名が自動で入ります"
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
              style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
            />
          </div>
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>敬称</label>
            <select value={honorific} onChange={(e) => setHonorific(e.target.value)}
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
              <option value="様">様</option>
              <option value="御中">御中</option>
            </select>
          </div>
        </div>
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>但し書き(領収書用)</label>
          <input
            type="text" value={memo} onChange={(e) => setMemo(e.target.value)}
            placeholder="衣装代"
            className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
          />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>受領日(領収書用)</label>
            <input type="date" value={receivedDate} onChange={(e) => setReceivedDate(e.target.value)}
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }} />
          </div>
          <div>
            <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>受領方法</label>
            <select value={paymentType} onChange={(e) => setPaymentType(e.target.value)}
              className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
              <option value="現金">現金</option>
              <option value="振込">振込</option>
            </select>
          </div>
        </div>

        <div className="pt-1" style={{ borderTop: "1px solid var(--mz-border)" }} />

        {/* 商品追加: 新規仕入をデフォルトの動線に、既存在庫からの追加はサブ(折りたたみ)にする ★2026-07-12実装(2.23参照) */}
        <div>
          <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>商品を追加</label>

          <button
            type="button" onClick={() => setNewPurchaseOpen(true)}
            className="w-full rounded-lg py-2.5 text-sm font-medium mb-2"
            style={{ background: "var(--mz-gold)", color: "#1a1710" }}
          >
            + 新規仕入で追加(サンプルの受注が決まった場合)
          </button>

          <button
            type="button" onClick={() => setStockSearchOpen((v) => !v)}
            className="w-full text-xs px-2.5 py-2 rounded-lg text-center"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
          >
            {stockSearchOpen ? "在庫から追加を閉じる ▲" : "在庫から追加(手元にある未販売商品を売る場合) ▼"}
          </button>

          {stockSearchOpen && (
            <div className="mt-2 space-y-2">
              <input
                type="text" value={searchText} onChange={(e) => setSearchText(e.target.value)}
                placeholder="商品名・商品番号で検索"
                className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
                style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
              />
              {unsoldProducts === null ? (
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
              ) : candidates.length === 0 ? (
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>該当する未販売商品がありません</p>
              ) : (
                // ★2026-08-04実装: カタログの商品選択と同じ画像グリッド方式に変更(件数上限も撤廃・2.30参照)
                <div
                  className="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-72 overflow-y-auto p-1.5 rounded-lg"
                  style={{ border: "1px solid var(--mz-border)" }}
                >
                  {candidates.map((p) => (
                    <button
                      key={p.id} type="button" onClick={() => addItem(p)}
                      className="flex flex-col items-center gap-1 rounded-lg p-1.5 hover:bg-white/5 text-left"
                      style={{ border: "1px solid var(--mz-border)" }}
                    >
                      <div className="relative w-full">
                        {p.product_image_url ? (
                          <img src={p.product_image_url} alt="" className="w-full aspect-square rounded-md object-cover" />
                        ) : (
                          <div className="w-full aspect-square rounded-md flex items-center justify-center text-[9px] text-center" style={{ background: "var(--mz-surface-hover)", color: "var(--mz-ink-muted)" }}>No Image</div>
                        )}
                        {p.type === "sample" && p.sample_purpose === "処分用" && (
                          <span
                            className="absolute top-1 left-1 text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
                            style={{ background: "#3a2a1f", color: "#d6a98f", border: "1px solid rgba(0,0,0,0.3)" }}
                          >
                            処分用
                          </span>
                        )}
                      </div>
                      <span className="text-[10px] w-full truncate text-center">{p.product_name || "(名称未設定)"}{p.size ? ` - ${p.size}` : ""}</span>
                      {p.product_code && (
                        <span className="text-[9px]" style={{ color: "var(--mz-ink-muted)" }}>No.{p.product_code}</span>
                      )}
                      {p.selling_price_jpy != null && (
                        <span className="text-[9px]" style={{ color: "var(--mz-ink-muted)" }}>{fmtJPY(p.selling_price_jpy)}</span>
                      )}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        {/* 選択済み明細 */}
        <div className="space-y-2">
          {items.length === 0 ? (
            <p className="text-xs text-center py-4" style={{ color: "var(--mz-ink-muted)" }}>商品が追加されていません</p>
          ) : (
            items.map((it) => (
              <div key={it.productId} className="rounded-lg p-3 flex items-center gap-2" style={{ background: "var(--mz-surface-hover)" }}>
                {it.product.product_image_url ? (
                  <img src={it.product.product_image_url} alt="" className="w-9 h-9 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
                ) : (
                  <div className="w-9 h-9 rounded-md shrink-0 flex items-center justify-center text-[8px] text-center" style={{ background: "var(--mz-bg)", color: "var(--mz-ink-muted)" }}>No Image</div>
                )}
                <span className="flex-1 min-w-0 text-xs truncate">{productLabel(it.product)}</span>
                <input
                  type="number" min="0" step="1" value={it.unitPrice}
                  onChange={(e) => updateUnitPrice(it.productId, e.target.value)}
                  placeholder="税込単価"
                  className="w-24 rounded-lg px-2 py-1.5 text-xs bg-transparent shrink-0"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                />
                {/* ★2026-08-04実装: この商品の仕入金額・仕入れロットを直接編集できるようにする(2.30参照) */}
                <button
                  type="button" onClick={() => openCostEdit(it.productId)} disabled={costEditLoading}
                  className="text-xs shrink-0" style={{ color: "var(--mz-gold-soft)" }}
                >
                  仕入編集
                </button>
                <button type="button" onClick={() => removeItem(it.productId)} className="text-xs shrink-0" style={{ color: "#f2b8bd" }}>削除</button>
              </div>
            ))
          )}
        </div>


        {items.length > 0 && (
          <div className="rounded-lg p-3 text-xs space-y-1" style={{ background: "var(--mz-surface-hover)" }}>
            <div className="flex justify-between font-medium"><span>合計金額</span><span style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(totals.total)}</span></div>
          </div>
        )}

        {error && (
          <p className="text-sm rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>
        )}

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="flex-1 rounded-lg py-2.5 text-sm" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>キャンセル</button>
          <button type="submit" disabled={saving} className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-60" style={{ background: "var(--mz-gold)", color: "#1a1710" }}>
            {saving ? "保存中..." : (isEdit ? "変更を保存" : "販売登録+領収書発行")}
          </button>
        </div>
      </form>

      {newPurchaseOpen && (
        <NewPurchaseModal
          batches={batches}
          onClose={() => setNewPurchaseOpen(false)}
          onCreated={handleProductCreated}
        />
      )}

      {costEditProduct && (
        <ProductFormModal
          product={costEditProduct}
          batches={batches}
          onClose={() => setCostEditProduct(null)}
          onSave={handleSaveCostEdit}
          onCreateBatch={async (form) => {
            const { data, error: batchErr } = await supabase.from("purchase_batches").insert(form).select().single();
            if (batchErr || !data) return { ok: false, message: "ロットの登録に失敗しました" };
            return { ok: true, batch: data };
          }}
        />
      )}

      {showAddClub && (
        <QuickAddClubModal
          onClose={() => setShowAddClub(false)}
          onCreated={(newClub) => {
            setExtraClubs((prev) => [...prev, newClub]);
            setHostClubId(newClub.id);
            setShowAddClub(false);
          }}
        />
      )}
      {showAddHost && (
        <QuickAddHostModal
          hostClubId={hostClubId}
          onClose={() => setShowAddHost(false)}
          onCreated={(newHost) => {
            setHosts((prev) => [...prev, newHost].sort((a, b) => a.name.localeCompare(b.name, "ja")));
            setHostId(newHost.id);
            setShowAddHost(false);
          }}
        />
      )}
    </div>
  );
}

/* ---- 販売カード(一覧) ---- */
/* ---- 販売明細1行の表示ラベル(商品名 - サイズ(No.商品番号)) ---- */
function saleItemLabel(item) {
  const p = item.products || {};
  let label = p.product_name || "(名称未設定)";
  if (p.size) label += ` - ${p.size}`;
  if (p.product_code) label += `(No.${p.product_code})`;
  return label;
}

/* ---- 領収書プレビュー・印刷モーダル ----
   ・saleに紐づくreceipts行(sale_idで検索)を取得し、実際の領収書レイアウトで表示。
   ・「印刷 / PDFとして保存(別タブで開く)」ボタンで、window.open()で新しい空のタブを開き、
     buildReceiptPrintHtml()で組み立てた領収書だけの独立した静的HTMLを書き込んでから、
     そのタブでwindow.print()を呼び出す。★2026-08-14実装
     (アプリ本体(ダーク背景・長いスクロール領域)を同一タブ内でCSSで隠す方式だと、
      iOS Safari等でブラウザ標準のヘッダー/フッターが消せない・背景が黒く出る等の
      問題が解消しきれなかったため、印刷対象を物理的に別タブへ分離する方式にした)
   ------------------------------------------------------------ */
/* ---- 領収書の中身(画面プレビュー用) ---- */
function ReceiptDocument({ receipt, items, clubName }) {
  return (
    <div className="rounded-xl p-6" style={{ background: "#ffffff", color: "#1a1710" }}>
      <div className="flex items-start justify-between mb-6">
        <div>
          <h3 className="font-display" style={{ fontSize: "22px" }}>領収書</h3>
          <p className="text-base mt-5" style={{ borderBottom: "1px solid #1a1710", display: "inline-block", paddingBottom: "2px" }}>
            {receipt.recipient_name || clubName} {receipt.honorific || "様"}
          </p>
          <div className="mt-4">
            <p className="font-display" style={{ fontSize: "24px" }}>{fmtJPY(receipt.total_jpy)} -</p>
            <p className="text-xs mt-1">但し {receipt.memo || "衣装代"} として</p>
            <p className="text-xs mt-1">{receipt.payment_type === "振込" ? "振込にて受領しました。" : "現金にて受領しました。"}</p>
          </div>
        </div>
        <div className="text-right text-xs" style={{ maxWidth: "220px" }}>
          <p>No. {receipt.receipt_number}</p>
          <p>受領日: {receipt.received_date || receipt.issue_date}</p>
          <p>発行日: {receipt.issue_date}</p>
          <div className="mt-3 pt-2 text-left" style={{ borderTop: "1px solid #ccc" }}>
            <p className="mb-1" style={{ color: "#888" }}>発行者</p>
            <p className="whitespace-pre-line" style={{ color: "#555" }}>{receipt.issuer_info}</p>
          </div>
        </div>
      </div>

      {items.length > 0 && (
        <table className="w-full text-xs mb-4" style={{ borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ borderBottom: "1px solid #ccc" }}>
              <th className="text-left py-1">品名</th>
              <th className="text-right py-1">金額</th>
            </tr>
          </thead>
          <tbody>
            {items.map((it) => (
              <tr key={it.id}>
                <td className="py-1">{saleItemLabel(it)}</td>
                <td className="text-right py-1">{fmtJPY(it.unit_price_jpy)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <div className="text-xs space-y-1 mb-6" style={{ borderTop: "1px solid #ccc", paddingTop: "8px" }}>
        <div className="flex justify-between"><span>合計点数</span><span>{items.length}点</span></div>
        <div className="flex justify-between font-medium"><span>合計金額</span><span>{fmtJPY(receipt.total_jpy)}</span></div>
      </div>
    </div>
  );
}

function ReceiptPreviewModal({ sale, onClose }) {
  const [receipt, setReceipt] = useState(null); // null=読込中, false=見つからない
  const [mergedItems, setMergedItems] = useState(null); // まとめ領収書の場合のみセット(複数sale分の明細)
  const [error, setError] = useState(null);
  // ★2026-08-06実装: プレビュー画面でも宛名・敬称・但し書き・受領日・受領方法をその場で修正できるようにする
  const [editing, setEditing] = useState(false);
  const [editRecipientName, setEditRecipientName] = useState("");
  const [editHonorific, setEditHonorific] = useState("様");
  const [editMemo, setEditMemo] = useState("衣装代");
  const [editReceivedDate, setEditReceivedDate] = useState("");
  const [editPaymentType, setEditPaymentType] = useState("現金");
  const [savingEdit, setSavingEdit] = useState(false);
  const [editError, setEditError] = useState(null);
  // ★2026-08-14実装: 画面表示中の領収書をPDF化して共有シートへ直接渡すためのref・state
  const captureRef = useRef(null);
  const [sharingPdf, setSharingPdf] = useState(false);
  const [shareError, setShareError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      // ★2026-07-19実装: 個別発行・まとめ発行のどちらにも対応するため、まず sale.receipt_id から領収書を取得する
      //   (旧データ互換のため receipt_id が無い場合のみ sale_id での逆引きにフォールバック)
      const receiptQuery = sale.receipt_id
        ? supabase.from("receipts").select("id,receipt_number,issue_date,recipient_name,honorific,memo,received_date,payment_type,subtotal_jpy,tax_jpy,total_jpy,issuer_info").eq("id", sale.receipt_id).maybeSingle()
        : supabase.from("receipts").select("id,receipt_number,issue_date,recipient_name,honorific,memo,received_date,payment_type,subtotal_jpy,tax_jpy,total_jpy,issuer_info").eq("sale_id", sale.id).maybeSingle();

      const { data, error } = await receiptQuery;
      if (cancelled) return;
      if (error || !data) { setError("領収書の取得に失敗しました"); setReceipt(false); return; }
      setReceipt(data);
      setEditRecipientName(data.recipient_name || "");
      setEditHonorific(data.honorific || "様");
      setEditMemo(data.memo || "衣装代");
      setEditReceivedDate(data.received_date || data.issue_date);
      setEditPaymentType(data.payment_type || "現金");

      // この領収書が複数の販売記録(まとめ発行)に紐づいているか確認する
      const { data: links, error: linksErr } = await supabase.from("receipt_sales").select("sale_id").eq("receipt_id", data.id);
      if (cancelled) return;
      if (!linksErr && links && links.length > 1) {
        const saleIds = links.map((l) => l.sale_id);
        const { data: allItems, error: itemsErr } = await supabase
          .from("sale_items")
          .select("id,unit_price_jpy,products(product_name,size,product_code)")
          .in("sale_id", saleIds);
        if (cancelled) return;
        setMergedItems(itemsErr ? [] : (allItems || []));
      }
    })();
    return () => { cancelled = true; };
  }, [sale.id, sale.receipt_id]);

  const items = mergedItems !== null ? mergedItems : (sale.sale_items || []);
  const clubName = sale.host_clubs ? sale.host_clubs.name : "-";

  // ★2026-08-06実装: プレビュー画面での宛名・敬称・但し書きの修正をreceipts行へ直接保存する
  //   (receipt.idを直接指定するため、個別発行・まとめ発行のどちらでも同じロジックで動く)
  const handleSaveEdit = async () => {
    if (!receipt) return;
    setEditError(null);
    if (!editRecipientName.trim()) { setEditError("宛名を入力してください"); return; }
    if (!editReceivedDate) { setEditError("受領日を入力してください"); return; }
    setSavingEdit(true);
    const { data, error } = await supabase
      .from("receipts")
      .update({
        recipient_name: editRecipientName.trim(),
        honorific: editHonorific,
        memo: editMemo.trim() || "衣装代",
        received_date: editReceivedDate,
        payment_type: editPaymentType,
      })
      .eq("id", receipt.id)
      .select("id,receipt_number,issue_date,recipient_name,honorific,memo,received_date,payment_type,subtotal_jpy,tax_jpy,total_jpy,issuer_info")
      .single();
    setSavingEdit(false);
    if (error || !data) { setEditError("保存に失敗しました"); return; }
    setReceipt(data);
    setEditing(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <div
        className="w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <div className="flex items-center justify-between mz-no-print">
          <h2 className="font-display text-lg">領収書プレビュー</h2>
          <button onClick={onClose} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>
            閉じる
          </button>
        </div>

        {receipt === null && (
          <p className="text-sm mz-no-print" style={{ color: "var(--mz-ink-muted)" }}>読み込み中...</p>
        )}
        {error && (
          <p className="text-sm rounded-lg px-3 py-2 mz-no-print" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{error}</p>
        )}

        {receipt && (
          <>
            {/* ★2026-08-06実装: 宛名・敬称・但し書きのその場編集(印刷対象外) */}
            <div className="mz-no-print">
              {!editing ? (
                <button
                  type="button" onClick={() => setEditing(true)}
                  className="text-xs px-2.5 py-1.5 rounded-lg"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
                >
                  宛名・受領日など編集
                </button>
              ) : (
                <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--mz-surface-hover)", border: "1px solid var(--mz-border)" }}>
                  {editError && (
                    <p className="text-xs rounded-lg px-3 py-2" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{editError}</p>
                  )}
                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>宛名</label>
                      <input
                        type="text" value={editRecipientName} onChange={(e) => setEditRecipientName(e.target.value)}
                        className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
                        style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                      />
                    </div>
                    <div>
                      <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>敬称</label>
                      <select value={editHonorific} onChange={(e) => setEditHonorific(e.target.value)}
                        className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
                        <option value="様">様</option>
                        <option value="御中">御中</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>但し書き</label>
                    <input
                      type="text" value={editMemo} onChange={(e) => setEditMemo(e.target.value)}
                      placeholder="衣装代"
                      className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
                      style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>受領日</label>
                      <input
                        type="date" value={editReceivedDate} onChange={(e) => setEditReceivedDate(e.target.value)}
                        className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent"
                        style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}
                      />
                    </div>
                    <div>
                      <label className="block text-xs mb-1.5" style={{ color: "var(--mz-ink-muted)" }}>受領方法</label>
                      <select value={editPaymentType} onChange={(e) => setEditPaymentType(e.target.value)}
                        className="w-full rounded-lg px-3 py-2.5 text-sm bg-transparent" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink)" }}>
                        <option value="現金">現金</option>
                        <option value="振込">振込</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button
                      type="button" onClick={handleSaveEdit} disabled={savingEdit}
                      className="flex-1 rounded-lg py-2 text-sm font-medium disabled:opacity-50"
                      style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                    >
                      {savingEdit ? "保存中..." : "保存"}
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setEditing(false);
                        setEditError(null);
                        setEditRecipientName(receipt.recipient_name || "");
                        setEditHonorific(receipt.honorific || "様");
                        setEditMemo(receipt.memo || "衣装代");
                        setEditReceivedDate(receipt.received_date || receipt.issue_date);
                        setEditPaymentType(receipt.payment_type || "現金");
                      }}
                      className="flex-1 rounded-lg py-2 text-sm"
                      style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
                    >
                      キャンセル
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* 画面プレビュー用(通常表示)。PDF化にもこのDOMをそのまま使う */}
            <div ref={captureRef}>
              <ReceiptDocument receipt={receipt} items={items} clubName={clubName} />
            </div>

            {shareError && (
              <p className="text-xs rounded-lg px-3 py-2 mz-no-print" style={{ background: "#3a1f22", color: "#f2b8bd" }}>{shareError}</p>
            )}

            {/* ★2026-08-14実装: 画面表示中の領収書をその場でPDF化し、対応端末では
                navigator.share()で共有シートへ直接渡す(LINE等のアプリもここから選べる)。
                Web Share APIやファイル共有に非対応の環境では、別タブでの印刷方式にフォールバックする。 */}
            <button
              onClick={async () => {
                if (!captureRef.current || sharingPdf) return;
                setShareError(null);
                setSharingPdf(true);
                try {
                  const canvas = await html2canvas(captureRef.current, { scale: 2, backgroundColor: "#ffffff" });
                  const imgData = canvas.toDataURL("image/png");
                  const { jsPDF } = window.jspdf;
                  const pdf = new jsPDF({ unit: "mm", format: "a4" });
                  const pageWidth = pdf.internal.pageSize.getWidth();
                  const pageHeight = pdf.internal.pageSize.getHeight();
                  const imgWidth = pageWidth;
                  const imgHeight = (canvas.height * imgWidth) / canvas.width;

                  // A4 1枚に収まらない場合(まとめ領収書で品目が多い等)は複数ページに分割する
                  let heightLeft = imgHeight;
                  let position = 0;
                  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
                  heightLeft -= pageHeight;
                  while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                  }

                  const fileName = `${buildReceiptFileName(receipt, clubName)}.pdf`;
                  const blob = pdf.output("blob");
                  const file = new File([blob], fileName, { type: "application/pdf" });

                  if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: fileName });
                  } else {
                    // Web Share API(ファイル共有)未対応の環境向けフォールバック:
                    // 領収書だけの独立した静的HTMLを別タブで開き、そちらで印刷/共有してもらう
                    const printWindow = window.open("", "_blank");
                    if (!printWindow) {
                      alert("ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してから、もう一度お試しください。");
                      return;
                    }
                    const html = buildReceiptPrintHtml(receipt, items, clubName);
                    printWindow.document.open();
                    printWindow.document.write(html);
                    printWindow.document.close();
                    printWindow.onload = () => {
                      printWindow.focus();
                      printWindow.print();
                    };
                  }
                } catch (e) {
                  // ユーザーが共有シートをキャンセルした場合もここに来るため、エラー表示はしない
                  if (e && e.name !== "AbortError") {
                    setShareError("PDFの生成/共有に失敗しました。時間をおいて再度お試しください。");
                  }
                } finally {
                  setSharingPdf(false);
                }
              }}
              disabled={sharingPdf}
              className="mz-no-print w-full rounded-lg py-2.5 text-sm font-medium disabled:opacity-60"
              style={{ background: "var(--mz-gold)", color: "#1a1710" }}
            >
              {sharingPdf ? "PDFを生成中..." : "PDFを共有/保存"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function SaleCard({ sale, onDelete, onEdit, onViewReceipt, onConfirmOrder }) {
  const [expanded, setExpanded] = useState(false);
  const clubName = sale.host_clubs ? sale.host_clubs.name : "-";
  const hostName = sale.hosts ? sale.hosts.name : null;
  const receiptNumber = sale.receipts ? sale.receipts.receipt_number : null;
  const items = sale.sale_items || [];
  // ★2026-07-19実装: 「新規仕入で追加」かつ未確認の明細があれば「発注未確認」バッジを表示する(2.29参照)
  const unconfirmedItems = items.filter((it) => it.is_new_purchase && !it.order_confirmed);
  // ★2026-08-04実装: 仕入額(JPY)・利益(JPY)を、商品の現在の確定原価から都度計算して表示する
  //   (保存済みのsale_items.profit_jpyに頼らず、常に最新の原価と連動させるため。2.30参照)
  const itemsWithProfit = items.map((it) => {
    const costJpy = it.products ? productCostJpy(it.products) : 0;
    const profitJpy = itemPretaxJpy(it.unit_price_jpy) - costJpy;
    // ★2026-08-17実装: 明細にCNYの内訳(商品代/中国国内送料/国際送料/その他手数料)も出す(2.36参照)。
    //   JPYは「ウォレットのFIFO消化で確定した円建て原価」で、CNYは「実際に入力した元建ての金額」。
    //   仕入先やBuckyDropの明細と突き合わせるのは元建てのほうなので、両方見えるようにする。
    const pr = it.products || {};
    const cny = {
      purchase: Number(pr.purchase_amount_cny) || 0,
      domestic: Number(pr.domestic_shipping_cny) || 0,
      shipping: Number(pr.shipping_cny) || 0,
      fee: Number(pr.fee_cny) || 0,
    };
    cny.total = cny.purchase + cny.domestic + cny.shipping + cny.fee;
    return { ...it, costJpy, profitJpy, cny };
  });
  const totalProfitJpy = itemsWithProfit.reduce((sum, it) => sum + it.profitJpy, 0);
  return (
    <div className="rounded-xl p-4 space-y-2" style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}>
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="min-w-0">
          <div className="flex items-center gap-2 flex-wrap mb-1">
            <span className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>{sale.transaction_date}</span>
            {receiptNumber && (
              <button
                onClick={() => onViewReceipt(sale)}
                className="text-xs px-2 py-0.5 rounded-full"
                style={{ background: "var(--mz-surface-hover)", color: "var(--mz-gold-soft)" }}
              >
                No.{receiptNumber} ・領収書を見る
              </button>
            )}
            {unconfirmedItems.length > 0 && (
              <button
                onClick={() => onConfirmOrder(unconfirmedItems.map((it) => it.id))}
                className="text-xs px-2 py-0.5 rounded-full"
                style={{ background: "#3a2a1f", color: "var(--mz-gold)" }}
                title="クリックで発注確認済みにする"
              >
                発注未確認({unconfirmedItems.length})
              </button>
            )}
          </div>
          <p className="text-sm font-medium truncate">{clubName}{hostName ? ` / ${hostName}` : ""}</p>
        </div>
        <div className="flex items-center gap-3 shrink-0">
          <div className="text-right">
            <span className="font-display text-base block" style={{ color: "var(--mz-gold-soft)" }}>{fmtJPY(sale.total_amount_jpy)}</span>
            <span className="text-[11px] block" style={{ color: totalProfitJpy >= 0 ? "var(--mz-ink-muted)" : "#f2b8bd" }}>利益 {fmtJPY(totalProfitJpy)}</span>
          </div>
          <button onClick={() => onEdit(sale)} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}>編集</button>
          <button onClick={() => onDelete(sale)} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ border: "1px solid var(--mz-border)", color: "#f2b8bd" }}>削除</button>
        </div>
      </div>

      {items.length > 0 && (
        <div>
          <button
            type="button" onClick={() => setExpanded((v) => !v)}
            className="text-xs" style={{ color: "var(--mz-ink-muted)" }}
          >
            {expanded ? "▲ 明細を閉じる" : `▼ 明細を見る(${items.length}点)`}
          </button>
          {expanded && (
            <div className="mt-2 space-y-2 pt-2" style={{ borderTop: "1px solid var(--mz-border)" }}>
              {itemsWithProfit.map((it) => (
                <div key={it.id} className="text-xs">
                  <div className="flex items-center justify-between gap-2">
                    <span className="truncate" style={{ color: "var(--mz-ink)" }}>
                      {saleItemLabel(it)}
                      {it.is_new_purchase && !it.order_confirmed && (
                        <span className="ml-1.5" style={{ color: "var(--mz-gold-soft)" }}>(発注未確認)</span>
                      )}
                    </span>
                    <span className="shrink-0" style={{ color: "var(--mz-ink-muted)" }}>{fmtJPY(it.unit_price_jpy)}</span>
                  </div>
                  <div className="flex items-center justify-end gap-3 mt-0.5" style={{ color: "var(--mz-ink-muted)" }}>
                    <span>仕入 {fmtJPY(it.costJpy)}</span>
                    <span style={{ color: it.profitJpy >= 0 ? "var(--mz-gold-soft)" : "#f2b8bd" }}>利益 {fmtJPY(it.profitJpy)}</span>
                  </div>
                  {/* ★2026-08-17実装: CNYの内訳。全て0円(返品在庫など)の場合は表示しない(2.36参照) */}
                  {it.cny.total > 0 && (
                    <div className="flex flex-wrap justify-end gap-x-2.5 gap-y-0.5 mt-0.5 text-[11px]" style={{ color: "var(--mz-ink-muted)" }}>
                      <span>商品代 {fmtCnyCompact(it.cny.purchase)}</span>
                      <span>国内送料 {fmtCnyCompact(it.cny.domestic)}</span>
                      <span>国際送料 {fmtCnyCompact(it.cny.shipping)}</span>
                      <span>手数料 {fmtCnyCompact(it.cny.fee)}</span>
                      <span style={{ color: "var(--mz-ink)" }}>計 {fmtCnyCompact(it.cny.total)} CNY</span>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---- 販売登録ページ本体 ---- */
/* ============================================================
   発注リマインドパネル(OrderReminderModal) ★2026-07-19実装
   ・販売登録の保存後、その販売で「新規仕入で追加」した商品(=その場で仕入確定したが
     仕入先への実際の発注はまだの商品)を一覧表示し、発注漏れを防ぐための案内パネル。
   ・仕入原価(CNY)の記帳・ウォレット消化は登録時点で完了済みだが、
     実際に仕入先(代行/工場)へ発注する作業自体は別途必要なため、
     このパネルで対象商品を明示する(2.28参照)。
   ============================================================ */
function OrderReminderModal({ products, onClose, onConfirmed }) {
  const [saving, setSaving] = useState(false);

  // ★2026-07-19実装: 「発注しました」を押した時点でsale_items.order_confirmedをtrueにし、
  //   販売一覧の「発注未確認」バッジからも外れるようにする(2.29参照)
  const handleConfirm = async () => {
    setSaving(true);
    const ids = products.map((p) => p.id);
    const { error } = await supabase.from("sale_items").update({ order_confirmed: true }).in("id", ids);
    setSaving(false);
    if (error) { alert("発注確認済みへの更新に失敗しました。お手数ですが販売一覧のバッジから再度お試しください。"); }
    onConfirmed();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(0,0,0,0.6)" }}>
      <div
        className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto"
        style={{ background: "var(--mz-surface)", border: "1px solid var(--mz-border)" }}
      >
        <div className="flex items-center gap-2">
          <span
            className="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
            style={{ background: "#3a2a1f", color: "var(--mz-gold)" }}
          >
            <Icon name="tag" className="w-4 h-4" />
          </span>
          <div>
            <h2 className="font-display text-base leading-tight">発注が必要な商品</h2>
            <p className="text-xs mt-0.5" style={{ color: "var(--mz-ink-muted)" }}>
              {products.length}点、仕入先への発注をお忘れなく
            </p>
          </div>
        </div>

        <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
          今回の販売で「新規仕入で追加」した商品です。原価の記帳は完了していますが、仕入先(代行・工場)への実際の発注はまだ済んでいません。
        </p>

        <div className="rounded-lg divide-y" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
          {products.map((p) => (
            <div key={p.id} className="flex items-center gap-3 px-3 py-2.5">
              {p.product_image_url ? (
                <img src={p.product_image_url} alt="" className="w-12 h-12 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
              ) : (
                <div className="w-12 h-12 rounded-md flex items-center justify-center shrink-0" style={{ background: "var(--mz-surface-hover)" }}>
                  <Icon name="tag" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
                </div>
              )}
              <div className="min-w-0 flex-1">
                <p className="text-sm truncate">{p.product_name || "(名称未設定)"}</p>
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                  {[p.category, p.size, p.product_code ? `No.${p.product_code}` : ""].filter(Boolean).join(" / ")}
                </p>
              </div>
              {p.product_url && <CopyUrlButton url={p.product_url} />}
            </div>
          ))}
        </div>

        <div className="flex gap-2">
          <button
            type="button" onClick={onClose}
            className="shrink-0 rounded-lg px-4 py-2.5 text-sm"
            style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
          >
            あとで確認する
          </button>
          <button
            type="button" onClick={handleConfirm} disabled={saving}
            className="flex-1 rounded-lg py-2.5 text-sm font-medium disabled:opacity-50"
            style={{ background: "var(--mz-gold)", color: "#1a1710" }}
          >
            {saving ? "更新中..." : "発注しました・確認しました"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ★2026-07-19実装: 仕入先URLをクリックでクリップボードにコピーするための共通ボタン */
function CopyUrlButton({ url }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      window.prompt("コピーしてください:", url);
      return;
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <button
      type="button" onClick={handleCopy} title={url}
      className="text-xs px-2.5 py-1.5 rounded-lg shrink-0"
      style={copied ? { border: "1px solid var(--mz-gold)", color: "var(--mz-gold)" } : { border: "1px solid var(--mz-border)", color: "var(--mz-gold-soft)" }}
    >
      {copied ? "コピーしました" : "仕入先URLをコピー"}
    </button>
  );
}

/* ============================================================
   未発注リスト(UnorderedListTab) ★2026-07-19実装
   ・全ての販売記録を横断して、「新規仕入で追加」かつ未確認(order_confirmed=false)の
     明細だけを一箇所にまとめて表示する。保存直後のポップアップを見逃した場合や、
     過去の登録分もまとめて確認・発注確認できるようにするための一覧(2.29参照)。
   ============================================================ */
function UnorderedListTab({ sales, onConfirmOrder }) {
  const unorderedItems = useMemo(() => {
    const rows = [];
    for (const s of sales) {
      for (const it of (s.sale_items || [])) {
        if (it.is_new_purchase && !it.order_confirmed) {
          rows.push({
            id: it.id,
            saleId: s.id,
            transactionDate: s.transaction_date,
            clubName: s.host_clubs ? s.host_clubs.name : "-",
            hostName: s.hosts ? s.hosts.name : null,
            product: it.products || {},
          });
        }
      }
    }
    // 販売日が古いものから表示(発注漏れが長期化しているものを優先的に目に付かせる)
    rows.sort((a, b) => (a.transactionDate || "").localeCompare(b.transactionDate || ""));
    return rows;
  }, [sales]);

  return (
    <div className="space-y-4">
      <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
        「新規仕入で追加」した商品のうち、まだ発注確認が済んでいないものを全ての販売記録から横断して一覧表示します({unorderedItems.length}点)。
      </p>

      {unorderedItems.length === 0 ? (
        <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>未発注の商品はありません</p>
      ) : (
        <div className="rounded-lg divide-y" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
          {unorderedItems.map((row) => (
            <div key={row.id} className="flex items-center gap-3 px-3 py-3">
              {row.product.product_image_url ? (
                <img src={row.product.product_image_url} alt="" className="w-14 h-14 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
              ) : (
                <div className="w-14 h-14 rounded-md flex items-center justify-center shrink-0" style={{ background: "var(--mz-surface-hover)" }}>
                  <Icon name="tag" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
                </div>
              )}
              <div className="min-w-0 flex-1">
                <p className="text-sm truncate">{row.product.product_name || "(名称未設定)"}</p>
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                  {[row.product.category, row.product.size, row.product.product_code ? `No.${row.product.product_code}` : ""].filter(Boolean).join(" / ")}
                </p>
                <p className="text-xs mt-0.5" style={{ color: "var(--mz-ink-muted)" }}>
                  {row.transactionDate} ・ {row.clubName}{row.hostName ? ` / ${row.hostName}` : ""}
                </p>
              </div>
              <div className="flex flex-col items-end gap-1.5 shrink-0">
                {row.product.product_url && <CopyUrlButton url={row.product.product_url} />}
                <button
                  type="button" onClick={() => onConfirmOrder([row.id])}
                  className="text-xs px-2.5 py-1.5 rounded-lg"
                  style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                >
                  発注確認済みにする
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   再仕入れ検討(ReorderReviewTab) ★2026-08-04実装
   ・「在庫から追加」で売れた展示用サンプル(処分用は対象外)を全ての販売記録から横断して一覧表示し、
     その場でブラウザconfirm()に即答させるのではなく、あとでまとめて「再仕入れする/しない」を
     判断できるようにする(2.31参照)
   ============================================================ */
function ReorderReviewTab({ sales, onDecide }) {
  const candidates = useMemo(() => {
    const rows = [];
    for (const s of sales) {
      for (const it of (s.sale_items || [])) {
        if (it.reorder_candidate && !it.reorder_decided) {
          rows.push({
            id: it.id,
            saleId: s.id,
            transactionDate: s.transaction_date,
            clubName: s.host_clubs ? s.host_clubs.name : "-",
            hostName: s.hosts ? s.hosts.name : null,
            unitPriceJpy: it.unit_price_jpy != null ? Number(it.unit_price_jpy) : null, // 前回の実売価格
            product: it.products || {},
          });
        }
      }
    }
    rows.sort((a, b) => (a.transactionDate || "").localeCompare(b.transactionDate || ""));
    return rows;
  }, [sales]);

  const handleReorder = (row) => {
    // ★2026-08-04実装: 「再仕入れする」を選ぶと、商品名・URL・カテゴリ等を引き継いだ状態で
    //   サンプル・在庫の新規登録画面を開く(既存のpendingProductPrefillの仕組みを再利用)
    /* ★2026-08-24変更: ここでは判断済みにしない。実際に登録できた時点で消す(2.31参照)。
       参考販売価格には前回の実売価格(unit_price_jpy)を入れる。 */
    pendingProductPrefill = {
      type: "sample",
      sample_purpose: "展示用",
      product_image_url: row.product.product_image_url || "",
      product_url: row.product.product_url || "",
      product_name: row.product.product_name || "",
      category: row.product.category || "",
      size: row.product.size || "",
      size_options: row.product.size_options || "",
      selling_price_jpy: row.unitPriceJpy != null ? row.unitPriceJpy : (row.product.selling_price_jpy != null ? row.product.selling_price_jpy : null),
    };
    pendingReorderSaleItemId = row.id;
    window.location.hash = "#/products";
  };

  return (
    <div className="space-y-4">
      <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
        「在庫から追加」で売れた展示用サンプルのうち、再仕入れするかまだ判断していないものを全ての販売記録から横断して一覧表示します({candidates.length}点)。
      </p>

      {candidates.length === 0 ? (
        <p className="text-sm text-center py-10" style={{ color: "var(--mz-ink-muted)" }}>該当する商品はありません</p>
      ) : (
        <div className="rounded-lg divide-y" style={{ border: "1px solid var(--mz-border)", borderColor: "var(--mz-border)" }}>
          {candidates.map((row) => (
            <div key={row.id} className="flex items-center gap-3 px-3 py-3">
              {row.product.product_image_url ? (
                <img src={row.product.product_image_url} alt="" className="w-14 h-14 rounded-md object-cover shrink-0" style={{ border: "1px solid var(--mz-border)" }} />
              ) : (
                <div className="w-14 h-14 rounded-md flex items-center justify-center shrink-0" style={{ background: "var(--mz-surface-hover)" }}>
                  <Icon name="tag" className="w-5 h-5" style={{ color: "var(--mz-ink-muted)" }} />
                </div>
              )}
              <div className="min-w-0 flex-1">
                <p className="text-sm truncate">{row.product.product_name || "(名称未設定)"}</p>
                <p className="text-xs" style={{ color: "var(--mz-ink-muted)" }}>
                  {[row.product.category, row.product.size, row.product.product_code ? `No.${row.product.product_code}` : ""].filter(Boolean).join(" / ")}
                </p>
                <p className="text-xs mt-0.5" style={{ color: "var(--mz-ink-muted)" }}>
                  {row.transactionDate} ・ {row.clubName}{row.hostName ? ` / ${row.hostName}` : ""}
                </p>
                {/* ★2026-08-24: 前回いくらで売れたか・サイズ展開を一覧に出す。
                    これを確認するためだけに登録画面を開かなくて済むようにする(2.31参照) */}
                {row.unitPriceJpy != null && (
                  <p className="text-xs mt-0.5" style={{ color: "var(--mz-gold-soft)" }}>
                    前回の販売価格: {fmtJPY(row.unitPriceJpy)}
                  </p>
                )}
                {row.product.size_options && (
                  <p className="text-xs break-words" style={{ color: "var(--mz-ink-muted)" }}>
                    サイズ展開: {row.product.size_options}
                  </p>
                )}
              </div>
              <div className="flex flex-col items-end gap-1.5 shrink-0">
                <button
                  type="button" onClick={() => handleReorder(row)}
                  className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                  style={{ background: "var(--mz-gold)", color: "#1a1710" }}
                >
                  再仕入れする
                </button>
                <button
                  type="button" onClick={() => onDecide(row.id)}
                  className="text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap"
                  style={{ border: "1px solid var(--mz-border)", color: "var(--mz-ink-muted)" }}
                >
                  再仕入れ不要
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   まとめ領収書発行(MergeReceiptTab) ★2026-07-19実装
   ・複数のホストが個別に注文した販売記録を横断的に選択し、
     1枚の領収書(宛名は自由入力・通常はお店名)にまとめて発行するための機能。
   ・各販売記録は個別発行のまま(sales.receipt_id ⇔ receipts.sale_id の1:1)残しておくのが原則だが、
     まとめ発行した場合は、対象の販売記録のreceipt_idを新しい領収書に付け替え、
     receipt_sales に紐付けを記録する。元の個別領収書は、他のどの販売記録からも
     参照されなくなった時点で削除する(2.29参照)。
   ============================================================ */
function MergeReceiptTab({ sales, clubs, onIssued }) {
  const [clubFilter, setClubFilter] = useState("");
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [recipientName, setRecipientName] = useState("");
  const [honorific, setHonorific] = useState("様");
  const [memo, setMemo] = useState("衣装代");
  const [receivedDate, setReceivedDate] = useState(todayISO());
  const [paymentType, setPaymentType] = useState("現金");
  const [issuing, setIssuing] = useState(false);
  const [error, setError] = useState(null);

  const filteredSales = useMemo(() => {
    if (!clubFilter) return sales;
    return sales.filter((s) => s.host_club_id === clubFilter);
  }, [sales, clubFilter]);

  const selectedSales = useMemo(() => sales.filter((s) => selectedIds.has(s.id)), [sales, selectedIds]);

  const toggleSelect = (saleId) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(saleId)) next.delete(saleId); else next.add(saleId);
      return next;
    });
  };

  // 選択が変わったら宛名の初期値を提案する(最初に選んだ注文のホストクラブ名)。
  // 既に手入力されている場合は上書きしない。
  useEffect(() => {
    if (recipientName.trim()) return;
